to buy those instead. I borrowed a friend's similar pair for a train journey and noticed how uncomfortable it was after an hour. That helped me wait a little longer. When I eventually tried the pair I'd been saving for, I knew what to check.", "I bought the headphones just before a long train trip and managed to read for nearly the whole journey. I still use them most days, which makes me glad I waited for a pair I really wanted. I hope I'll be as patient the next time I'm tempted to buy something I haven't budgeted for."], "phrase": ["put money aside", "存下一笔钱"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "当季", "zh": "童年学到的技能", "en": "A skill you picked up as a child", "id": "p2-27", "related": "p3-27", "questions": [{"prompt": "Describe a skill you picked up as a child.", "hooks": ["九岁外公教补胎", "水中找气泡·第一次漏", "补丁撑不住·第二次等久一点", "几周后独立补了"], "answer": ["When I think about this question, the first thing that comes to mind is the time my grandfather taught me how to mend a puncture. I rode a bike almost every day, so I was annoyed whenever I had to wait for someone else to fix it.", "We put the inner tube in a bowl of water and looked for bubbles. He let me find the hole and stick the patch on myself. My first attempt leaked, so we started again and pressed it down for longer.", "My grandfather didn't get annoyed when the first patch came off. He asked me to put the tube back in the water so I could see where it was still leaking. I remember feeling pleased when we tried the second patch and there were no bubbles. We put the wheel back on before it got dark, and I rode home.", "I managed to repair another puncture a few weeks later. I remember being proud because I'd stopped seeing a flat tyre as something that could ruin the whole afternoon. In the future, I think I will show my younger cousins how to mend a puncture, just as my grandfather showed me."], "phrase": ["mend a puncture", "修补轮胎漏气处"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "当季", "zh": "礼貌听完不感兴趣的话题", "en": "Listening politely to a topic you didn't care for", "id": "p2-28", "related": "p3-28", "questions": [{"prompt": "Talk about your experience of listening politely to a topic you didn't care for.", "hooks": ["朋友说了半小时汽车", "问为什么愿意修旧车", "听进去了"], "answer": ["I'd like to talk about a conversation I had with a friend who wanted to tell me all about a car. He went into a lot of detail about engines and different models, and I lost track of what he was saying after the first few minutes. Cars have never really been my thing.", "I kept listening because he'd spent plenty of time listening to me go on about my own interests. Eventually I asked why he wanted that particular car when the newer one seemed easier to look after. He told me it was the same model his dad had driven when he was a kid, and that he'd always wanted to learn how to fix one himself.", "Once he'd said that, I understood why he cared so much. I still couldn't tell you what kind of engine it had, but I remember the story about his dad. It made me realise that when I've lost interest in the subject, a question about the person can bring me back into the conversation. Overall, I feel I'm a more patient listener now that I know to ask why a subject matters to the person talking."], "phrase": ["go on about something", "没完没了地聊某事"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "never really been my thing", "zh": "不太合我的兴趣"}, {"kind": "批改稿", "en": "patient listener", "zh": "耐心的倾听者"}]}, {"label": "课堂完整范例 · 听朋友讲不感兴趣的汽车", "hooks": ["朋友聊发动机半小时", "还人情·问简单问题", "体谅对方·更耐心"], "answer": ["I remember having a long conversation with a friend who was extremely interested in cars. He spent nearly half an hour explaining different engines, models and technical features. To be honest, cars have never been a major interest of mine, so I couldn't follow every detail.", "I continued listening mainly because he was clearly excited about the topic. He had listened patiently to me talk about my own interests many times, so I felt it was only fair to return the favour. I asked a few simple questions and tried to focus on the parts I could understand rather than pretending to be an expert.", "At first, I was slightly bored, but the conversation became more enjoyable once I paid attention to why the subject mattered to him. I realised that listening is not always about being interested in the topic itself; sometimes it is a way of showing respect for the person speaking. I still wouldn't say I became a car enthusiast afterwards, but the experience made me a more patient listener."], "phrase": ["return the favour", "回报对方的善意"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Talk about your experience of listening politely to a topic you didn't care for.", "courseVocab": [{"kind": "批改稿", "en": "return the favour", "zh": "回报善意"}, {"kind": "批改稿", "en": "patient listener", "zh": "耐心的倾听者"}]}], "lesson": "倾听与换位思考", "extended": true}, {"kind": "事件", "status": "当季", "zh": "在店里受到好服务", "en": "Good service you received in a shop", "id": "p2-29", "related": "p3-29", "questions": [{"prompt": "Describe good service you received in a shop.", "hooks": ["徒步鞋磨脚·进店", "试走发现脚跟滑·换系法", "先试上坡·脚跟不滑了", "没花钱·全程穿同双"], "answer": ["I'm going to tell you about a shoe shop where a member of staff helped me get my walking boots to fit properly. I expected the assistant to suggest a more expensive pair.", "She asked me to walk round the shop and noticed that the heel was moving. Then she showed me a different way to tie the laces and let me try it on a short ramp. The boots felt much better.", "The ramp made quite a difference because on the flat floor I couldn't really tell what was wrong. On the slope my heel kept lifting. With the laces tied differently, I went back up a few times and it stayed in place. She even undid the laces and asked me to do them again so I'd remember how.", "I left without buying anything, and I used those boots for the whole holiday. I remember the service because she actually helped me deal with the problem I'd come in with. Overall, I feel more comfortable going back to that shop, because I know I can ask a question without feeling pushed to buy something."], "phrase": ["rub my ankle", "磨我的脚踝"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "当季", "zh": "和朋友度过的愉快夜晚", "en": "An evening you enjoyed with friends", "id": "p2-30", "related": "p3-30", "questions": [{"prompt": "Describe an evening you enjoyed with friends.", "hooks": ["朋友实习结束来我家", "第一锅破·少包点馅", "补包下一锅·朋友聊近况", "坐地上聊·没别的安排"], "answer": ["When it comes to this topic, the first thing that comes to mind is an evening when a few friends came over to make dumplings. We decided to make dumplings because everyone could help, even if they'd never made them.", "The first few split open when we cooked them, so we tried using less filling. While the second batch cooked, we sat on the kitchen floor and caught up on things we'd missed over the past few months.", "While we were waiting, one friend opened a bottle of juice and another told us a story about her last day at work. A couple of us were still covered in flour when we sat down to eat. We kept going back to the kitchen to see if there were any dumplings left. Nobody seemed in a hurry to go.", "I remember laughing more than I had in weeks. We didn't have to get anywhere on time or make the evening feel special. Having the whole kitchen to ourselves was enough. I hope we make time to enjoy each other's company like that again once everyone's schedules settle down."], "phrase": ["catch up on things", "聊聊最近错过的事"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "批改稿", "en": "enjoy each other's company", "zh": "享受彼此陪伴"}]}], "stories": ["p2-u3"], "extended": true}, {"kind": "事件", "status": "当季", "zh": "常做却觉得浪费时间的事", "en": "A regular activity you find unproductive", "id": "p2-31", "related": "p3-31", "questions": [{"prompt": "Describe a regular activity you find unproductive.", "hooks": ["等做饭时刷短视频", "刷四十分钟·忘给妹妹打电话", "意识到下意识点开·换放音乐", "移出首页多一道停顿"], "answer": ["When I think about this question, the first thing that comes to mind is my habit of watching short videos while dinner is cooking. A few minutes wouldn't bother me, but I tend to carry on after I've eaten, even if I'm no longer interested.", "One evening I opened the app to watch a clip a friend sent. When I looked up, nearly forty minutes had passed and I couldn't remember most of what I'd watched. I'd meant to call my sister that evening.", "For the first few days, I kept tapping the space where the app had been without even thinking. That showed me how automatic the habit had become. Now I usually put some music on while I cook. If I still feel like watching something afterwards, I choose one clip and try to leave it there.", "I moved the app off my home screen after that. I still watch clips sometimes, but the extra step gives me a moment to ask whether I've actually got time for it. I'm glad I've found a way to wind down after work that leaves me time to call people I care about."], "phrase": ["carry on after dinner", "晚饭后继续做"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "wind down", "zh": "放松下来"}]}], "extended": true}, {"kind": "事件", "status": "当季", "zh": "印象深的庆祝聚会", "en": "A memorable celebration", "id": "p2-32", "related": "p3-32", "questions": [{"prompt": "Describe a memorable celebration.", "hooks": ["十来个人在伦敦过中秋", "自带菜·分月饼", "异乡有了家的感觉"], "answer": ["I'd like to talk about a Mid-Autumn Festival dinner I went to at a friend's flat in London. There were about ten of us. Most of us were studying abroad at the time, and I'd spent that afternoon getting messages and photos from my family back home.", "Everyone brought something to eat, and I remember pushing two little tables together because we'd run out of room for the dishes. One friend had managed to get mooncakes and cut them into small pieces so we could try all the flavours. We stayed at the table long after the food had gone, comparing what our families used to do for the festival.", "What stayed with me was how much it felt like home by the end of the evening. We'd put very little planning into it. We just knew the festival meant something to all of us and wanted to spend it together. Now when I'm away for a holiday, I try to make a small plan with friends instead of letting it pass like an ordinary day. Overall, I feel that the evening brought us closer, and I'd love to host a similar get-together myself."], "phrase": ["run out of room", "没有地方放了"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"]}, {"label": "课堂完整范例 · 朋友家的中秋饭局", "hooks": ["伦敦朋友家·十人", "过节不能回家·分享菜和月饼", "小聚像家·不排节目"], "answer": ["The party that comes to mind was a Mid-Autumn Festival dinner I had with a group of close friends in London. It was held at a friend's flat in the evening, and there were around ten of us altogether.", "The main purpose was to celebrate the festival together because most of us were living abroad and couldn't spend it with our families. Everyone brought something small to share, and we had a mixture of Chinese dishes, snacks and mooncakes. We also played music, chatted for hours and took lots of photos.", "What impressed me most was not the size of the party, because it was actually quite small, but the warm atmosphere. Living overseas can sometimes make traditional festivals feel a little lonely. That evening, however, it felt as if we had created a temporary family of our own. I also enjoyed the fact that there was no complicated schedule; people simply relaxed and enjoyed each other's company. It remains memorable because it made an ordinary flat in London feel surprisingly like home."], "phrase": ["enjoy each other’s company", "享受彼此陪伴"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Describe a memorable celebration."}], "stories": ["p2-u3"], "lesson": "节日与思乡", "extended": true}, {"kind": "事件", "status": "当季", "zh": "帮助过别人的一次经历", "en": "A time you gave someone practical help", "id": "p2-33", "related": "p3-33", "questions": [{"prompt": "Describe a time you gave someone practical help.", "hooks": ["图书馆练汇报", "计时·删背景·改发音", "讲完还能答提问"], "answer": ["I'm going to tell you about a classmate I gave a hand with an English presentation at uni. We were working on the same project, and she was worried about having to speak for five minutes in front of the class. She'd written out everything she wanted to say, but as soon as she lost her place, she'd stop speaking.", "We met at the library a few evenings before the presentation. I timed her first attempt and noticed that the background was taking up nearly half the talk. We moved her strongest example to the beginning and shortened a couple of slides. Then we picked out a few words she wanted to practise saying. I asked her to try the talk again with just three prompts on a card. That also helped her get out of the habit of trying to memorise every word.", "On the day, she looked up more than she had in any of our practice runs and still had time to take a question. I was really pleased for her. It was nice to see how much more confident she sounded once she'd found a way of explaining things in her own words. Overall, I feel much more comfortable giving feedback when I know the other person still has space to find their own words."], "phrase": ["take up half the talk", "占掉演讲时间的一半"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "批改稿", "en": "gave a hand", "zh": "帮忙"}]}, {"label": "课堂完整范例 · 同学的英文汇报", "hooks": ["小组项目·同学怕做英文汇报", "图书馆改结构和发音", "临场答问·支持有成效"], "answer": ["I'd like to talk about a time when I helped one of my classmates prepare for an important English presentation. It happened last year at university, when we were working on a group project. She was quite nervous because she was not very confident about speaking in front of a large audience.", "I decided to help mainly because I had more experience with presentations and I could see that she was genuinely stressed. We met in the library a few evenings before the presentation. First, I helped her reorganise the content so that the main ideas were easier to follow. Then we practised several times together. I also pointed out a few pronunciation problems and suggested that she slow down instead of trying to memorise every single sentence.", "On the day of the presentation, she did much better than she had expected. She spoke clearly and managed to answer the lecturer's questions confidently. I felt really pleased, not because I had done anything extraordinary, but because a small amount of support made a noticeable difference. It also reminded me that helping someone can be rewarding for both people."], "phrase": ["make a noticeable difference", "产生明显影响"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Describe a time you gave someone practical help.", "courseVocab": [{"kind": "课件", "en": "slow down", "zh": "放慢节奏"}, {"kind": "批改稿", "en": "made a noticeable difference", "zh": "产生明显影响"}]}], "lesson": "帮同学准备英文汇报", "extended": true}, {"kind": "事件", "status": "保留", "zh": "一次早起", "en": "A morning when you got up unusually early", "id": "p2-34", "related": "p3-34", "questions": [{"prompt": "Describe a morning when you got up unusually early.", "hooks": ["周六五点·看河边日出", "公交犯困·只有骑车人与摊子", "摊主架炉子·天慢慢亮", "熟悉地方空下来不同"], "answer": ["When it comes to this topic, the first thing that comes to mind is a Saturday when I got up at five to watch the sun come up over the river. We wanted to see the sunrise, and the river path was a good half hour from my flat.", "I put my clothes out the night before, but I still nearly fell asleep on the first bus. When we arrived, there were only a few cyclists and a couple of people setting up a breakfast stall. We watched the sky get brighter over the water. Once I was properly awake, I could enjoy the tranquillity.", "The stall holder was setting out a few folding stools, so we stopped for something warm to drink. We could see lights on the other bank going off one by one as the morning got brighter. By the time we walked back to the bus stop, the usual weekend crowd was starting to arrive and we felt like we'd had the place to ourselves.", "I was tired by lunchtime, but I'm glad we went. It was a part of the city I knew well, and seeing it that empty made it feel quite different. Overall, I feel that a quiet start like that is worth getting up for every now and then."], "phrase": ["set up a stall", "摆摊"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "enjoy the tranquillity", "zh": "享受宁静"}]}], "extended": true, "stories": ["p2-course-hike"]}, {"kind": "事件", "status": "保留", "zh": "不得不改变近期计划", "en": "A recent plan you had to rearrange", "id": "p2-35", "related": "p3-35", "questions": [{"prompt": "Describe a recent plan you had to rearrange.", "hooks": ["送别友人的河畔野餐", "大雨预报·改地铁旁咖啡馆", "有人已经备好食物·提前发消息", "大家仍见面·目的达成"], "answer": ["When I think about this question, the first thing that comes to mind is a farewell picnic I had to move indoors because of the weather. We'd agreed on a riverside spot and asked everyone to bring one thing they could share.", "The day before, the rain forecast got much worse. I called a café near the metro and booked space there, then sent everyone a clear message saying exactly where to go and what they no longer needed to bring.", "I was worried that a couple of people had already made food to share. I asked them to bring anything they could take home again, rather than carrying everything through the rain. One friend met us after her shift because the café was right by her station. The move actually made it easier for her to come.", "Almost everyone made it, including a friend who was coming straight from work. I realised the part that mattered was having time together. Changing the venue was annoying, but we still got that. I'm glad we were able to adjust the plan without making it harder for people to come."], "phrase": ["change the venue", "更换场地"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "adjust the plan", "zh": "调整计划"}]}], "extended": true, "stories": ["p2-course-hike", "p2-course-delay"]}, {"kind": "事件", "status": "保留", "zh": "团队合作", "en": "Working as part of a group", "id": "p2-36", "related": "p3-36", "questions": [{"prompt": "Talk about your experience of working as part of a group.", "hooks": ["四人研究校园咖啡馆", "问题不一致·改统一分班", "统一问法·发现人午饭找座", "报告变清楚·先定方法"], "answer": ["I'd like to talk about a group project about how students used the café on our campus. We had two weeks to interview customers and produce a short report.", "At first, we all asked slightly different questions and got answers we couldn't compare. We agreed on a short list, divided the busiest hours between us and put the responses in a shared document. I turned the main points into charts.", "Once we'd collected the answers in the same way, we could see that the lunchtime problem was mostly about seats. People who came later cared more about how long it took to get served. When I put that in two separate charts, a point we'd been arguing about for days suddenly made much more sense.", "The report was much clearer than our first draft. The experience taught me how useful it is to agree on a method before everyone goes off to do their own part. I hope I'll remember to agree on a method first the next time I have to work in a team."], "phrase": ["agree on a method", "就方法达成一致"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true, "stories": ["p2-course-clothes", "p2-course-trees"]}, {"kind": "事件", "status": "保留", "zh": "做过的重要决定", "en": "An important choice you made", "id": "p2-37", "related": "p3-37", "questions": [{"prompt": "Describe an important choice you made.", "hooks": ["搬出去上大学", "自由与账单", "学会照顾自己"], "answer": ["I'm going to tell you about my decision to move out and share a flat when I started university. My campus was close enough to commute from home, so I could have stayed with my parents. I wanted to see what it would be like to organise everything myself, though, so I decided to share a flat with another student.", "The first couple of weeks were exciting. Then I realised there was nobody to remind me about bills or make dinner when I got home late. My flatmate and I kept buying the same things, so we put a list on the fridge and took turns doing the shopping. I started making a rough budget so I could handle my own finances, because I'd spent far too much in the first month.", "It wasn't an easy decision, especially because living at home would have been cheaper. I'm glad I made it, though. I've got better at looking after myself and working things out with other people, which has made me feel more independent. Overall, I feel that handling my own finances helped me become more independent."], "phrase": ["make a rough budget", "做个大致预算"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "handle my own finances", "zh": "管理自己的财务"}, {"kind": "课件", "en": "become more independent", "zh": "变得更独立"}]}], "stories": ["p2-u4"], "lesson": "大学与独立", "extended": true}, {"kind": "事件", "status": "保留", "zh": "棘手的技术问题", "en": "A tricky technology problem you dealt with", "id": "p2-38", "related": "p3-38", "questions": [{"prompt": "Describe a tricky technology problem you dealt with.", "hooks": ["会议屏幕的图表变样", "表格链接断·同时做静态备份", "先做备用副本·分头解决", "开会赶上·带独立副本"], "answer": ["When it comes to this topic, the first thing that comes to mind is a technical problem my team had just before a presentation. We noticed it during a rehearsal about twenty minutes before people were due to arrive.", "We opened an older copy and found that the spreadsheet linked to the slides had been moved. One colleague repaired the links while I exported a version with static images in case the charts still failed.", "I remember being tempted to keep refreshing the file because we were running out of time. My colleague suggested we split up the work. I exported the charts so we had something we could definitely show, while she found the missing spreadsheet. We tested both versions before anyone came in, which made it easier to stay calm.", "Both versions were ready by the start of the meeting. It was a stressful twenty minutes, but afterwards I always took a backup copy that didn't depend on other files loading properly. I'm glad we had enough time to make a backup, and I now check that a presentation can run without linked files."], "phrase": ["a backup copy", "备份副本"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "stories": ["p2-u2"], "extended": true}, {"kind": "事件", "status": "保留", "zh": "发消息后很久没收到回复", "en": "Waiting a long time for a reply", "id": "p2-39", "related": "p3-39", "questions": [{"prompt": "Talk about your experience of waiting a long time for a reply.", "hooks": ["发邮件借社区活动室", "等一周打电话·负责人不在", "等回复耽误报名·电话问清", "当天下午确认·以后写最晚回复"], "answer": ["When I think about this question, the first thing that comes to mind is the time I was left waiting for a reply about booking a community room. The date was getting close, and I needed to know before asking people to sign up.", "I waited nearly a week and then called. The receptionist checked and found that the person who normally handled bookings was away. She put me through to someone else, who confirmed the room that afternoon.", "I didn't want to invite people if they might have to change their plans again later, so the workshop was effectively on hold. When I finally got through, the receptionist checked the room while I was still on the phone. I sent the sign-up message that evening and made a note of which number to call for the next booking.", "I was relieved I'd called instead of assuming the room was unavailable. Since then, I include a date by which I need an answer if the timing is important. I hope I remember to ask for a reply date whenever other people's plans depend on the answer."], "phrase": ["put me through", "给我转接"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "改变一个重要看法", "en": "Changing your mind about an important issue", "id": "p2-40", "related": "p3-40", "questions": [{"prompt": "Talk about your experience of changing your mind about an important issue.", "hooks": ["曾觉得居家效率总高", "发一上午消息·当面十分钟", "消息越解释越长·当面画图", "写东西在家·讨论去办公室"], "answer": ["I'd like to talk about how I changed my mind about working from home full-time. I liked the idea of having no commute and being able to concentrate without people talking near my desk.", "During a team project, though, we spent a whole morning sending messages about an issue we solved in ten minutes the next day in person. I started noticing which kinds of work went well at home and which were easier together.", "The issue was fairly simple once someone sketched it on a whiteboard. The day before, I'd written a long message trying to explain the same thing and someone had understood it differently. It made me notice how easily we can spend time checking what people mean, especially when everybody's looking at a slightly different version of the work.", "Now I'd choose a mix if I had the option. I can write quietly at home, but I'd rather be in the office for an early discussion when nobody has a clear plan yet. Overall, I feel that having a choice of where to work helps me strike a better balance between concentrating and talking things through."], "phrase": ["choose a mix", "选择混合方式"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "strike a better balance", "zh": "找到平衡"}]}], "extended": true, "stories": ["p2-course-film"]}, {"kind": "事件", "status": "保留", "zh": "近期做出的改变", "en": "A change you made recently", "id": "p2-41", "related": "p3-41", "questions": [{"prompt": "Describe a change you made recently.", "hooks": ["晚饭后不再直接坐桌前", "十五分钟路线·鞋放门边", "忙到不想动·先走到街角", "轻松回来再处理剩下事"], "answer": ["I'm going to tell you about a small change I made to wind down after dinner. I'd noticed that sitting down again made the whole day feel like one long stretch of work.", "I chose a route round the block that only takes fifteen minutes. At first I had to remind myself to go, so I put my walking shoes by the door before I started cooking. A friend sometimes comes along.", "There were a couple of evenings when I wanted to skip it. A friend suggested I just walk to the corner and come back if I still felt tired. Most times I kept going once I got outside. Giving myself that option took away the feeling that I had another thing on my list to get through.", "Now it's something I look forward to. I usually come back ready to do whatever still needs doing, and if I'm done for the day, it helps me relax a bit sooner. I hope I keep that habit even on days when I can only manage a short walk."], "phrase": ["round the block", "绕街区一圈"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "wind down", "zh": "放松下来"}]}], "stories": ["p2-u1", "p2-u4"], "extended": true}, {"kind": "事件", "status": "保留", "zh": "电子设备使用出问题", "en": "A device that let you down", "id": "p2-42", "related": "p3-42", "questions": [{"prompt": "Describe a device that let you down.", "hooks": ["火车上电子书卡住", "长按充电都没用·手机看文章", "电纸书画面在但按键没反应", "回家重启·出门备读物"], "answer": ["When it comes to this topic, the first thing that comes to mind is the time my e-reader froze in the middle of a long train journey. The screen was stuck on the same page, and I had another three hours before I reached my stop.", "I held the power button down and tried charging it from my bag, but the screen didn't change. Then I remembered I'd saved a few articles on my phone. I read those until we arrived and looked up the reset instructions at home.", "The page was still perfectly readable, which made the whole thing a bit confusing. I kept thinking the next press of the button would do something. After a while I turned it over and put it away. I found a couple of articles I'd saved about the place I was visiting, and they actually made the journey go faster.", "The reset worked, and I finished the book the next day. I still use the device, though I keep something else to read when I'm going away for more than a day. In the future, I think I will always take something else to read on a long trip."], "phrase": ["the screen was stuck", "屏幕卡住了"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "花钱不多却特别的出游", "en": "A memorable day out on a small budget", "id": "p2-43", "related": "p3-43", "questions": [{"prompt": "Describe a memorable day out on a small budget.", "hooks": ["姐妹想省钱公交去河边", "自带三明治旧毯·看船", "最便宜安排·看小船靠岸", "只付车费却能慢慢聊"], "answer": ["When I think about this question, the first thing that comes to mind is a low-cost afternoon my sister and I spent by the river. We wanted a day away from our usual routine, but neither of us wanted to spend much just before payday.", "We made sandwiches at home and took an old blanket. At the park, we followed a path we hadn't tried before and found a spot where small boats passed every few minutes. We stayed there for nearly two hours.", "We hadn't picked a spot in advance, so we just followed the water until we saw a bit of shade. We ate our sandwiches there and watched a small boat trying to pull in against the current. Neither of us had checked the time for a while. To me, that was as relaxing as any day out I'd paid much more for.", "The only thing we paid for was the bus. What made it special was having an unhurried afternoon together, especially because we usually just meet for a quick coffee. Overall, I feel that spending quality time with her mattered more than what we did or how much we spent."], "phrase": ["an unhurried afternoon", "不赶时间的一下午"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "spending quality time", "zh": "好好相处"}]}], "stories": ["p2-u1", "p2-course-hike"], "extended": true}, {"kind": "事件", "status": "当季", "zh": "改变重要决定", "en": "Revising a major decision", "id": "p2-44", "related": "p3-44", "questions": [{"prompt": "Talk about your experience of revising a major decision.", "hooks": ["选一年制晚课跨城", "实测到家近十一点", "体验夜路·选新的课程", "就近改短课·每周都到"], "answer": ["I'd like to talk about my decision to drop a long evening course across town in favour of one closer to home. I liked the course outline and had already told a friend I was going to sign up.", "Before paying, I did the journey at the time the class would finish. I realised I wouldn't get home until nearly eleven. I looked again and found a shorter course within walking distance that covered the main skills I wanted.", "The journey wasn't terrible on paper. What I hadn't allowed for was the wait between trains if I left late in the evening. I stood on the platform for nearly twenty minutes on my test run, which gave me plenty of time to think about doing it every week. I was much more certain about choosing the local class after that.", "I chose the local course and managed to attend every week. I was a little reluctant to change my mind after telling people, but the new plan turned out to be much easier to stick to. I'm glad I weighed the pros and cons before paying, because I ended up with a course I could actually attend."], "phrase": ["stick to the plan", "坚持执行计划"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "weighed the pros and cons", "zh": "权衡利弊"}, {"kind": "课件", "en": "within walking distance", "zh": "步行可达"}]}], "extended": true}, {"kind": "事件", "status": "当季", "zh": "印象深刻的课程", "en": "A course that stayed with you", "id": "p2-45", "related": "p3-45", "questions": [{"prompt": "Describe a course that stayed with you.", "hooks": ["选修课·语言与科技", "酒吧人声实验", "开始自己找资料"], "answer": ["I'm going to tell you about an optional course at university that got me interested in how people understand speech. I signed up because I'd heard a voice assistant misunderstanding the same word over and over, and I wanted to know why it was so hard for a machine to get it right.", "In one class we listened to recordings with other people talking in the background. I could follow a friend's voice much more easily than a stranger's, even though they were reading the same sentences. The teacher asked us what clues we'd been using, and we realised we recognised things like the way our friend stressed certain words. I remember trying it again in a noisy café later that week.", "I didn't come away knowing everything, but it piqued my interest enough to make me watch a few lectures on my own. What I've kept from that class is the habit of noticing things I used to take for granted, like how easily we follow a familiar voice in a noisy room. I hope I'll be able to delve deeper into the subject when I've got a bit more time."], "phrase": ["take something for granted", "觉得某事理所当然"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "piqued my interest", "zh": "激起兴趣"}, {"kind": "课件", "en": "delve deeper into", "zh": "深入了解"}, {"kind": "课件", "en": "take for granted", "zh": "视为理所当然"}]}], "stories": ["p2-u2", "p2-course-history"], "lesson": "学习与挑战", "extended": true}, {"kind": "事件", "status": "当季", "zh": "采访过一位知名人士", "en": "Interviewing someone well known", "id": "p2-46", "related": "p3-46", "questions": [{"prompt": "Talk about your experience of interviewing someone well known.", "hooks": ["大学通讯采访本地主持", "随口追问第一次直播卡壳", "开头准备太多·追问救场", "得到最好的故事"], "answer": ["When it comes to this topic, the first thing that comes to mind is a short interview I did with a local radio presenter for our university newsletter. She'd come to speak at a campus event, and the organiser gave me ten minutes with her afterwards.", "I was nervous and nearly read my questions word for word. Then she mentioned going blank during her first live show, so I asked what she did in that moment. She told me her colleague had quietly pointed to the next item on the running order.", "I nearly missed the interesting part because I was looking down to see which question came next. Then I noticed she was laughing about going completely blank, which wasn't something I'd expected to hear. I put my notes down and asked her to tell me what she could see in the studio at that moment. Her answer gave me the opening for the article.", "That became the best part of the article. It taught me that preparation helps, but you get a better conversation if you listen carefully enough to ask a follow-up. I hope I can trust myself to ask one good follow-up question the next time I'm interviewing someone."], "phrase": ["go blank", "脑子突然一片空白"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "为学习另一门语言做过的事", "en": "Something you did to learn another language", "id": "p2-47", "related": "p3-47", "questions": [{"prompt": "Describe something you did to learn another language.", "hooks": ["找西语伙伴每周互练", "每次准备场景·卡词用简单话", "咖啡馆问路·用近义方式说", "几个月后不怕忘词"], "answer": ["When I think about this question, the first thing that comes to mind is a weekly language exchange that helped me speak Spanish more often. We met online every Wednesday and split the call into ten minutes for each language.", "I usually picked one situation before the call, like asking how to get somewhere. If I couldn't say what I meant, I tried explaining it in simpler words. At the end, my partner gave me two phrases I could use next time.", "Once I wanted to ask which way round a square I'd need to go, but I couldn't remember the word for corner. I said something like 'the place where the two streets meet' and my partner got it straight away. The phrase she gave me afterwards was useful, but I remember how good it felt that we'd understood each other already.", "After a few months, I was much less worried about forgetting a word. The calls helped because there was a real person trying to understand me, and I had to find a way to keep going. Overall, I feel more willing to step out of my comfort zone and try explaining something another way."], "phrase": ["explain it in simpler words", "用更简单的话解释"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "step out of my comfort zone", "zh": "走出舒适区"}]}], "extended": true}, {"kind": "事件", "status": "当季", "zh": "在公共场所弄丢东西", "en": "Losing something in a public place", "id": "p2-48", "related": "p3-48", "questions": [{"prompt": "Talk about your experience of losing something in a public place.", "hooks": ["菜市场丢姐姐送的伞", "返回摊位·被送到入口", "问颜色和挂绳·确认是我的", "关门前拿回·以后挂包"], "answer": ["I'd like to talk about the time I lost an umbrella at a crowded food market. It was a folding one that my sister had given me, and I noticed it was missing just as the rain got heavier.", "I went back to the last two open-air food stalls and asked if anyone had seen it. A stall holder remembered me putting it down while I took out my wallet. Someone had picked it up and taken it to a desk by the entrance.", "At the desk, they asked what it looked like before showing me the umbrellas people had handed in. I remembered my sister had tied a little blue ribbon to the loop because we had the same model. That was how I knew it was mine. I called her on the way home and told her the ribbon had finally come in handy.", "I got it back just before closing time. I was relieved, partly because it was a gift and partly because I still had a long walk home. Now I attach the loop to my bag when I'm indoors. I hope I keep that habit, especially when I take something with me that I can't easily replace."], "phrase": ["attach the loop to my bag", "把挂绳挂在包上"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "open-air food stalls", "zh": "露天小吃摊"}]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "成功组织开心的活动", "en": "A happy event you helped organise", "id": "p2-49", "related": "p3-49", "questions": [{"prompt": "Describe a happy event you helped organise.", "hooks": ["给图书馆志愿者办告别早餐", "送货迟了·喝茶写卡", "早餐迟到·用卡片填上空档", "聊了很久·轻松道别"], "answer": ["I'm going to tell you about a breakfast I organised to thank the volunteers at a library project. A few of them were about to leave town, so I wanted something everyone could come to before their day got busy.", "I asked about food preferences and ordered from a bakery nearby. The delivery was late, so I put out tea and asked people to write a message in a card while we waited. That kept everyone busy and gave us something nice to give the library staff.", "I'd asked everyone to come at once because a few people had work soon afterwards. When the food still hadn't arrived, I brought out a card we'd meant to sign at the end. People started writing little things they remembered from the project. By the time the pastries came, a couple of them were reading their messages aloud.", "People stayed talking much longer than I'd expected. I was happy because we'd spent weeks working together, and the breakfast gave us a relaxed way to say goodbye. Overall, I feel the morning worked because everyone had a chance to say what the project meant to them."], "phrase": ["put out tea", "把茶准备好供大家取用"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "stories": ["p2-u3"], "extended": true}, {"kind": "事件", "status": "当季", "zh": "省下很多时间的方法", "en": "A change that saves you time", "id": "p2-50", "related": "p3-50", "questions": [{"prompt": "Describe a change that saves you time.", "hooks": ["考试撞兼职", "任务按截止日排·每天15分钟", "不再临时赶"], "answer": ["When it comes to this topic, the first thing that comes to mind is a short planning habit that helped me juggle my exams and a part-time job. I started doing it when I was preparing for exams and working part-time. I'd get home tired, open my laptop and spend the first twenty minutes just deciding what to do.", "Now I write down the two or three things that actually need doing and put the one with the nearest deadline first. If a deadline is just around the corner, I give it my best half hour before I check my messages. If a task feels too big, I give myself a specific starting point. For example, instead of writing 'revise psychology', I'll write 'spend fifteen minutes explaining the terms from chapter two'. I can sit down and do that straight away.", "I still change my plan if something comes up, but I waste less time getting started, especially on workdays. It's also easier to stop at a reasonable time because I know what I've already got done and what can wait until tomorrow. Overall, I feel much more in control when I prioritise tasks by deadline before opening my laptop."], "phrase": ["have a specific starting point", "有个明确的着手点"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "around the corner", "zh": "快到了"}, {"kind": "课件", "en": "prioritise tasks", "zh": "按轻重缓急安排任务"}]}], "lesson": "备考与时间管理", "extended": true, "stories": ["p2-course-exams"]}, {"kind": "事件", "status": "保留", "zh": "长时间堵车", "en": "A long time spent in a traffic jam", "id": "p2-51", "related": "p3-51", "questions": [{"prompt": "Describe a long time spent in a traffic jam.", "hooks": ["假期首日高速客车堵", "封道消息·通知爸妈·分饼干", "公交停时与陌生人聊天·消息减压", "晚两小时·有消息没那么焦虑"], "answer": ["When I think about this question, the first thing that comes to mind is a long traffic jam I got stuck in on the coach back to my hometown. It was the first day of a holiday, and we practically stopped moving for an hour.", "At first I kept checking the arrival time. Then the driver said there was a lane closure ahead, so I told my parents I'd miss dinner. I put on a podcast and ended up sharing a packet of biscuits with the person next to me.", "The person next to me was also going home for the holiday. We compared the food our families usually made and had both been looking forward to getting back in time for dinner. Once I'd let my parents know, there wasn't much else to do. I stopped refreshing the map every few minutes and the wait felt a little shorter.", "We reached the station nearly two hours late. It was tiring, but being able to tell my family what was happening made it less stressful than sitting there with no information. I'm glad I was able to let my family know, and I'd leave myself more time on a holiday weekend now."], "phrase": ["a lane closure", "车道封闭"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "想进行的骑行或自驾旅行", "en": "A road trip you'd like to take", "id": "p2-52", "related": "p3-52", "questions": [{"prompt": "Describe a road trip you'd like to take.", "hooks": ["春天想和妹妹骑运河线", "火车到起点·村里过夜", "不追里程·带简单修理工具", "想随时停车看风景"], "answer": ["I'd like to talk about a cycling trip along a canal that I'd like to take with my sister. We both ride fairly often, but neither of us has tried a trip where the bike is our main way of getting around.", "We'd take a train to the starting town and spend two days following the water. I'd plan to stop in one village overnight so we wouldn't have to carry much. We'd leave enough time to look around rather than setting a strict target for each hour.", "I'd take a basic repair kit and plan where we could get water, because there are long stretches with very little nearby. Apart from that, I'd keep the timetable fairly loose. If we found a good place to eat, we could spend longer there. We could always catch a train for the final stretch if we got tired.", "The appeal is being able to stop when something catches our eye. On a train journey I always see places I'd like to explore, but they're gone before I can even read the signs. I hope we can take our time and still have enough energy to explore the village when we get there."], "phrase": ["catch our eye", "吸引我们的注意"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true, "stories": ["p2-course-yunnan"]}, {"kind": "事件", "status": "当季", "zh": "不喜欢的电影", "en": "A film that disappointed you", "id": "p2-53", "related": "p3-53", "questions": [{"prompt": "Describe a film that disappointed you.", "hooks": ["和朋友看瞬息全宇宙", "刚开始跟不上", "最后记住母女"], "answer": ["I'm going to tell you about Everything Everywhere All at Once, a film I expected to enjoy more than I did. I watched it at home with a friend who'd been telling me I'd love it. I'd seen the trailer and knew there'd be a lot going on, but I thought I'd find it easier to follow once I knew who the characters were.", "For the first part of the film I kept trying to work out which version of each character I was watching. The editing felt chaotic at first, and the scenes shifted so fast that I wanted a minute to take in what had just happened. My friend was laughing at little details I'd missed, which made me feel even further behind.", "There was a quieter moment near the end when I realised how much of the film was about a mother and daughter trying to understand each other. That part was much more moving than I'd expected. That scene worked for me, but I came away wishing the film had spent a bit more time on their relationship. I think I went in expecting a story I could get into more easily. Overall, I feel the relationship between the mother and daughter resonated with me most when the film slowed down enough to let me follow it."], "phrase": ["take in what just happened", "消化刚发生的事"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "editing felt chaotic", "zh": "剪辑让人觉得混乱"}, {"kind": "课件", "en": "resonated with me", "zh": "让我有共鸣"}]}], "lesson": "电影与观影感受", "extended": true, "stories": ["p2-course-film"]}, {"kind": "事件", "status": "当季", "zh": "读过的精彩书籍", "en": "A book that kept you turning the pages", "id": "p2-54", "related": "p3-54", "questions": [{"prompt": "Describe a book that kept you turning the pages.", "hooks": ["姐妹继承房子·火车读", "信件推翻理解·姐姐知情", "车上追读·回去重翻先前一页", "紧张在家人是否可信"], "answer": ["When it comes to this topic, the first thing that comes to mind is a novel about two sisters who find old letters hidden in a house. I took it on a train trip because my friend had said the first chapter was easy to get into.", "Each letter made me rethink something I'd already read. About halfway through, I realised one of the sisters knew much more than she'd admitted. I remember checking how long I had left before my station because I wanted to finish the chapter.", "At one point one of the letters seemed to be addressed to a different person from the one I'd expected. I went back a few pages to check an earlier conversation, and it made much more sense on a second reading. I liked having that moment of working it out for myself before the book spelled it out for me.", "I liked that it was exciting without needing a chase in every scene. The suspense came from wondering whether I could trust what people said about their own family. I hope I find another book with a plot full of twists and turns that still makes sense when you look back."], "phrase": ["easy to get into", "很容易读进去"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "full of twists and turns", "zh": "情节多次反转"}]}], "extended": true, "stories": ["p2-course-history"]}, {"kind": "事件", "status": "保留", "zh": "看过的有趣视频", "en": "An online video that caught your interest", "id": "p2-55", "related": "p3-55", "questions": [{"prompt": "Describe an online video that caught your interest.", "hooks": ["刷到机械钟维修片", "部件铺开·磨损使指针停", "慢镜头对比·听滴答", "外行能跟上·期待第一声"], "answer": ["When I think about this question, the first thing that comes to mind is a short video I found about someone repairing a mechanical clock. It came up while I was looking for something else, and the close-up of the moving parts made me stop scrolling.", "The person took the clock apart and laid each piece on a separate square of paper. She showed how one small part had worn down and why that stopped the hands moving. I'd never seen the inside of a clock in that much detail.", "The person showed a close-up of two little parts so we could see where one had worn down. Then she put it all back together and waited for a few seconds with the camera still running. I stayed through that quiet bit because I wanted to know whether it would work. The first tick was surprisingly satisfying.", "I liked that I could follow the explanation even though I knew nothing about clock repair. By the end, I found myself listening for the first tick almost as carefully as she was. I hope I'll notice the same kind of detail the next time I watch a video about how something works."], "phrase": ["wear down", "逐渐磨损"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "想引入的一条新规定", "en": "A new law you'd like your country to introduce", "id": "p2-56", "related": "p3-56", "questions": [{"prompt": "Describe a new law you'd like your country to introduce.", "hooks": ["出租楼应提前列额外费用", "帮朋友发现便宜其实更贵", "对比广告上总价·省时间", "用同格式更新方便比较"], "answer": ["I'd like to talk about a rule that would make rental fees clearer to people looking for a flat. Rent is usually easy to find, but charges for parking or shared facilities can appear much later.", "I helped a friend compare two flats last year. One looked cheaper until we added several monthly charges that hadn't been mentioned in the listing. It took her extra calls to work out what she'd actually pay.", "I'd keep the listing short. It could show the rent on the first line, anything everyone has to pay on the second, and optional things like parking below. My friend could then have ruled out one of the flats while she was still at home. She wouldn't have needed to arrange a viewing or ask several people for the same figures.", "I'd require buildings to use the same short format and update it whenever a fee changes. That way people could make a meaningful comparison before taking time off to visit several places. Overall, I feel that seeing the full cost up front would help people make a more informed decision."], "phrase": ["make a meaningful comparison", "做有意义的比较"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true, "stories": ["p2-course-clothes"]}, {"kind": "事件", "status": "保留", "zh": "现场观看的体育赛事", "en": "A sports match you enjoyed in person", "id": "p2-57", "related": "p3-57", "questions": [{"prompt": "Describe a sports match you enjoyed in person.", "hooks": ["和爸爸在场馆看羽毛球", "加分局很静又爆发欢呼", "关键球过网·听全场反应", "被现场气氛拉着往前倾"], "answer": ["I'm going to tell you about a badminton match I saw live at a local sports centre with my dad. We sat close enough to hear the players' shoes on the court, which was very different from watching at home.", "One game went past the usual winning score because the players stayed so close. The room went almost silent before each serve and then erupted when one of them saved a difficult shot.", "At one point it looked as if the shuttle was about to hit the net, and the player somehow got it over. A few people around me stood up before the rally was even finished. At home I'd probably have wanted to see the replay. In the hall, I was more interested in how the players managed to stay composed under pressure and get ready for the next point.", "I didn't know either player beforehand, but by the last few points I was leaning forward like everyone else. It made me realise how much the atmosphere affects what I notice in a game. I hope we'll go to another live event together, even if we don't know who's playing when we book."], "phrase": ["save a difficult shot", "救回一记很难接的球"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "批改稿", "en": "stay composed under pressure", "zh": "在压力下保持冷静"}]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "特殊场合吃的食物", "en": "A dish served on special occasions", "id": "p2-58", "related": "p3-58", "questions": [{"prompt": "Describe a dish served on special occasions.", "hooks": ["春节亲人归家包饺子", "一起擀皮拌馅·先吃不匀的", "分工后发现包漏·厨房聊天", "备饭时一起聊天"], "answer": ["When it comes to this topic, the first thing that comes to mind is the dumplings my family makes when we get together for the Spring Festival. We normally start in the afternoon, because folding enough for everyone takes time.", "One person rolls the wrappers while someone else prepares the filling. I sit with my sister, and we're usually given the ones that come out uneven to eat first. The kitchen gets quite noisy because people are talking across the table. Once you start chatting, you realise how rarely you get to spend that much time together.", "One year we got through nearly a whole tray before noticing that I'd put too much filling in most of mine. Grandma made me watch how she left a little space around the edge. By the time we'd finished, mine were starting to look more like hers. I remember that conversation as clearly as what we ate.", "I like the dumplings themselves, especially when the filling is still hot. The main reason I associate them with holidays is that making them gives everyone something to do together before dinner. I hope we keep making them together, because it's a simple way to spend quality time with relatives."], "phrase": ["roll the wrappers", "擀饺子皮"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "spend quality time", "zh": "好好相处"}]}], "stories": ["p2-u3"], "extended": true}, {"kind": "事件", "status": "保留", "zh": "有名人出现的广告", "en": "An advertisement featuring a celebrity", "id": "p2-59", "related": "p3-59", "questions": [{"prompt": "Describe an advertisement featuring a celebrity.", "hooks": ["跑步名人清晨训练广告", "决定多跑一圈·商品最后出", "广告让人想起练习·也查实测", "人选合适·仍不足以购买"], "answer": ["When I think about this question, the first thing that comes to mind is a trainers advert where a runner stays on the track to do one more lap. It started with her tying her shoes before sunrise, then showed her training on an almost empty track.", "What I remember best is that she stopped, looked at her watch and decided to repeat a lap. The product only appeared clearly at the very end. It felt more like a small story about practice than a list of features.", "I liked the little pause before she went round again, because I'd had moments when I wanted to stop a session early. That made me remember the advert a few days later when I needed new shoes. I still looked at what other runners had said about them, especially whether they held up in the rain.", "The runner made sense as a choice because the shoes were shown in a situation she actually knew. I looked up the brand afterwards, although the advert didn't give me enough information to buy a pair. Overall, I feel that the little decision to keep running is what made the advert stick in my mind."], "phrase": ["a list of features", "一连串产品功能"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "有动物的故事", "en": "A story in which an animal plays an important role", "id": "p2-60", "related": "p3-60", "questions": [{"prompt": "Describe a story in which an animal plays an important role.", "hooks": ["女孩救受伤狐狸", "康复后想留下·看它往远处走", "女孩每天看狐狸·后来自觉少靠近", "放走才是关心"], "answer": ["I'd like to talk about a childhood story about a girl who found and helped an injured fox. A girl found it near a field and asked an adult to help. At first she hoped she could keep it once it recovered.", "As the fox got stronger, it spent less time near the girl and more time at the far end of the enclosure. She slowly understood it would do better outside. The last scene showed her watching it disappear into the trees.", "Earlier in the book the girl had gone to see the fox every day. Later she started standing much further away so it could get used to feeding on its own. I remember being impatient with that part as a child because I wanted there to be more action. It made the last scene feel a lot more earned.", "I remember that ending more clearly than the start. I liked the girl enough to want her to keep the fox, so it made me think about why caring for something might involve letting it go. Overall, I feel that the ending has stayed with me because it changed the way I understood what it meant to look after something."], "phrase": ["let it go", "让它离开"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "已有的环保规定", "en": "An environmental rule you know about", "id": "p2-61", "related": "p3-61", "questions": [{"prompt": "Describe an environmental rule you know about.", "hooks": ["超市购物袋收费", "忘带时买·后来包里常备布袋", "忘袋时买·朋友餐盒提示", "简单规则需实际替代"], "answer": ["I'm going to tell you about a rule that makes shops charge for disposable carrier bags. I first noticed the effect at a supermarket where customers started bringing their own bags or carrying small purchases by hand.", "At first I occasionally bought a bag because I'd forgotten mine. Then I began leaving a folded tote in my backpack, so the question barely comes up now. The charge was small, but it reminded me to think before getting a bag.", "I did forget to bring a bag a few times near the start. A friend told me he kept one folded inside a jacket pocket so he'd have it even on a quick trip. I put one in my backpack after that. Now when I hand over the things I've bought, I already have a place to put them.", "I like this kind of rule because it's easy to understand. I think it works better when people have a practical alternative, such as a sturdy bag they can use many times. I hope rules like that make a habit easy enough to carry on even when people stop thinking about the charge."], "phrase": ["a disposable carrier bag", "一次性购物袋"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "长期目标", "en": "A goal you'd like to reach in the long run", "id": "p2-62", "related": "p3-62", "questions": [{"prompt": "Describe a goal you'd like to reach in the long run.", "hooks": ["目标英文工作坊不看稿", "录两分钟·再练现场提问", "一次录音只有开头顺·拆成小段", "想跟国外同事合作"], "answer": ["When it comes to this topic, the first thing that comes to mind is my long-term goal of running a workshop in English without reading from a script. I can explain part of my work in a conversation, but I lose confidence if several people are listening.", "I've started recording two-minute explanations of familiar topics. Once I can do those comfortably, I'd like to try speaking to a small group and invite questions afterwards. The questions are the part I can't prepare word for word.", "I listened back to one of my first recordings and noticed that I'd spent almost half the time introducing the topic. The example I actually wanted to talk about only got one sentence. The next time I gave myself three prompts and put the example earlier. That made it easier to speak naturally and finish in the time I had.", "It matters to me because I want to work with people in other countries. Even if it takes a while, being able to explain my ideas clearly would open up the kinds of projects I can take on. Overall, I feel a sense of purpose when I can hear myself getting a little clearer each time I record something."], "phrase": ["depend on a script", "依赖讲稿"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "sense of purpose", "zh": "目标感"}]}], "stories": ["p2-u2", "p2-course-work"], "extended": true}, {"kind": "事件", "status": "保留", "zh": "希望引入的环保法", "en": "An environmental law you'd like to see introduced", "id": "p2-63", "related": "p3-63", "questions": [{"prompt": "Describe an environmental law you'd like to see introduced.", "hooks": ["水壶盖坏无配件", "店售小家电应说明维修渠道", "先问零件价·值不值得修", "不安全要有例外"], "answer": ["When I think about this question, the first thing that comes to mind is a repair rule I'd like shops that sell small appliances to follow. When my kettle lid broke, I couldn't find a replacement part even though everything else worked.", "Under the rule, a shop would have to say what parts or repair services are available before someone buys an item. It could handle repairs itself or refer customers to another business that carries the right parts.", "In my case I tried emailing the maker and got sent to a general support page. It took two phone calls to find out they didn't sell that bit separately. A clear list of common parts and what they cost would have saved all of that. I could have made up my mind in a few minutes.", "The point would be to make repair a real option before something is thrown away. There'd need to be exceptions where a repair was unsafe, and people would still decide whether the cost made sense. I hope getting a replacement part will eventually be as easy as ordering a new kettle."], "phrase": ["carry the right parts", "备有合适零件"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true, "stories": ["p2-course-trees"]}, {"kind": "事件", "status": "保留", "zh": "本地新闻", "en": "A news story people discussed locally", "id": "p2-64", "related": "p3-64", "questions": [{"prompt": "Describe a news story people discussed locally.", "hooks": ["新闻旧铁路桥改步行骑行", "不再为近路大绕行", "邻居关注上学或购物路线", "关心夜里安不安全"], "answer": ["I'd like to talk about a local story about turning a disused railway bridge into a route for walkers and cyclists. I heard about it from a neighbour who sent me a picture of the proposed route.", "People discussed it because the bridge would connect two areas that are quite close on a map but awkward to travel between. At the moment, you have to go a long way round, even if you only want to visit the market.", "A neighbour pointed out that, if the crossing felt safe, her children could get to school without going all the way round. Another person wanted to know if people would be able to take bikes onto the bridge at busy times. The story ended up starting a much more practical conversation than I'd expected from a short news item.", "I'm interested in whether the new route will feel safe after dark. I think that's an important part of whether people actually use it, especially in winter when many finish work after sunset. I hope local people get to use it after work as well as during the day."], "phrase": ["go a long way round", "绕一大圈"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "stories": ["p2-u5"], "extended": true}, {"kind": "事件", "status": "保留", "zh": "常用的应用程序", "en": "An app you find useful", "id": "p2-65", "related": "p3-65", "questions": [{"prompt": "Describe an app you find useful.", "hooks": ["公交改线下载出行应用", "对比步行量和等车时间", "去新地址·选少步行路线", "换乘出错也有备选"], "answer": ["I'm going to tell you about the public transport app I use whenever I need to go somewhere new. I first downloaded it when a bus route I normally used was changed and I needed to find a different way to work.", "I usually check two routes before leaving. The app shows how much walking each route involves and whether a bus is likely to arrive soon. That's particularly helpful if I'm carrying something and would rather do less walking.", "Last month I had to take a box to a friend's flat on the other side of town. The quickest route involved a fairly long walk between stops. The app found a route that took a few minutes longer but left me almost at the right door. I was quite glad of that when the box started feeling heavy.", "The best part is having another option when a connection goes wrong. It makes unfamiliar parts of town much easier to get around. I can leave home without having every step planned. Overall, I feel a lot less rushed when I know I can check another route if the first one goes wrong."], "phrase": ["a connection goes wrong", "换乘出了问题"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "easier to get around", "zh": "出行方便"}]}], "extended": true}, {"kind": "事件", "status": "海外补充", "zh": "离不开的物品", "en": "An everyday item you'd struggle to do without, aside from a phone or computer", "id": "p2-66", "related": "p3-66", "questions": [{"prompt": "Describe an everyday item you'd struggle to do without, aside from a phone or computer.", "hooks": ["随身小水瓶·不必频买水", "早上装一次·途中补水", "开会随身补水·很顺手", "忘带才知道常用"], "answer": ["When it comes to this topic, the first thing that comes to mind is the reusable water bottle I take with me almost everywhere. It's small enough to fit in most bags, and I bought it after a trip where I kept having to stop and buy bottles of water.", "I fill it before I leave in the morning and usually refill it at work. I took it on a long walk last month and found a fountain halfway along the route, so I didn't have to carry a second bottle.", "I usually take it into meetings too. It's easy to open without making a lot of noise, and I can refill it at the kitchen tap on the way back to my desk. I hadn't really thought of it as part of my day until I forgot it one morning and kept going off to find a glass.", "It doesn't do anything complicated, but it saves me from having to think about where I'll get a drink. I notice how often I use it whenever I leave it drying on the kitchen counter. I'm glad it's become part of my routine, because I no longer have to stop for water nearly as often."], "phrase": ["refill a bottle", "给水瓶重新装水"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "当季", "zh": "想买给朋友的礼物", "en": "A present you'd like to get for a friend", "id": "p2-67", "related": "p3-67", "questions": [{"prompt": "Describe a present you'd like to get for a friend.", "hooks": ["朋友搬新城·想送步行路线书", "从车站出发·标一条一起走", "查路线书要有停靠点·配条小纸", "能用且有相聚理由"], "answer": ["When I think about this question, the first thing that comes to mind is a book of walking routes I'd like to buy for my friend Mei. She's recently moved there and keeps saying she knows the route to work but has no idea where to go at weekends.", "I'd look for one with walks that start near a train or bus stop. She doesn't drive, and she prefers being able to stop for coffee instead of going on a long hike. I'd mark one route we could try together.", "I'd probably look through the book before buying it to make sure the directions are easy to follow. Some walking guides tell you to start in a car park and leave it at that. I'd put a little note beside a route with a café at the end and ask if she wanted to try it when I came over.", "I think she'd actually use it because she's been looking for a way to explore a bit more. I'd also like the first walk to be something we do together when I visit. I hope it gives her a reason to explore the city when she has a weekend to herself."], "phrase": ["mark a route", "标出一条路线"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "想拥有的科技产品", "en": "A piece of technology you'd like to own, aside from a phone", "id": "p2-68", "related": "p3-68", "questions": [{"prompt": "Describe a piece of technology you'd like to own, aside from a phone.", "hooks": ["想要进纸扫描仪", "集中扫旧本·定期录新纸", "要有如何归档·重找稿子", "想直接找回菜谱"], "answer": ["I'd like to talk about a small scanner I'd like to get for my handwritten notes and receipts. I keep handwritten notes and receipts, and at the moment I have to take a separate photo of every page if I want a digital copy.", "I'd use it mainly at home. I'd set aside an hour to scan older notebooks, then put new pages through whenever a pile started to build up. I'd want a model that made the files easy to name and find later.", "What slows me down at the moment is knowing I've saved an image somewhere and then having to look through a whole folder of nearly identical photos. I'd want to name a batch of notes as soon as I'd scanned it. If that part was easy, I'd probably remember to do it every time I added something new.", "I'm interested because it could make my notes easier to use after I've written them. Last month I found a useful recipe again by accident, and I'd like to be able to look for things like that deliberately. Overall, I feel I'd get more use out of my notes if I could find them again when I actually needed them."], "phrase": ["feed in a stack of papers", "送入一叠纸"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "理想工作", "en": "A job that would suit you well", "id": "p2-69", "related": "p3-69", "questions": [{"prompt": "Describe a job that would suit you well.", "hooks": ["想设计博物馆展品", "访问懂行的人·用车票讲故事", "用老车票和时刻表讲一次旅程", "结合研究设计还能观察反应"], "answer": ["I'm going to tell you about my ideal job, which would involve designing exhibits for a small museum. I'd like to work on the part that helps visitors understand why an ordinary object is worth looking at.", "On a typical project, I'd speak to people who knew the subject, choose a few stories and test how to explain them. For an exhibit about an old railway, for example, I might use a ticket and a timetable to tell the story of one journey.", "I'd like to test whether the explanation works with someone who knows very little about trains. I'd ask what they'd noticed in the ticket or what they'd still like to know about the journey. If the dates weren't interesting to them, I'd try giving them a person's story to follow as they looked round the room.", "I'd enjoy the mix of research and practical decisions, and I think it would give me a sense of purpose. I'd also get to see how people react when the work is finished, which would make it easier to learn what to improve next time. I hope I find work with a friendly working atmosphere and enough room to try out my own ideas."], "phrase": ["a mix of research and design", "研究与设计相结合"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "working atmosphere", "zh": "工作氛围"}, {"kind": "课件", "en": "sense of purpose", "zh": "目标感"}]}], "extended": true, "stories": ["p2-course-work"]}, {"kind": "事件", "status": "保留", "zh": "收到的特别蛋糕", "en": "A cake someone gave you that you remember", "id": "p2-70", "related": "p3-70", "questions": [{"prompt": "Describe a cake someone gave you that you remember.", "hooks": ["毕业收到地铁地图柠檬蛋糕", "糖霜画通勤站·标签歪", "家人认出通勤线·切前先拍照", "感动她还记得·切前拍照"], "answer": ["When it comes to this topic, the first thing that comes to mind is a lemon cake my sister decorated to look like my old metro route. It was a simple lemon cake, but she'd decorated the top to look like a little metro map using lines of coloured icing.", "I used to complain about changing trains on my way to campus, so she included the stations I went through every day. One of the labels was slightly crooked because she'd run out of space near the edge.", "My parents took a minute to work out what the coloured lines were. Once I pointed out my station, everyone started guessing which route I'd used most often. My sister had even put in a stop where I once got stuck for nearly an hour. I was glad someone took a photo before I started cutting into it.", "I thought it was funny and quite touching. She'd remembered a small detail from years of conversations. We cut it after dinner, and I asked someone to take a photo before the station names disappeared. Overall, I feel lucky she remembered such a small detail, and I hope I can make something just as personal for her."], "phrase": ["run out of space", "没有足够的空间"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "事件", "status": "保留", "zh": "喜欢看的节目", "en": "A programme you often enjoy watching", "id": "p2-71", "related": "p3-71", "questions": [{"prompt": "Describe a programme you often enjoy watching.", "hooks": ["看修复有情感价值的物件", "玩具船修漏仍留刮痕", "为什么保留刮痕·船还看得出是谁做的", "决定体现物主真正在意什么"], "answer": ["When I think about this question, the first thing that comes to mind is a programme about people repairing things their owners have an emotional attachment to. Each episode starts with an owner explaining why something matters, and then you watch the work from beginning to end.", "In one episode, a woman brought in a toy boat her father had made. The repairer fixed the part that let water in but kept most of the scratches on the deck. The owner recognised it immediately when she came back.", "What I liked about that episode was hearing the owner explain why she didn't mind the scratches. She knew exactly where one of them had come from, and it was part of the reason the boat mattered to her. The repairer checked that she could still recognise the original paint before putting the lid back on.", "I like that the programme spends time on decisions like that. You see why the owner wanted the object repaired and why making it look brand new might have changed what she liked about it. Overall, I feel it makes me look more closely at what I keep at home and why I care about it."], "phrase": ["have sentimental value", "有情感价值"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "地点", "status": "当季", "zh": "去过的吵闹场所", "en": "A place you visited that was unusually noisy", "id": "p2-72", "related": "p3-72", "questions": [{"prompt": "Describe a place you visited that was unusually noisy.", "hooks": ["考完试和朋友出门", "鼓点震地板·听不清", "出门透口气"], "answer": ["I'd like to talk about a nightclub a friend took me to after our final exams. We'd both been looking forward to going out, and I thought it'd be fun to hear some music and have a chat. We got there quite late, so it was already packed.", "The first thing I noticed was how loud the bass was. I could actually feel the floor shaking under my feet. Even songs I knew had been mixed into these really fast tracks, and people were shouting over the music. At one point my friend was right next to me and I still couldn't tell what he'd just said. We tried moving away from the speakers, but it barely made a difference.", "After a while I went outside for some air. I was so relieved to get back onto a normal street where I could hear myself think. I understood why my friend liked the place, but I think I'd choose somewhere we could actually talk next time. Overall, I feel I'd have enjoyed the evening more somewhere we could talk without shouting over the music."], "phrase": ["hear myself think", "安静到能好好想事情"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"]}, {"label": "课堂完整范例 · 晚高峰的火车站", "hooks": ["傍晚赶火车·等四十分钟", "广播行李人声·读不下去", "多个声音叠成背景声"], "answer": ["A particularly noisy place I've been to is a large railway station during the evening rush hour. I went there when I was travelling to another city, and I had to wait for my train for around forty minutes.", "The station was packed with people. There were constant announcements over the loudspeakers, children talking or crying, suitcases rolling across the floor and passengers speaking on their phones. On top of that, trains were arriving and leaving every few minutes, so there was almost no quiet moment. While I was there, I bought some food and tried to read, but it was difficult to concentrate. I wouldn't say the noise was completely unpleasant because it was part of the energy of the station, but after a while it became tiring.", "I consider it noisy mainly because there were many different sounds happening at the same time. Individually, none of them was extreme, but together they created a constant background of noise that was hard to escape."], "phrase": ["find it hard to concentrate", "难以集中注意力"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Describe a place you visited that was unusually noisy.", "courseVocab": [{"kind": "批改稿", "en": "packed with people", "zh": "挤满了人"}, {"kind": "批改稿", "en": "constant announcements", "zh": "不断的广播"}]}], "lesson": "期末后去夜店", "extended": true, "stories": ["p2-course-music"]}, {"kind": "地点", "status": "当季", "zh": "城市里喜欢去的自然景观", "en": "A green or natural spot you enjoy in your city", "id": "p2-73", "related": "p3-73", "questions": [{"prompt": "Describe a green or natural spot you enjoy in your city.", "hooks": ["社区公园离家十分钟", "雨后慢跑·关通知·坐长椅", "心里清静了"], "answer": ["I'm going to tell you about a small park within walking distance of my flat where I go to clear my mind. It's tucked away behind a main road, and once you've walked past the gate, the traffic gets noticeably quieter. I first went there one Sunday after spending most of the weekend trying to finish an assignment.", "I put my phone on silent and jogged round the park a couple of times. It had rained earlier, so I could smell the fresh grass and hear birds chirping in the trees whenever I slowed down. Afterwards I found a bench and sat there for ten minutes. I had a book in my bag, but I ended up just watching the leaves moving and giving myself a bit of time to think.", "By the time I walked home, the assignment hadn't gone away, but it felt a lot more manageable. I still go there when I've had enough of screens or want to catch up with my family over a picnic. Having somewhere like that within walking distance makes a real difference to my week. I hope I'll always have somewhere nearby to wind down and get close to nature."], "phrase": ["put my phone on silent", "把手机调成静音"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "wind down", "zh": "放松下来"}, {"kind": "课件", "en": "clear my mind", "zh": "让头脑清静"}, {"kind": "课件", "en": "get close to nature", "zh": "亲近自然"}, {"kind": "课件", "en": "birds chirping", "zh": "鸟鸣"}, {"kind": "课件", "en": "fresh grass", "zh": "新鲜草地或雨后草地"}, {"kind": "课件", "en": "within walking distance", "zh": "步行可达"}]}], "stories": ["p2-u1"], "lesson": "公园、感官细节与放松", "extended": true}, {"kind": "地点", "status": "当季", "zh": "去过的拥挤场所", "en": "A place that was crowded when you went there", "id": "p2-74", "related": "p3-74", "questions": [{"prompt": "Describe a place that was crowded when you went there.", "hooks": ["书展刚开门已排队", "人挤窄道·和朋友分头", "约在入口外重聚·碰到旧书", "下次晚点来慢慢看"], "answer": ["When it comes to this topic, the first thing that comes to mind is a weekend book fair I went to with a friend that was much more crowded than we expected. We thought we'd be early, but there was already a queue stretching past the main entrance.", "Once we got inside, people were stopping to look through boxes of books in a fairly narrow aisle. We kept losing each other and eventually agreed to meet outside after half an hour. I found a second-hand cookbook while we were apart.", "My friend sent a message saying she'd found a table selling old maps, but by the time I got there we were on opposite sides of the room again. We gave ourselves twenty minutes to look on our own. That's when I noticed the cookbook in a box by the wall, whe
