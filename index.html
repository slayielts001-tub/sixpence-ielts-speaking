ts away.", "Besides that, being able to return lets someone see more than the main sights. They can spend one afternoon walking in a park and come back for a market another weekend."], "phrase": ["a change of scene", "换个环境"], "audioId": "p3-bank-weekends", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "事件", "status": "当季", "zh": "不喜欢的电影", "en": "A film that disappointed you", "id": "p3-53", "related": "p2-53", "questions": [{"prompt": "Why do some highly advertised films leave viewers disappointed?", "hooks": ["有几个原因", "预告片把节奏剪快", "宣传吸来不对口的观众"], "answer": ["There are several reasons.", "One reason is that the trailer may make the film look faster or funnier than it really is. A few exciting scenes can give quite a different impression from the full story.", "Besides that, a big campaign brings in people who wouldn't normally choose that kind of film. Someone expecting a straightforward comedy may be disappointed by a complicated plot with a lot of twists and turns."], "phrase": ["go in with fewer expectations", "期待没那么高地开始看"], "audioId": "p3-53-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "课件", "en": "a lot of twists and turns", "zh": "情节多次反转"}]}, {"prompt": "How is watching a film at home different from going to a cinema?", "hooks": ["取决于 · the kind of film and the experience people want", "大银幕声效沉浸", "在家随意且可暂停"], "answer": ["It depends on the kind of film and the experience people want.", "If a film has impressive sound or lots of visual detail, the cinema can make it easier to get absorbed in it.", "However, if people just want a relaxed evening, watching at home is usually cheaper and they can pause or talk without bothering other viewers."], "phrase": ["get absorbed in a film", "全神贯注看一部电影"], "audioId": "p3-bank-film", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Why can short online videos be easier to remember than long explanations?", ", "hooks": ["取决于 · the routines people expect to have", "初工作者先看租金通勤", "家庭和年长者看设施及空间"], "answer": ["It depends on the routines people expect to have.", "If somebody's just starting work, rent and transport can matter most because they don't spend much time at home during the week.", "However, a family may look for more space and good schools, whereas someone in later life might prioritise easy access to shops or a doctor."], "phrase": ["easy access to local services", "方便使用当地服务"], "audioId": "p3-bank-homes", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "保留", "zh": "现场观看的体育赛事", "en": "A sports match you enjoyed in person", "id": "p3-57", "related": "p2-57", "questions": [{"prompt": "Why do some people pay to watch sport live when they can watch it at home?", "hooks": ["有几个原因", "和观众一起感受紧张", "可以自己选看哪里"], "answer": ["There are several reasons.", "One reason is that the whole crowd reacts together. You can feel the tension before a big point, which is hard to get from a screen.", "Apart from that, at the venue, you decide where to look. For example, you can watch how the other player reacts after a mistake while the camera at home follows the winner."], "phrase": ["feel the tension", "感到紧张气氛"], "audioId": "p3-57-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Is sport more valuable as recreation or as competition?", "hooks": ["取决于 · what people hope to get out of sport", "日常休闲低压享受", "比赛练抗压和合作"], "answer": ["It depends on what people hope to get out of sport.", "If people mainly want to move and spend time with friends, recreational sport makes it easier to enjoy being active without being judged.", "However, competition can be valuable when people want to challenge themselves or learn to stay composed under pressure. A team can also benefit from having a goal to work towards."], "phrase": ["have a goal to work towards", "有一个可努力的目标"], "audioId": "p3-bank-sports", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "批改稿", "en": "stay composed under pressure", "zh": "在压力下保持冷静"}]}, {"prompt": "Do people relax differently when they spend time outdoors and when they use a screen?", "hooks": ["取决于 · how tired people are and how much time they have", "白天久坐可出门换环境", "雨天累时看东西也方便"], "answer": ["It depends on how tired people are and how much time they have.", "If someone has been at a desk all day and has time to spare, getting outside can help them wind down. Even a short walk is a change of surroundings.", "However, if it's raining and they're already tired, watching something can be easier. I think it works best when they decide how long they want to spend on it before they start."], "phrase": ["a change of surroundings", "换个环境"], "audioId": "p3-bank-leisure", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "wind down", "zh": "放松下来"}]}]}, {"kind": "事件", "status": "保留", "zh": "特殊场合吃的食物", "en": "A dish served on special occasions", "id": "p3-58", "related": "p2-58", "questions": [{"prompt": "Why do special occasions often have particular foods associated with them?", "hooks": ["有几个原因", "熟悉味道连接记忆", "一起做食物有相处时间"], "answer": ["There are several reasons.", "One reason is that a familiar dish reminds people of past celebrations and gives them something to look forward to each year.", "In addition, preparing the food is often part of the occasion. Making dumplings together, for example, gives relatives time to talk before anybody sits down to eat."], "phrase": ["bring relatives together", "让亲戚相聚"], "audioId": "p3-58-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "How do celebrations away from home differ from celebrations with family?", "hooks": ["取决于 · who's there and which parts of the tradition matter to them", "家里流程已熟悉", "海外朋友带来各自做法"], "answer": ["It depends on who's there and which parts of the tradition matter to them.", "With family, people may know exactly who cooks and when everyone arrives. A familiar routine can make the day feel special even when very little changes from year to year.", "However, abroad, friends may bring several versions of the same dish or tradition. They may have to organise more themselves, but there's also a chance to do something new together."], "phrase": ["bring different versions of a tradition together", "汇集不同版本的传统"], "audioId": "p3-bank-tradition", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Do people behave differently at a party at home and at one in a public venue?", "hooks": ["取决于 · how the space is set up and what the guests want", "家聚放松能帮忙", "公共场地可认识更多人"], "answer": ["It depends on how the space is set up and what the guests want.", "At someone's home, people often chat in one group and offer to help with the food or the washing-up. That can suit friends who want to enjoy each other's company.", "However, at a larger public venue, guests can move around and meet more people. It works well for a bigger event where the host doesn't expect everyone to join the same conversation."], "phrase": ["catch up properly", "好好聊聊近况"], "audioId": "p3-bank-gather", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "批改稿", "en": "enjoy each other's company", "zh": "享受彼此陪伴"}]}]}, {"kind": "事件", "status": "保留", "zh": "有名人出现的广告", "en": "An advertisement featuring a celebrity", "id": "p3-59", "related": "p2-59", "questions": [{"prompt": "When does a celebrity make an advertisement more convincing?", "hooks": ["名人真懂所卖品类", "运动员能讲训练鞋", "还要看合脚和耐穿"], "answer": ["It helps when the person is known for using the type of product being sold.", "An athlete can talk about a training shoe in a way that sounds relevant.", "I would still want information about fit or durability, because the celebrity alone can't tell me how it will work for me."], "phrase": ["sound relevant", "听起来切题"], "audioId": "p3-59-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should viewers trust advice given by celebrities in advertisements?", "hooks": ["可听信息有限", "合作关系影响", "核对实际适配"], "answer": ["I'd take it as a starting point. The person may know about the type of product, but they're also there because a company wants to sell it.", "An athlete can explain how a shoe feels to them, for instance, while knowing very little about whether it will fit somebody else's foot.", "I'd look for independent information before spending money."], "phrase": ["independent information", "独立信息"], "audioId": "p3-bank-advert", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should someone who's good at their job try to become well known for it?", "hooks": ["取决于 · what the person wants from the job", "开店需要客户可适当公开", "工作稳定者或看重隐私"], "answer": ["It depends on what the person wants from the job.", "If someone's trying to build a business, being known locally can help customers find them. They may not need to be in the limelight all the time to get that benefit.", "However, somebody who already has steady work may care more about their privacy or about having time to improve what they do. Keeping up a public profile can become another job in itself."], "phrase": ["keep up a public profile", "维持公众曝光度"], "audioId": "p3-bank-publicity", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "in the limelight", "zh": "处在公众聚光灯下"}]}]}, {"kind": "事件", "status": "保留", "zh": "有动物的故事", "en": "A story in which an animal plays an important role", "id": "p3-60", "related": "p2-60", "questions": [{"prompt": "What can stories about animals teach children?", "hooks": ["理解别的生物需要", "放归狐狸的故事", "成人说明虚构和真实相处"], "answer": ["They can help children imagine what another living thing needs, particularly when its needs are different from a person's.", "A story about releasing a fox is a good example.", "It helps if adults also explain which details are fictional and how people should behave around real wildlife."], "phrase": ["real wildlife", "现实中的野生动物"], "audioId": "p3-60-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Should schools allow students to choose some of the books they read?", "hooks": ["选择提升动机", "教师可设范围", "共享作品也有用"], "answer": ["Yes, I'd give them some choice because students may be more willing to keep going if the subject interests them.", "A teacher can still suggest books at an appropriate level and ask students to explain why they picked one.", "There is also a place for a shared book, because discussing the same scene gives the class something specific to talk about."], "phrase": ["at an appropriate level", "处在合适的难度"], "audioId": "p3-bank-reading", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What can local parks do to get children interested in wildlife?", "hooks": ["容易观察", "短活动有具体任务", "保护动物空间"], "answer": ["I think a simple trail with things to look out for is a good start. Children can notice birds or plants without having to sit through a long explanation.", "A short guided walk could show them how to recognise one or two species and why they live there.", "The activities should also make it clear where to stand so the animals still have some space."], "phrase": ["a guided walk", "有人带领的步行活动"], "audioId": "p3-bank-nature", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "保留", "zh": "已有的环保规定", "en": "An environmental rule you know about", "id": "p3-61", "related": "p2-61", "questions": [{"prompt": "How can governments encourage people to follow environmental rules?", "hooks": ["好选择要好找好做", "垃圾分类给近桶和例子", "明白后再提醒与执行"], "answer": ["Make the preferred choice easy to see and easy to make.", "If residents have to sort rubbish, they need bins nearby and simple examples of what goes in each one.", "Clear reminders and consistent enforcement will help once people understand how the rules work."], "phrase": ["consistent enforcement", "一致的执法"], "audioId": "p3-61-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "What can individuals do for the environment, and what needs companies to act?", "hooks": ["个人购物和分类", "公司设计包装维修", "选项影响选择"], "answer": ["Individuals can choose how much they buy and sort out what they throw away, which matters when many people do it regularly.", "Companies have more control over how much packaging a product comes with and whether it can be repaired at all.", "So the choices companies make can make good habits easier or harder for everyone else."], "phrase": ["reduce unnecessary packaging", "减少不必要包装"], "audioId": "p3-bank-env", "frames": ["A 第一种情况", "B 另一种情况", "比较后的判断"], "type": "比较题"}, {"prompt": "When is a rule more effective than asking people to do the right thing voluntarily?", "hooks": ["行为影响他人", "一致标准", "可执行解释"], "answer": ["A rule makes more sense when one person's choice regularly affects other people, such as leaving rubbish in a shared area.", "It also tells everyone what standard to expect. That can be useful if people would otherwise make quite different assumptions.", "It still needs to be clear how people can follow the rule, or explaining it will achieve very little."], "phrase": ["a clear standard", "明确的标准"], "audioId": "p3-bank-rules", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "保留", "zh": "长期目标", "en": "A goal you'd like to reach in the long run", "id": "p3-62", "related": "p2-62", "questions": [{"prompt": "How can people stay motivated when a goal takes years to reach?", "hooks": ["定可见的阶段目标", "每月录音对照", "慢也看得到变化和下一步"], "answer": ["It helps to choose milestones they can actually see.", "A learner can record a short talk each month and listen for improvements.", "If the goal takes longer than expected, those recordings still show what has changed and help the person decide what to work on next."], "phrase": ["choose milestones", "设定阶段性目标"], "audioId": "p3-62-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Are personal goals easier to reach alone or with other people?", "hooks": ["取决于 · what kind of help the goal calls for", "自己练可灵活调节", "同伴给反馈与督促"], "answer": ["It depends on what kind of help the goal calls for.", "If the goal mainly involves building a habit, working alone can make it easier to practise at times that suit you and spend longer on weak points.", "However, if the goal depends on feedback, working with another person is usually more helpful. A practice partner can point out something you'd never notice on your own."], "phrase": ["keep someone accountable", "帮某人保持自我约束"], "audioId": "p3-bank-goals", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Why can small signs of progress help people stick with a difficult task?", "hooks": ["有几个原因", "知道努力有回报", "可以及时调整"], "answer": ["There are several reasons.", "One reason is that a small result shows that the work is paying off. If a learner manages one real conversation, the larger goal suddenly feels closer.", "Apart from that, early feedback shows them what to change. They can try a different way of practising before they get discouraged."], "phrase": ["stick with a difficult task", "坚持做一件难事"], "audioId": "p3-bank-support", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "课件", "en": "paying off", "zh": "取得回报"}]}]}, {"kind": "事件", "status": "保留", "zh": "希望引入的环保法", "en": "An environmental law you'd like to see introduced", "id": "p3-63", "related": "p2-63", "questions": [{"prompt": "Should companies be responsible for products after people buy them?", "hooks": ["企业负责常见故障和信息", "水壶配备用盖", "消费者按说明用并权衡维修价"], "answer": ["I think they should provide basic information and a way to repair common faults for a reasonable period.", "For example, a company could keep replacement lids available for a kettle.", "Customers would still be responsible for using it as instructed and deciding whether a repair is worth paying for."], "phrase": ["common faults", "常见故障"], "audioId": "p3-63-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why do people sometimes replace things that could be repaired?", "hooks": ["有几个原因", "维修价格时间难预估", "替换有保障"], "answer": ["There are several reasons.", "One reason is that repair can involve an uncertain price and a long wait. If someone uses their kettle every morning, they may be unwilling to wait weeks for a part.", "In addition, a replacement can feel more predictable. People know when it will arrive and may get a warranty, whereas an older item could develop a different fault soon afterwards."], "phrase": ["a spare part", "备用零件"], "audioId": "p3-bank-repair", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "What can individuals do for the environment, and what needs companies to act?", "hooks": ["个人购物和分类", "公司设计包装维修", "选项影响选择"], "answer": ["Individuals can choose how much they buy and sort out what they throw away, which matters when many people do it regularly.", "Companies have more control over how much packaging a product comes with and whether it can be repaired at all.", "So the choices companies make can make good habits easier or harder for everyone else."], "phrase": ["reduce unnecessary packaging", "减少不必要包装"], "audioId": "p3-bank-env", "frames": ["A 第一种情况", "B 另一种情况", "比较后的判断"], "type": "比较题"}]}, {"kind": "事件", "status": "保留", "zh": "本地新闻", "en": "A news story people discussed locally", "id": "p3-64", "related": "p2-64", "questions": [{"prompt": "Why do people still need local news when national news is easy to access?", "hooks": ["有几个原因", "本地新闻改变日常", "通知居民还可参与"], "answer": ["There are several reasons.", "One reason is that it covers practical changes that national news will rarely mention, such as where a bus route will run next month.", "Besides that, it can give residents time to have a say. A story about a proposed crossing might tell people when there's a meeting or how to send feedback."], "phrase": ["give feedback", "提出意见"], "audioId": "p3-64-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why do different people pay attention to different local news stories?", "hooks": ["有几个原因", "生活习惯决定直接影响", "街区与经历决定熟悉感"], "answer": ["There are several reasons.", "One reason is that people notice stories that affect their everyday routines. A parent may pay attention to a new crossing, while a commuter looks for timetable changes.", "Another reason is that a personal connection can draw people in. A story about an old shop closing may matter a lot to someone who used to go there, even if others barely know the place exists."], "phrase": ["stand out", "引起注意"], "audioId": "p3-bank-news", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Should cities spend more on free places where people can spend time?", "hooks": ["支持无消费门槛", "公园图书馆用途", "和居民需求配"], "answer": ["I think it's worth doing because it gives residents somewhere to meet, study or take a break without paying every time they go out.", "A small library or a park with seats can be especially useful to people who share a crowded home.", "The money should go towards places people can actually reach and use, which means asking residents what they need first."], "phrase": ["a place people can actually use", "人们真正用得上的地方"], "audioId": "p3-bank-public", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "保留", "zh": "常用的应用程序", "en": "An app you find useful", "id": "p3-65", "related": "p2-65", "questions": [{"prompt": "What makes people keep using an app after the first week?", "hooks": ["解决频繁问题·步骤少", "打开直接看附近发车", "提醒太多会嫌累"], "answer": ["It needs to solve a problem that comes up regularly and do it with little effort.", "If a transport app opens straight to the nearby departures, people have a reason to come back.", "Too many reminders or extra steps can make an otherwise useful app feel like work."], "phrase": ["nearby departures", "附近站点的发车信息"], "audioId": "p3-65-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "When is an app more useful than speaking to a person?", "hooks": ["取决于 · how predictable the task is", "标准更新信息用软件快", "复杂异常找人解释"], "answer": ["It depends on how predictable the task is.", "If somebody just wants to know when the next bus leaves, an app is quick and easy to check wherever they are.", "However, if a delay affects their last connection and there are several routes, it may be better to ask a person who can explain the options."], "phrase": ["suggest an alternative route", "推荐替代路线"], "audioId": "p3-bank-apps", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Should schools teach children to solve basic technology problems themselves?", "hooks": ["小故障会排查", "例子确认保存和连接", "冒风险找成人"], "answer": ["Yes, within reason. Knowing what to check when something doesn't work can save time and make people less dependent on someone else.", "A pupil could learn to check whether a file has been saved, or try another cable before giving up on a presentation.", "They also need to know when a problem is beyond them and it's time to ask for help."], "phrase": ["within reason", "在合理范围内"], "audioId": "p3-bank-digital", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Are younger people more likely than older people to use technology to find their way?", "phrase": ["digital natives", "数字原住民"], "audioId": "course-navigation", "answer": ["It depends on how familiar people are with the tools and whether the technology actually works.", "If someone has grown up using smartphones, opening a navigation app may be the quickest option. Many digital natives rarely need to carry a paper map.", "However, if a phone runs out of battery or there is no reception, people of any age may use signposts or ask for directions. An older person who uses an app every day can be just as confident as a younger one."], "hooks": ["取决于 · how familiar people are with the tools and whether the technology actually works", "熟悉导航的年轻人习惯开软件", "没信号时不同年龄都会找路牌"], "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "digital natives", "zh": "数字原住民"}]}]}, {"kind": "事件", "status": "海外补充", "zh": "离不开的物品", "en": "An everyday item you'd struggle to do without, aside from a phone or computer", "id": "p3-66", "related": "p2-66", "questions": [{"prompt": "Why do people get attached to ordinary objects?", "hooks": ["有几个原因", "天天用成习惯", "有送礼或家庭记忆"], "answer": ["There are several reasons.", "One reason is that an ordinary object can become part of a routine. A different mug might feel wrong in the morning even if it works perfectly well.", "Apart from that, small things can remind people of who gave them the object or what was going on in their life at the time. That attachment can last long after the thing has lost most of its value."], "phrase": ["get attached to", "对……产生感情"], "audioId": "p3-66-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why do people sometimes keep objects they rarely use?", "hooks": ["有几个原因", "旧物带回某段生活", "想以后讲给家人"], "answer": ["There are several reasons.", "One reason is that the thing brings back details that would otherwise be hard to remember. An old notebook can remind someone where they were living when they used it.", "In addition, people may want to pass a story on. A family photograph or a school badge gives them something specific to show their children when they talk about the past."], "phrase": ["bring back a period of someone's life", "唤起对某段生活的回忆"], "audioId": "p3-bank-possessions", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why is it hard to keep a new routine going after the first week?", "hooks": ["有几个原因", "最初的新鲜感会退", "没有时间点就要天天决定"], "answer": ["There are several reasons.", "One reason is that the novelty wears off. In the first week, people are excited about the change, but later the rest of their day gets in the way again.", "Besides that, a routine is hard to maintain without a clear time or place. A short walk after dinner is easier to remember than a vague plan to exercise whenever you're free."], "phrase": ["keep up a routine", "坚持日常习惯"], "audioId": "p3-bank-routine", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "事件", "status": "当季", "zh": "想买给朋友的礼物", "en": "A present you'd like to get for a friend", "id": "p3-67", "related": "p2-67", "questions": [{"prompt": "What makes a gift feel thoughtful?", "hooks": ["注意对方具体特点", "新住户路线要无车可达", "贴合兴趣不必花很多"], "answer": ["It usually shows that the giver noticed something about the person.", "A book of short walks is more useful to a new resident if the routes are easy to reach without a car.", "The gift can be inexpensive if it matches what the person actually enjoys doing."], "phrase": ["match someone's interests", "符合某人的兴趣"], "audioId": "p3-67-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Do homemade gifts and bought gifts show care in different ways?", "hooks": ["取决于 · what the recipient would value", "爱有纪念意义适合手工", "实际需要可以买"], "answer": ["It depends on what the recipient would value.", "If somebody values the time and effort behind a gift, making it yourself can mean a lot, especially if you include a detail only they would recognise.", "However, if the person has a practical need, a bought gift can be just as thoughtful. It shows you've paid attention to what they've been saying."], "phrase": ["with someone in mind", "把某人放在心上"], "audioId": "p3-bank-gifts", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "How do handmade goods and factory-made goods meet different needs?", "hooks": ["取决于 · what the person needs from the product", "换标准件量产更容易", "需要定制手作更合适"], "answer": ["It depends on what the person needs from the product.", "If you just need a replacement quickly, something factory-made is often cheaper and easier to find in a standard size.", "However, if you need a particular fit or expect to have the item repaired later, a handmade product may be worth it. You can often speak to the maker about what you actually need."], "phrase": ["a standard size", "标准尺寸"], "audioId": "p3-bank-craft", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "保留", "zh": "想拥有的科技产品", "en": "A piece of technology you'd like to own, aside from a phone", "id": "p3-68", "related": "p2-68", "questions": [{"prompt": "How can people decide whether a new device is worth buying?", "hooks": ["看现有问题多常出现", "每周文件才用得值", "借来先试"], "answer": ["They can ask how often it would solve a problem they already have.", "A scanner might be worth it for someone with paperwork every week but less so for someone who needs it only once a year.", "Borrowing one first can make that judgment easier."], "phrase": ["solve a recurring problem", "解决反复出现的问题"], "audioId": "p3-68-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Why can the same device be easy for some people and difficult for others?", "hooks": ["取决于 · what people have used before", "熟悉设备能迁移经验", "新手需要直观指引"], "answer": ["It depends on what people have used before.", "If someone's used several cameras, they may already know roughly where to look for a setting, even if the model is new to them.", "However, somebody who only takes pictures on a phone can find the same menu confusing. Clear examples and an easy way to undo a change make it easier to get the hang of it."], "phrase": ["undo a change", "撤销一次更改"], "audioId": "p3-bank-devices", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "get the hang of", "zh": "逐渐掌握窍门"}]}, {"prompt": "Do people make better choices after trying something or after reading about it?", "hooks": ["取决于 · how much the decision depends on personal experience", "能先试用更清楚", "选项很多先搜索"], "answer": ["It depends on how much the decision depends on personal experience.", "If the choice depends on how something feels in practice, I'd try it. A trial lesson can tell you whether you're comfortable with the teacher's pace.", "However, if there are lots of options, reading first is more practical. I'd narrow the list down and then try the last one or two if the decision mattered."], "phrase": ["narrow down the options", "缩小选择范围"], "audioId": "p3-bank-choice", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "保留", "zh": "理想工作", "en": "A job that would suit you well", "id": "p3-69", "related": "p2-69", "questions": [{"prompt": "Should people prioritise a job they enjoy or one that pays well?", "hooks": ["积蓄少先保生活", "长期得喜欢部分工作", "人生责任会改变平衡点"], "answer": ["Income has to cover someone's needs, so that may come first if they have few savings.", "Beyond that, enjoying at least some of the work matters because they spend so much time doing it.", "The right balance can change as their responsibilities and options change."], "phrase": ["cover someone's needs", "满足某人的生活所需"], "audioId": "p3-69-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should young people look for job security or for work that interests them?", "hooks": ["取决于 · what someone can afford to risk at that point in life", "要付账单，需要稳定", "有存款缓冲，可以追兴趣"], "answer": ["It depends on what someone can afford to risk at that point in life.", "If someone's just starting out and has bills to cover, job security gives them some room to make plans and gain experience.", "However, if they have a bit of financial breathing room, interesting work may be worth choosing. They're more likely to want to learn and take on responsibility if they care about what they're doing."], "phrase": ["job security", "工作稳定性"], "audioId": "p3-bank-jobs", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Should companies train staff even if some of them may leave?", "hooks": ["值得", "能力提高即时有用", "培训与留下理由配合"], "answer": ["Yes. If employees learn to do a difficult part of their job well, the company gets the benefit while they're there.", "Training also makes it easier to promote people who already understand the business.", "Some will leave anyway, but giving people a chance to grow is one reason others might choose to stay."], "phrase": ["promote from within", "内部晋升"], "audioId": "p3-bank-work", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "保留", "zh": "收到的特别蛋糕", "en": "A cake someone gave you that you remember", "id": "p3-70", "related": "p2-70", "questions": [{"prompt": "Why do people make an effort to personalise food for a celebration?", "hooks": ["有几个原因", "表示记得对方小事", "让大家共享回忆"], "answer": ["There are several reasons.", "One reason is that it shows that the person organising the celebration paid attention. A cake based on someone's usual train route is clearly meant for them.", "Besides that, it can get the guests talking about something they remember together. A small detail like that can start a conversation more easily than food that simply looks expensive."], "phrase": ["personalise food", "给食物加上个性化细节"], "audioId": "p3-70-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Do homemade gifts and bought gifts show care in different ways?", "hooks": ["取决于 · what the recipient would value", "爱有纪念意义适合手工", "实际需要可以买"], "answer": ["It depends on what the recipient would value.", "If somebody values the time and effort behind a gift, making it yourself can mean a lot, especially if you include a detail only they would recognise.", "However, if the person has a practical need, a bought gift can be just as thoughtful. It shows you've paid attention to what they've been saying."], "phrase": ["with someone in mind", "把某人放在心上"], "audioId": "p3-bank-gifts", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "How do celebrations away from home differ from celebrations with family?", "hooks": ["取决于 · who's there and which parts of the tradition matter to them", "家里流程已熟悉", "海外朋友带来各自做法"], "answer": ["It depends on who's there and which parts of the tradition matter to them.", "With family, people may know exactly who cooks and when everyone arrives. A familiar routine can make the day feel special even when very little changes from year to year.", "However, abroad, friends may bring several versions of the same dish or tradition. They may have to organise more themselves, but there's also a chance to do something new together."], "phrase": ["bring different versions of a tradition together", "汇集不同版本的传统"], "audioId": "p3-bank-tradition", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "保留", "zh": "喜欢看的节目", "en": "A programme you often enjoy watching", "id": "p3-71", "related": "p2-71", "questions": [{"prompt": "Why are programmes about ordinary people's lives appealing?", "hooks": ["有几个原因", "日常越熟悉越能代入", "看到别人怎么选"], "answer": ["There are several reasons.", "One reason is that small details about other people's lives can feel familiar. A programme about a family object might get viewers thinking about something similar at home.", "Another reason is that ordinary stories show choices people don't normally see. Watching a repairer decide which scratches to leave on a toy boat can be more interesting than just seeing the finished result."], "phrase": ["recognise parts of their own lives", "看到自己的生活影子"], "audioId": "p3-71-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why are real-life stories popular on television?", "hooks": ["有几个原因", "认得熟悉的生活细节", "看见他人的做法"], "answer": ["There are several reasons.", "One reason is that viewers recognise feelings or situations they've had themselves. A story about repairing an old toy can remind people of something they've kept at home.", "Another reason is that they get to see how someone else deals with a familiar problem. That can make an ordinary subject interesting even when the programme doesn't have a dramatic ending."], "phrase": ["recognise a familiar situation", "认出熟悉的情景"], "audioId": "p3-bank-programmes", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why do people sometimes keep objects they rarely use?", "hooks": ["有几个原因", "旧物带回某段生活", "想以后讲给家人"], "answer": ["There are several reasons.", "One reason is that the thing brings back details that would otherwise be hard to remember. An old notebook can remind someone where they were living when they used it.", "In addition, people may want to pass a story on. A family photograph or a school badge gives them something specific to show their children when they talk about the past."], "phrase": ["bring back a period of someone's life", "唤起对某段生活的回忆"], "audioId": "p3-bank-possessions", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "地点", "status": "当季", "zh": "去过的吵闹场所", "en": "A place you visited that was unusually noisy", "id": "p3-72", "related": "p2-72", "questions": [{"prompt": "When does noise add to a public space, and when does it become a problem?", "hooks": ["集市比赛有声更热闹", "听不清交谈或太久就烦", "提供安静区让人选"], "answer": ["Some noise can make a market or match feel lively.", "It becomes a problem when people can't have a conversation or when they have to listen to it for hours.", "A venue can offer a quieter area so visitors can choose what works for them."], "phrase": ["offer a quieter area", "提供一个较安静的区域"], "audioId": "p3-72-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Do you think it is good for children to make noise?", "hooks": ["a normal part of play", "context matters", "appropriate behaviour"], "answer": ["Some noise is completely normal and even healthy because children learn through play and interaction.", "Expecting them to be silent all the time is unrealistic.", "The important thing is teaching them that different places have different expectations, so playground noise is fine while shouting in a library isn't."], "vocab": ["a normal part of play", "context matters", "appropriate behaviour"], "audioId": "word3-10-1", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should children not be allowed to make noise under any circumstances?", "hooks": ["far too strict", "control one's volume", "normal childhood behaviour"], "answer": ["No, that would be far too strict.", "Children need to express themselves and socialise.", "They should learn to control their volume when necessary, but a complete ban on noise would ignore normal childhood behaviour."], "vocab": ["far too strict", "control one's volume", "normal childhood behaviour"], "audioId": "word3-10-2", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What kinds of noises are there in our life?", "hooks": ["traffic and construction noise", "household appliances"], "answer": ["There are natural sounds such as wind and rain, human sounds such as conversation, and mechanical noise from traffic, construction and household appliances.", "Some sounds are pleasant or useful, while others become noise mainly because they are too loud, repetitive or badly timed."], "vocab": ["traffic and construction noise", "household appliances", "repetitive sounds"], "audioId": "word3-10-3", "frames": ["Point 给出判断", "Reasons 给理由或例子"], "type": "观点题"}, {"prompt": "Which area is exposed to noise more, the city or the countryside?", "hooks": ["取决于 · which part of each area and what time we're talking about", "城市背景声更持续", "乡村有农机但通常间歇"], "answer": ["It depends on which part of each area and what time we're talking about.", "Near a busy road in a city, traffic and construction can create constant background noise, even when there's nothing particularly loud happening.", "However, a farm can be very noisy when machinery is running. The difference is often how long the noise lasts and how often people hear it."], "vocab": ["population density", "constant background noise", "frequency and duration"], "audioId": "word3-10-4", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "批改稿", "en": "constant background noise", "zh": "持续的背景声"}]}, {"prompt": "How would people usually respond to noises in your country?", "hooks": ["tolerate minor noise", "persistent disturbance", "make a complaint"], "answer": ["For minor noise, people may simply tolerate it or use headphones.", "If the noise is persistent, especially late at night, they may speak to the neighbour, contact property management or make a formal complaint.", "People's tolerance also varies considerably."], "vocab": ["tolerate minor noise", "persistent disturbance", "make a complaint"], "audioId": "word3-10-5", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How can people consider others' feelings when chatting in public?", "hooks": ["keep one's voice down", "shared public space"], "answer": ["They can keep their voices at a reasonable level, avoid playing audio through speakers and be especially careful in quiet spaces such as trains, libraries or hospitals.", "It is basically about recognising that a public space is shared and that other people may want peace."], "vocab": ["keep one's voice down", "shared public space", "be considerate of others"], "audioId": "word3-10-6", "frames": ["Point 给出做法", "Reasons 解释或举例"], "type": "做法题"}], "lesson": "城市与乡村的噪音"}, {"kind": "地点", "status": "当季", "zh": "城市里喜欢去的自然景观", "en": "A green or natural spot you enjoy in your city", "id": "p3-73", "related": "p2-73", "questions": [{"prompt": "How can a city make natural areas accessible without damaging them?", "hooks": ["步道让人进去", "架高步道护湿地", "留轮椅可走的路线"], "answer": ["I think the first thing is to give people a clear route through the area.", "In a wetland, for example, a raised path lets people see the plants and birds without walking straight through them.", "I'd also make sure at least one route works for people using wheelchairs or pushing a buggy. Otherwise it's easy to build something that only some residents can use."], "phrase": ["a raised path", "架高的步道"], "audioId": "p3-73-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "What can local parks do to get children interested in wildlife?", "hooks": ["容易观察", "短活动有具体任务", "保护动物空间"], "answer": ["I think a simple trail with things to look out for is a good start. Children can notice birds or plants without having to sit through a long explanation.", "A short guided walk could show them how to recognise one or two species and why they live there.", "The activities should also make it clear where to stand so the animals still have some space."], "phrase": ["a guided walk", "有人带领的步行活动"], "audioId": "p3-bank-nature", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What makes an indoor public space more useful than an outdoor one, or the other way round?", "hooks": ["取决于 · what people want to do and what the weather is like", "室内安静不怕天气", "室外有空间走动"], "answer": ["It depends on what people want to do and what the weather is like.", "If people need somewhere quiet to concentrate, or it's cold and raining, an indoor space like a library is more practical.", "However, if they want to move around, meet casually or spend time in nature, a park or a square can work better. That's why a neighbourhood can benefit from both."], "phrase": ["throughout the winter", "整个冬天都"], "audioId": "p3-bank-buildings", "frames": ["Point 取 e", "推荐替代路线"], "audioId": "p3-bank-apps", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "地点", "status": "当季", "zh": "喜欢去的建筑", "en": "A building you enjoy visiting", "id": "p3-76", "related": "p2-76", "questions": [{"prompt": "Should old public buildings be adapted for new uses?", "hooks": ["通常应该改用", "旧邮局成图书馆保熟悉感", "进出安全·空间够"], "answer": ["Often, yes.", "A former post office can become a library and keep features people associate with the neighbourhood. The new use still needs to be practical.", "There should be a safe way in and enough space for the people who will actually use it."], "phrase": ["adapt for a new use", "改造并用于新用途"], "audioId": "p3-76-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why do people visit historic buildings?", "hooks": ["有几个原因", "亲眼看让过去变真实", "建筑技艺与生活线索"], "answer": ["There are several reasons.", "One reason is that historic buildings give people a direct connection with the past. Standing inside an old palace or house can make something they've only read about feel real.", "Apart from that, the buildings themselves are interesting to look at. The materials, layout and even worn steps can tell visitors something about how people used to live."], "vocab": ["a direct connection with the past", "architectural value", "bring history to life"], "audioId": "word3-2-1", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "批改稿", "en": "a direct connection with the past", "zh": "与过去的直接联系"}]}, {"prompt": "Should modern buildings replace traditional buildings?", "hooks": ["preserve local character", "architectural significance", "redevelop a site"], "answer": ["Not as a general rule.", "Cities need modern buildings because populations grow and people's needs change, but replacing every old building would destroy local character.", "A better approach is to preserve buildings with genuine historical or architectural value while allowin d putting it away afterwards.", "I still checked the reviews before buying it. The advert made me consider the product, but I wanted to know how it held up in everyday use."], "phrase": ["hold up in everyday use", "日常使用中经得起考验"], "audioId": "p3-bank-adbuy", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why do some people come up with good ideas under pressure?", "hooks": ["有几个原因", "时间近了问题更具体", "限制逼着重用资源"], "answer": ["There are several reasons.", "One reason is that a deadline makes people decide what actually needs fixing. If a fair has to move indoors, helping people find the rooms matters more than redesigning the poster.", "Apart from that, having limited resources can make people look at what they already have differently. A spare flyer can become a rough map if there's no time to print anything else."], "phrase": ["with the things you already have", "用手头已有的东西"], "audioId": "p3-bank-creativity", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why do some group projects run more smoothly than others?", "hooks": ["有几个原因", "开头对任务理解一致", "定期同步问题"], "answer": ["There are several reasons.", "One reason is that the team agrees on the work at the beginning. If everyone asks the same questions in a survey, the results are much easier to compare later.", "Another reason is that a quick check-in keeps the project on track. It gives people a chance to ask for help or share the workload before a small problem becomes urgent."], "phrase": ["the same picture of the task", "对任务有共同理解"], "audioId": "p3-bank-team", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Should schools let students make more mistakes when learning a skill?", "hooks": ["允许可逆错误", "发现原因", "高风险场景要指导"], "answer": ["Yes, where the consequences are small. Finding out why something went wrong often makes the lesson easier to remember.", "A student who tests a few versions of a presentation can see which one is easier <script>
"use strict";
const data = JSON.parse(document.getElementById('content').textContent);
const byId = id => document.getElementById(id);
const query = byId('query'), category = byId('category'), status = byId('status');
const topics = byId('topics'), sheet = byId('sheet');
const key = 'ielts-speaking-2026-autumn-v1';
let progress = new Set();
try { progress = new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch {}
let part = 1, selected = data[1][0].id, memo = false, timer, endsAt = 0;
let practiceMessage = '';
let playbackSpeed = 0.9;
const audioIndex = JSON.parse(byId('audio-index').textContent);
const player = new Audio();
let audioUrl = '', activeButton = null;
const revealed = new Set();
const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
const genre = ['人物','事件','地点'];
const groups = {1:['常见','当季','保留','海外补充'],2:['通用素材','当季话题',...genre],3:[...genre]};
const cardCount = data[2].filter(item=>!item.adaptations).length;
byId('n1').textContent = data[1].length + ' 个话题';
byId('n2').textContent = cardCount + ' 题 · ' + (data[2].length-cardCount) + ' 故事';
byId('n3').textContent = data[3].reduce((total,item)=>total+item.questions.length,0) + ' 道追问';
const frameworks = {
  1:['先直接回应（Point），再说一条原因（Reason），最后加个生活细节，让答案听起来像在聊天。'],
  2:[
    'I · Introduction。用 “I’d like to talk about …” 或 “I’m going to tell you about …” 点题。也可以说 “When it comes to this topic, the first thing that comes to mind is …” 或 “When I think about this question, the first person/place/thing that comes to mind is …”',
    'M · Main points。按题卡要点铺开，用具体动作、场景或对话讲清经过。',
    'F · Feelings / Future。按故事选一句来收尾，例如 “Overall, I feel …”, “In the future, I think I will …”, “I’m glad …” 或 “I hope …”'
  ],
  3:[
    'Why 原因题。用 “There are several reasons.” 开场，依次展开 Reason 1 和 Reason 2。可以用 “In addition”, “Besides that” 或 “Apart from that” 接上第二条原因。',
    'Idea 情形题。先说 “It depends on …”，交代判断依据。接着讲 Situation 1，再用 “However” 或 “whereas” 引出 Situation 2。'
  ]
};

function filtered(){
  const terms = query.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  return data[part].filter(item => {
    const allowedKinds = part===2 && item.adaptations ? ['通用素材'] : [item.kind,item.status,part===2 && '当季话题'];
    const inCategory = !category.value || allowedKinds.includes(category.value);
    const isDone = progress.has(item.id);
    const inStatus = !status.value || (status.value === 'done' ? isDone : !isDone);
    const haystack = [item.zh,item.en,item.kind,item.status,item.bank,item.lesson,item.theme,...item.questions.flatMap(q=>[q.prompt,q.label,q.hooks,q.phrase,q.vocab,...q.answer])].join(' ').toLowerCase();
    return inCategory && inStatus && terms.every(term => haystack.includes(term));
  });
}

function syncDirectory(items){
  const done = data[part].filter(item => progress.has(item.id)).length;
  byId('results').textContent = items.length + ' 项';
  byId('progress-label').textContent = '本部分已练 ' + done + ' / ' + data[part].length;
  byId('progress').max = data[part].length;
  byId('progress').value = done;
  const entry = item => '<button class="topic" data-id="'+item.id+'" aria-current="'+(item.id===selected)+'"><span>'+escape(item.zh)+'<small lang="en">'+escape(item.en)+'</small></span>'+(progress.has(item.id)?'<i aria-label="已练习">✓</i>':'')+'</button>';
  if (part!==2){
    topics.innerHTML = items.map(entry).join('');
    return;
  }
  const stories = items.filter(item=>item.adaptations);
  const cards = items.filter(item=>!item.adaptations);
  const header = (label,level) => '<h'+level+' class="directory-'+(level===3?'heading':'subhead')+'">'+label+'</h'+level+'>';
  const storyList = stories.length ? header('通用素材',3) + stories.map(entry).join('') : '';
  const sections = genre.map(label=>{
    const list = cards.filter(item=>item.kind===label);
    return list.length ? header(label,4)+list.map(entry).join('') : '';
  }).join('');
  topics.innerHTML = storyList + (cards.length ? header('当季话题',3) + sections : '');
}
function renderSheet(item, count){
  if (!item){
    sheet.dataset.item = '';
    sheet.innerHTML = '<p class="empty">没有匹配的话题。试试其他关键词或筛选条件。</p>';
    return;
  }
  const done = progress.has(item.id);
  const related = part === 1 ? '' : '<button class="btn" data-action="related">'+(part===2?'练对应 Part 3 →':'← 看对应 Part 2')+'</button>';
  const clock = part === 2 ? '<div class="clock"><div class="clock-actions"><button class="btn" data-action="time" data-seconds="60">准备 1:00</button><button class="btn" data-action="time" data-seconds="120">作答 2:00</button><button class="btn" data-action="reset">重置</button></div><output id="clock" role="timer">计时未开始</output></div>' : '';
  const heading = '<header class="sheet-head"><div class="actions"><button class="btn" data-action="random" '+(count<2?'disabled':'')+'>随机抽题</button><button class="btn" data-action="memo" aria-pressed="'+memo+'">背诵模式</button><button class="btn primary" data-action="done" aria-pressed="'+done+'">'+(done?'✓ 已练习':'标记已练习')+'</button>'+related+'</div><div class="meta"><span class="tag">Part '+part+'</span><span class="tag alt">'+escape(item.status)+'</span>'+(item.kind?'<span class="tag alt">'+escape(item.kind)+'</span>':'')+'</div><h2 tabindex="-1">'+escape(item.zh)+'</h2><p class="subhead" lang="en">'+escape(item.en)+'</p>'+clock+'<details class="classroom"><summary>课堂答题框架</summary>'+frameworks[part].map(line=>'<p>'+escape(line)+'</p>').join('')+'</details><p id="practice-message" class="notice" role="status" hidden></p></header>';
  const frameworkOpen = sheet.querySelector('.classroom')?.open;
  const sameItem = sheet.dataset.item === item.id;
  const openList = sameItem ? new Set([...sheet.querySelectorAll('details[data-question][open]')].map(el=>Number(el.dataset.question))) : new Set(part===3?[0]:[]);
  sheet.dataset.item = item.id;
  const exercises = item.questions.map((q,index)=>{
    if (part!==3 && !q.label) return renderQuestion(item,q,index);
    const title = q.label ? escape(q.label) : '<span class="question-title" lang="en">'+escape(q.prompt)+'</span><span class="tag">'+escape(q.type)+'</span>';
    return '<details class="question-panel" data-question="'+index+'" '+(openList.has(index)?'open':'')+'><summary>'+title+'</summary>'+renderQuestion(item,q,index,false)+'</details>';
  }).join('');
  sheet.innerHTML = heading + exercises + renderAdaptations(item);
  if (frameworkOpen) sheet.querySelector('.classroom').open = true;
  updateClock();
  if (practiceMessage) message(practiceMessage);
}
function renderQuestion(item,q,index,showPrompt=true){
  const shown = q.answer.map((_,beat)=>!memo || revealed.has(item.id+':'+index+':'+beat));
  const allShown = shown.every(Boolean);
  const anyShown = shown.some(Boolean);
  const questionActions = memo ? '<div class="recall-actions"><button class="btn" data-action="reveal-all" data-index="'+index+'" '+(allShown?'disabled':'')+'>全部揭开</button><button class="btn" data-action="cover-all" data-index="'+index+'" '+(!anyShown?'disabled':'')+'>全部遮住</button></div>' : '';
  const steps = q.answer.map((line,beat)=>{
    const visible = shown[beat];
    const id = 'answer-'+index+'-'+beat;
    const stage = q.frames ? '<span class="frame">'+escape(q.frames[beat])+'</span>' : '';
    const keyword = stage + escape(q.hooks[beat]);
    const hint = memo
      ? '<button type="button" class="cue" data-action="reveal" data-index="'+index+'" data-beat="'+beat+'" aria-controls="'+id+'" aria-expanded="'+visible+'"><span>'+keyword+'</span><span class="cue-state">'+(visible?'遮住':'揭开')+'</span></button>'
      : '<span class="cue-label">'+keyword+'</span>';
    return '<div class="answer-step '+(visible?'':'is-covered')+'">'+hint+(visible?'':'<div class="covered-line" aria-hidden="true"></div>')+'<p id="'+id+'" lang="en" '+(visible?'':'hidden')+'>'+escape(line)+'</p></div>';
  }).join('');
  const audioControls = allShown ? '<div class="actions"><button class="btn" data-action="speak" data-index="'+index+'" aria-pressed="false">▶ 英式示范</button><label class="audio-speed">语速 <select data-speed aria-label="播放语速">'+[0.75,0.9,1,1.15].map(speed=>'<option value="'+speed+'" '+(speed===playbackSpeed?'selected':'')+'>'+speed+'×</option>').join('')+'</select></label></div>' : '';
  const vocabulary = q.vocab ? q.vocab.map(chunk=>'<b lang="en">'+escape(chunk)+'</b>').join(' · ') : q.phrase ? '<b lang="en">'+escape(q.phrase[0])+'</b> · '+escape(q.phrase[1]) : '';
  const coursePhrases = allShown && q.courseVocab?.length ? '<details class="course-phrases"><summary>课堂表达</summary><ul>'+q.courseVocab.map(({en,zh})=>'<li><b lang="en">'+escape(en)+'</b> · '+escape(zh)+'</li>').join('')+'</ul></details>' : '';
  const prompt = showPrompt ? '<h3 class="prompt" lang="en">'+escape(q.prompt)+'</h3>' : '';
  return '<article class="practice">'+prompt+questionActions+'<div class="model answer-model">'+steps+'</div>'+(allShown && vocabulary ? '<p class="phrase">'+vocabulary+'</p>' : '')+coursePhrases+audioControls+'</article>';
}
function renderAdaptations(item){
  if (part!==2) return '';
  const jump = id=>{
    const other = data[2].find(entry=>entry.id===id);
    return '<button class="btn" data-action="jump" data-jump="'+id+'">'+escape(other.zh)+' ↗</button>';
  };
  if (item.adaptations){
    return '<section class="adaptations"><h3>这篇故事可以怎么串题</h3><ul>'+item.adaptations.map(entry=>'<li>'+jump(entry.id)+'<p>'+escape(entry.note)+'</p></li>').join('')+'</ul></section>';
  }
  if (item.stories){
    return '<section class="adaptations"><h3>这张题卡可用的通用故事</h3>'+item.stories.map(jump).join('')+'</section>';
  }
  return '';
}
function render(scrollDirectory=false){
  const items = filtered();
  if (!items.some(i=>i.id===selected)) selected = items[0]?.id;
  syncDirectory(items);
  renderSheet(items.find(i=>i.id===selected),items.length);
  if (scrollDirectory) {
    const current = topics.querySelector('[aria-current=true]');
    if (current) {
      const top = current.offsetTop;
      if (top < topics.scrollTop || top+current.offsetHeight > topics.scrollTop+topics.clientHeight) topics.scrollTop = Math.max(0,top-30);
    }
  }
}
function stopAudio(){
  if (activeButton) {
    activeButton.setAttribute('aria-pressed','false');
    activeButton.textContent = '▶ 英式示范';
    activeButton = null;
  }
  if (audioUrl) {
    player.pause();
    player.removeAttribute('src');
    player.load();
    audioUrl = '';
  }
}
function clearAudio(){
  stopAudio();
  practiceMessage = '';
}
player.addEventListener('ended',stopAudio);
sheet.addEventListener('toggle',event=>{
  const panel = event.target;
  if (activeButton && panel.matches('details[data-question]') && !panel.open && panel.contains(activeButton)) clearAudio();
},true);
sheet.addEventListener('change',event=>{
  if (!event.target.matches('[data-speed]')) return;
  playbackSpeed = Number(event.target.value);
  player.playbackRate = playbackSpeed;
  for (const select of sheet.querySelectorAll('[data-speed]')) select.value = playbackSpeed;
});
function stopClock(){
  clearInterval(timer);
  endsAt = 0;
  updateClock();
}
function updateClock(){
  const clock = byId('clock');
  if (!clock) return;
  if (!endsAt) { clock.textContent = '计时未开始'; return; }
  const seconds = Math.max(0,Math.ceil((endsAt-Date.now())/1000));
  clock.textContent = seconds ? Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+' 剩余' : '时间到';
  if (!seconds) clearInterval(timer);
}
function selectItem(id){
  clearAudio();
  stopClock();
  selected = id;
  render(true);
}
function changePart(next,id=null){
  clearAudio();
  stopClock();
  part = next;
  selected = id || data[part][0].id;
  query.value = '';
  status.value = '';
  category.innerHTML = '<option value="">全部类型</option>'+groups[part].map(g=>'<option>'+escape(g)+'</option>').join('');
  for (const button of byId('parts').querySelectorAll('button')) button.setAttribute('aria-pressed', Number(button.dataset.part)===part);
  render(true);
}
function message(text){
  const note = byId('practice-message');
  if (!note) return;
  note.textContent = text;
  note.hidden = !text;
  practiceMessage = text;
}
byId('parts').addEventListener('click',event=>{
  const button = event.target.closest('[data-part]');
  if (button && Number(button.dataset.part) !== part) changePart(Number(button.dataset.part));
});
topics.addEventListener('click',event=>{
  const button = event.target.closest('[data-id]');
  if (!button) return;
  selectItem(button.dataset.id);
  topics.querySelector('[aria-current=true]')?.focus({preventScroll:true});
  if (matchMedia('(max-width:590px)').matches) sheet.scrollIntoView({block:'start'});
});
for (const [el,type] of [[query,'input'],[category,'change'],[status,'change']]){
  el.addEventListener(type,()=>{clearAudio();stopClock();render(true);});
}
sheet.addEventListener('click',event=>{
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const action = button.dataset.action;
  const index = button.dataset.index;
  const beat = button.dataset.beat;
  const item = data[part].find(i=>i.id===selected);
  if (!item) return;
  switch(action){
    case 'random': {
      const options=filtered().filter(i=>i.id!==selected);
      if (options.length) selectItem(options[Math.floor(Math.random()*options.length)].id);
      break;
    }
    case 'memo':
      clearAudio();
      memo=!memo;
      revealed.clear();
      render();
      break;
    case 'done':
      clearAudio();
      if (progress.has(item.id)) progress.delete(item.id); else progress.add(item.id);
      try{localStorage.setItem(key,JSON.stringify([...progress]));}
      catch{message('此浏览器无法保存进度，当前页面仍会保留标记。');}
      render();
      break;
    case 'related':
      changePart(part===2?3:2,item.related);
      break;
    case 'reveal': {
      const id=item.id+':'+index+':'+beat;
      clearAudio();
      if (revealed.has(id)) revealed.delete(id); else revealed.add(id);
      render();
      break;
    }
    case 'reveal-all':
    case 'cover-all':
      clearAudio();
      item.questions[Number(index)].answer.forEach((_,step)=>{
        const id=item.id+':'+index+':'+step;
        if (action==='reveal-all') revealed.add(id); else revealed.delete(id);
      });
      render();
      sheet.querySelector('[data-action="'+(action==='reveal-all'?'cover-all':'reveal-all')+'"][data-index="'+index+'"]')?.focus({preventScroll:true});
      return;
    case 'jump':
      changePart(2,button.dataset.jump);
      sheet.querySelector('h2')?.focus();
      return;
    case 'time':
      stopClock();
      endsAt=Date.now()+Number(button.dataset.seconds)*1000;
      updateClock();
      timer=setInterval(updateClock,200);
      break;
    case 'reset':
      stopClock();
      break;
    case 'speak': {
      if (activeButton === button) { clearAudio(); message(''); break; }
      clearAudio();
      message('');
      try {
        const key = item.questions[Number(index)].audioId || item.id+'-'+index;
        audioUrl = audioIndex[key];
        if (!audioUrl) throw new Error("Missing audio");
        player.src = audioUrl;
        player.playbackRate = playbackSpeed;
        activeButton = button;
        button.setAttribute('aria-pressed','true');
        button.textContent = '■ 停止播放';
        const currentUrl = audioUrl;
        player.play().catch(()=>{
          if (audioUrl !== currentUrl) return;
          clearAudio();
          message('音频暂时无法播放，请再试一次。');
        });
      } catch {
        clearAudio();
        message('无法读取这道题的示范音频。');
      }
      break;
    }
  }
  if (!button.isConnected) sheet.querySelector('[data-action="'+action+'"]'+(index!==undefined?'[data-index="'+index+'"]':'')+(beat!==undefined?'[data-beat="'+beat+'"]':''))?.focus({preventScroll:true});
});
changePart(1);
</script>
</body>
</html>
