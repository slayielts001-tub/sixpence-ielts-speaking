 "主动让人参与更受欢迎", "记名字或邀午餐"], "answer": ["Being confident can help someone get noticed.", "Over time, though, I think people are drawn to those who make an effort to include others.", "Remembering a new colleague's name or inviting them to lunch can go a surprisingly long way."], "phrase": ["go a long way", "产生很大的作用"], "audioId": "p3-9-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How can communities make it easier for residents to get to know each other?", "hooks": ["给共享机会", "低压力活动", "要可重复"], "answer": ["I'd give people a reason to be in the same place without making them feel they have to introduce themselves formally.", "A shared garden or a weekend repair session can work, because everybody already has a practical thing to talk about.", "It helps if the activity happens regularly. People often get to know each other over several short conversations."], "phrase": ["a reason to get together", "相聚的理由"], "audioId": "p3-bank-local", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should someone who's good at their job try to become well known for it?", "hooks": ["取决于 · what the person wants from the job", "开店需要客户可适当公开", "工作稳定者或看重隐私"], "answer": ["It depends on what the person wants from the job.", "If someone's trying to build a business, being known locally can help customers find them. They may not need to be in the limelight all the time to get that benefit.", "However, somebody who already has steady work may care more about their privacy or about having time to improve what they do. Keeping up a public profile can become another job in itself."], "phrase": ["keep up a public profile", "维持公众曝光度"], "audioId": "p3-bank-publicity", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "in the limelight", "zh": "处在公众聚光灯下"}]}, {"prompt": "Why do some talented people never become particularly famous?", "phrase": ["be in the limelight", "成为公众焦点"], "audioId": "course-fame", "answer": ["There are several reasons.", "One reason is that some people value their privacy and don't want to be in the limelight. They may enjoy their work without using social media to talk about it all the time.", "Another reason is that some jobs don't bring much public attention even when the person is excellent at them. A good teacher, for example, may be well known to their students and hardly known outside the school."], "hooks": ["有几个原因", "不愿待在聚光灯下", "工作不容易触达大众"], "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "课件", "en": "in the limelight", "zh": "处在公众聚光灯下"}, {"kind": "课件", "en": "value their privacy", "zh": "重视个人隐私"}]}]}, {"kind": "人物", "status": "当季", "zh": "敬佩的运动员", "en": "An athlete you admire", "id": "p3-10", "related": "p2-10", "questions": [{"prompt": "What can children gain from following a famous athlete?", "hooks": ["看见失利后怎么回来", "媒体也拍训练和错误", "对进步有现实预期"], "answer": ["An athlete can make practice feel worth the effort, especially if children see how they recover from a loss.", "It helps when coverage shows training and mistakes as well as medals.", "That gives children a more realistic idea of what improving actually looks like."], "phrase": ["recover from a loss", "从失利中调整过来"], "audioId": "p3-10-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "What sports are popular in your country?", "hooks": ["have a huge following", "easy to access", "require little equipment"], "answer": ["In China, basketball, badminton, table tennis and running are all very popular.", "Basketball has a huge following among young people, while badminton and table tennis are accessible because they can be played recreationally at many ages.", "Running has also grown because it requires relatively little equipment."], "vocab": ["have a huge following", "easy to access", "require little equipment"], "audioId": "word3-6-1", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Do you think children should learn different kinds of sports?", "hooks": ["develop a range of skills", "specialise too early", "focus on enjoyment"], "answer": ["Yes.", "Trying different sports helps children develop a wider range of physical skills and find something they genuinely enjoy. It also prevents them from specialising too early.", "However, they don't need to become competitive in every sport; exposure and enjoyment are more important."], "vocab": ["develop a range of skills", "specialise too early", "focus on enjoyment"], "audioId": "word3-6-2", "frames": ["Point 直接表态", "Reasons 解释或举例", "条件或收束"], "type": "观点题"}, {"prompt": "What can children learn from doing sports?", "hooks": ["handle winning and losing", "repeated practice"], "answer": ["Apart from physical fitness, they can learn teamwork, discipline and how to handle both winning and losing.", "Sport also teaches children that improvement usually comes through repeated practice rather than immediate success, which is a useful lesson beyond sport."], "vocab": ["handle winning and losing", "repeated practice", "transferable skills"], "audioId": "word3-6-3", "frames": ["Point 给出做法", "Reasons 解释或举例"], "type": "做法题"}, {"prompt": "What qualities does a successful sportsperson need?", "hooks": ["train consistently", "respond to feedback", "mental toughness"], "answer": ["Natural ability helps, but discipline and resilience are probably more important in the long term.", "Athletes need to train consistently, respond to feedback and recover from poor performances or injuries.", "At elite level, mental control under pressure is also essential."], "vocab": ["train consistently", "respond to feedback", "mental toughness"], "audioId": "word3-6-4", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How is technology used in sports?", "hooks": ["performance analysis", "video replay", "data-driven decisions"], "answer": ["Technology is used for officiating, performance analysis, training and broadcasting.", "Video replay can help referees make more accurate decisions, while sensors and cameras allow teams to analyse movement and tactics.", "Fans also benefit from better statistics and viewing experiences."], "vocab": ["performance analysis", "video replay", "data-driven decisions"], "audioId": "word3-6-5", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How do athletes use technology to improve their performance?", "hooks": ["wearable devices", "training load and recovery", "interpret data"], "answer": ["They can use wearable devices to monitor heart rate, sleep, training load and recovery.", "Video analysis can identify technical weaknesses, while specialised software helps coaches compare performance over time.", "The important point is that technology provides data, but athletes and coaches still need to interpret it sensibly."], "vocab": ["wearable devices", "training load and recovery", "interpret data"], "audioId": "word3-6-6", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}], "lesson": "运动员的能力"}, {"kind": "人物", "status": "当季", "zh": "你帮助改善体能的人", "en": "Someone you helped become more active", "id": "p3-11", "related": "p2-11", "questions": [{"prompt": "What helps someone maintain an exercise habit?", "hooks": ["先降低开始门槛", "下班走二十分钟胜过远跑健身房", "初期有同伴"], "answer": ["Making it easy to start matters.", "A twenty-minute walk straight after work may fit someone's day better than a long trip to a gym.", "Having a friend to meet can also help in the early stages, until the routine feels normal."], "phrase": ["in the early stages", "在刚开始时"], "audioId": "p3-11-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Is everyday movement more practical than joining a gym?", "hooks": ["取决于 · what people want from exercise", "紧张日程顺路走", "有器械和目标就选健身房"], "answer": ["It depends on what people want from exercise.", "If someone mainly wants to move more and has a busy schedule, walking part of a journey they already make is easier to fit into daily life.", "However, if they're training for something specific, a gym may be worth the trip. It gives them equipment and a place to exercise regularly even when the weather is bad."], "phrase": ["fit a walk into a journey", "在原有行程中加一段步行"], "audioId": "p3-bank-fitness", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Why is it hard to keep a new routine going after the first week?", "hooks": ["有几个原因", "最初的新鲜感会退", "没有时间点就要天天决定"], "answer": ["There are several reasons.", "One reason is that the novelty wears off. In the first week, people are excited about the change, but later the rest of their day gets in the way again.", "Besides that, a routine is hard to maintain without a clear time or place. A short walk after dinner is easier to remember than a vague plan to exercise whenever you're free."], "phrase": ["keep up a routine", "坚持日常习惯"], "audioId": "p3-bank-routine", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "人物", "status": "保留", "zh": "喜欢种植物的人", "en": "Someone who enjoys growing plants", "id": "p3-12", "related": "p2-12", "questions": [{"prompt": "Why might gardening be popular in apartments with very little space?", "hooks": ["有几个原因", "窗台就够", "日常能看到成果"], "answer": ["There are several reasons.", "One reason is that getting started doesn't take much space or equipment. A sunny windowsill is enough for a few pots of herbs.", "Another reason is that people get a visible result from a small daily effort. It can be quite satisfying to use a leaf of basil you grew yourself when you're making dinner."], "phrase": ["a visible result", "看得见的成果"], "audioId": "p3-12-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Should neighbourhoods give residents space to grow plants together?", "hooks": ["支持有公共资源", "分工和认领", "地方有限时小规模"], "answer": ["Yes, if there's a plan for l s and make preventive healthcare accessible. However, they can't control every personal choice.", "Their role is mainly to create conditions in which healthier choices are easier and more affordable."], "vocab": ["public-health campaigns", "preventive healthcare", "create supportive conditions"], "audioId": "word3-5-6", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}], "lesson": "生活压力与运动"}, {"kind": "人物", "status": "保留", "zh": "在成功公司工作的人", "en": "Someone who works for a thriving company", "id": "p3-23", "related": "p2-23", "questions": [{"prompt": "What makes people want to stay with a successful employer?", "hooks": ["薪酬加成长感", "新人把项目做到底", "机会分给不爱出头的人"], "answer": ["Good pay matters, but people may also want a sense that they're developing.", "If a junior employee can take on a project and see it through, they have a reason to stay.", "The company needs to offer those opportunities fairly, not just to the most outspoken people."], "phrase": ["see a project through", "把项目从头做到尾"], "audioId": "p3-23-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should companies train staff even if some of them may leave?", "hooks": ["值得", "能力提高即时有用", "培训与留下理由配合"], "answer": ["Yes. If employees learn to do a difficult part of their job well, the company gets the benefit while they're there.", "Training also makes it easier to promote people who already understand the business.", "Some will leave anyway, but giving people a chance to grow is one reason others might choose to stay."], "phrase": ["promote from within", "内部晋升"], "audioId": "p3-bank-work", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should young people look for job security or for work that interests them?", "hooks": ["取决于 · what someone can afford to risk at that point in life", "要付账单，需要稳定", "有存款缓冲，可以追兴趣"], "answer": ["It depends on what someone can afford to risk at that point in life.", "If someone's just starting out and has bills to cover, job security gives them some room to make plans and gain experience.", "However, if they have a bit of financial breathing room, interesting work may be worth choosing. They're more likely to want to learn and take on responsibility if they care about what they're doing."], "phrase": ["job security", "工作稳定性"], "audioId": "p3-bank-jobs", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "当季", "zh": "结果令人满意的决定", "en": "A decision that turned out well", "id": "p3-24", "related": "p2-24", "questions": [{"prompt": "What helps people make decisions they'll be happy with later?", "hooks": ["先问想得到什么", "想交友适合线下小组", "先试一节比猜强"], "answer": ["It helps to be clear about what you hope to get out of the decision.", "If you want to meet people, a group course may suit you better than online lessons.", "When possible, trying one session before committing gives you better information than guessing."], "phrase": ["before committing", "在正式承诺之前"], "audioId": "p3-24-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How much should other people influence an important personal decision?", "hooks": ["问经历帮发现盲点", "他们承担不同", "本人最后判断"], "answer": ["It's worth asking people who've made a similar choice, because they may think of a cost or a benefit you've missed.", "Their situation may still be different. A friend who doesn't mind a long commute may give advice that doesn't fit someone working late shifts.", "I'd get several views and then make the decision based on the life I'll actually be living."], "phrase": ["a cost you might have missed", "可能没想到的代价"], "audioId": "p3-bank-choices", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Do people make better choices after trying something or after reading about it?", "hooks": ["取决于 · how much the decision depends on personal experience", "能先试用更清楚", "选项很多先搜索"], "answer": ["It depends on how much the decision depends on personal experience.", "If the choice depends on how something feels in practice, I'd try it. A trial lesson can tell you whether you're comfortable with the teacher's pace.", "However, if there are lots of options, reading first is more practical. I'd narrow the list down and then try the last one or two if the decision mattered."], "phrase": ["narrow down the options", "缩小选择范围"], "audioId": "p3-bank-choice", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "当季", "zh": "看名人接受采访", "en": "Watching a public figure being interviewed", "id": "p3-25", "related": "p2-25", "questions": [{"prompt": "What makes a celebrity interview worth watching?", "hooks": ["别停在熟知信息", "追问难关后做了什么", "非粉丝也有收获"], "answer": ["A good interview gets beyond familiar facts.", "If someone mentions a difficult moment, the interviewer can ask what they did next and what they would do differently now.", "The answer gives the audience something to think about even if they aren't fans."], "phrase": ["get beyond familiar facts", "超越大家熟知的信息"], "audioId": "p3-25-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What kinds of people are frequently interviewed?", "hooks": ["public figures", "subject-matter experts"], "answer": ["Public figures such as politicians, athletes, actors, business leaders and experts are interviewed frequently because people are interested in their decisions or experiences.", "Ordinary people may also be interviewed when they have witnessed an important event or have a story relevant to the news."], "vocab": ["public figures", "subject-matter experts", "first-hand experience"], "audioId": "word3-9-1", "frames": ["Point 给出判断", "Reasons 给理由或例子"], "type": "观点题"}, {"prompt": "Why do some people dislike being interviewed?", "hooks": ["有几个原因", "怕被评价或误解", "不习惯成为焦点"], "answer": ["There are several reasons.", "One reason is that they may feel nervous about being judged or worry that their words will be misunderstood. A short extract can sound different when it's taken out of context.", "Besides that, being in the limelight can be uncomfortable for people who value their privacy. That can be true even when they know the subject of the interview well."], "vocab": ["feel under pressure", "be misquoted or misunderstood", "public attention"], "audioId": "word3-9-2", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "课件", "en": "in the limelight", "zh": "处在公众聚光灯下"}, {"kind": "课件", "en": "value their privacy", "zh": "重视个人隐私"}]}, {"prompt": "Why do some people think interviews are a waste of time?", "hooks": ["有几个原因", "问题照稿答案可预测", "内容与观众目的不搭"], "answer": ["There are several reasons.", "One reason is that some interviews are repetitive and produce predictable answers, especially when both sides are heavily prepared. If nobody follows up, the conversation may never get beyond familiar facts.", "Another reason is that the subject may be less useful than the audience expected. Someone who wants to hear how an athlete handles pressure may learn very little from another list of medals."], "vocab": ["predictable answers", "limited snapshot of ability", "well-designed questions"], "audioId": "word3-9-3", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "What kind of things do famous people often say in an interview?", "hooks": ["promote a project", "shape one's public image", "carefully worded"], "answer": ["They often discuss current projects, career experiences and personal challenges.", "They may also use interviews to explain a controversial issue or shape their public image.", "Because they know their comments can spread quickly, their answers are sometimes quite carefully worded."], "vocab": ["promote a project", "shape one's public image", "carefully worded"], "audioId": "word3-9-4", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What can we do to get a job interview?", "hooks": ["tailor an application", "provide concrete evidence", "show a clear fit"], "answer": ["A strong application needs to match the job rather than being generic.", "Applicants should highlight relevant skills, use concrete evidence and make the CV easy to scan.", "Networking or referrals can sometimes help, but the basic requirement is still showing a clear fit for the role."], "vocab": ["tailor an application", "provide concrete evidence", "show a clear fit"], "audioId": "word3-9-5", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "What should people do to prepare for a job interview?", "hooks": ["research the organisation", "prepare evidence-based examples", "avoid sounding memorised"], "answer": ["They should research the organisation, understand the job description and prepare examples that demonstrate relevant skills.", "Practising common questions helps, but answers shouldn't sound memorised.", "It is also useful to prepare thoughtful questions for the interviewer."], "vocab": ["research the organisation", "prepare evidence-based examples", "avoid sounding memorised"], "audioId": "word3-9-6", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Why do we need to attend interviews when applying for jobs?", "hooks": ["有几个原因", "现场看沟通和反应", "应聘者也能问清工作"], "answer": ["There are several reasons.", "One reason is that employers can assess how candidates communicate and think in real time. A CV can't show how someone would explain a difficult decision to a colleague.", "Apart from that, an interview lets applicants find out about the job too. Asking about the workload or the working atmosphere can help them decide whether they'd actually want to work there."], "vocab": ["assess communication skills", "think on the spot", "a two-way process"], "audioId": "word3-9-7", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "课件", "en": "working atmosphere", "zh": "工作氛围"}]}, {"prompt": "What should people wear to a job interview?", "hooks": ["dress appropriately for the industry", "smart casual", "look polished and professional"], "answer": ["They should look neat and appropriate for the industry.", "A suit may be expected in some formal sectors, while smart casual clothing may be enough in a creative or technology company.", "The aim is to look professional without wearing something so uncomfortable that it becomes distracting."], "vocab": ["dress appropriately for the industry", "smart casual", "look polished and professional"], "audioId": "word3-9-8", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}], "lesson": "采访与临场回答"}, {"kind": "事件", "status": "当季", "zh": "存钱买特别的东西", "en": "Putting money aside for something special", "id": "p3-26", "related": "p2-26", "questions": [{"prompt": "Should children be given pocket money to learn about saving?", "hooks": ["零花钱给真实选择", "小额支出会积少成多", "允许小错后一起聊"], "answer": ["A small amount can give children a real choice between spending now and saving for later.", "They can see how quickly small purchases add up.", "It works better if adults let them make a few harmless mistakes and then talk through what happened."], "phrase": ["small purchases add up", "小额消费累积成大支出"], "audioId": "p3-26-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Is it easier to save money when people pay digitally or in cash?", "hooks": ["取决于 · which system makes people notice what they spend", "现金花得直观", "电子记录能复查"], "answer": ["It depends on which system makes people notice what they spend.", "If someone rarely looks at their bank account, cash can make spending more visible because they see the money leave their hands.", "However, if they make a habit of checking digital payments, the record can be very useful. They can see how small purchases add up over a week."], "phrase": ["review your spending", "回顾自己的支出"], "audioId": "p3-bank-money", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Should schools teach children how to compare prices and products?", "hooks": ["支持生活技能", "比单价寿命和真实需求", "用小额现实任务"], "answer": ["I think it's a useful skill because the cheapest thing on display may not be the best value for what a person needs.", "Students could compare the price per hundred grams, or work out which of two products is likely to last longer.", "A small shopping exercise would give them a chance to make a real choice and explain their reasoning."], "phrase": ["compare the price per unit", "比较单位价格"], "audioId": "p3-bank-shops", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "当季", "zh": "童年学到的技能", "en": "A skill you picked up as a child", "id": "p3-27", "related": "p2-27", "questions": [{"prompt": "Which practical skills should families teach children first?", "hooks": ["安全实用优先", "经常用才知价值", "随年龄从洗菜到切菜"], "answer": ["I'd start with skills children can use safely in everyday life, like preparing a simple meal.", "They get to practise regularly and see why it matters.", "The difficulty can increase with age, so a younger child might wash vegetables before learning to cut them."], "phrase": ["increase with age", "随年龄增长而提高"], "audioId": "p3-27-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should schools let students make more mistakes when learning a skill?", "hooks": ["允许可逆错误", "发现原因", "高风险场景要指导"], "answer": ["Yes, where the consequences are small. Finding out why something went wrong often makes the lesson easier to remember.", "A student who tests a few versions of a presentation can see which one is easier to follow.", "For something where a mistake could hurt somebody, of course, the teacher needs to demonstrate a safe way to practise first."], "phrase": ["a safe way to practise", "安全的练习方式"], "audioId": "p3-bank-mistakes", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How do handmade goods and factory-made goods meet different needs?", "hooks": ["取决于 · what the person needs from the product", "换标准件量产更容易", "需要定制手作更合适"], "answer": ["It depends on what the person needs from the product.", "If you just need a replacement quickly, something factory-made is often cheaper and easier to find in a standard size.", "However, if you need a particular fit or expect to have the item repaired later, a handmade product may be worth it. You can often speak to the maker about what you actually need."], "phrase": ["a standard size", "标准尺寸"], "audioId": "p3-bank-craft", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "当季", "zh": "礼貌听完不感兴趣的话题", "en": "Listening politely to a topic you didn't care for", "id": "p3-28", "related": "p2-28", "questions": [{"prompt": "How can people show interest politely when they don't enjoy the subject?", "hooks": ["问个人经历而非术语", "不懂跑步也能理解首赛", "自然换话题不扫兴"], "answer": ["They can ask about the person's experience instead of the details of the subject.", "Someone who doesn't follow running might still relate to preparing for a first race.", "After that, it's possible to move on naturally without making the speaker feel dismissed."], "phrase": ["feel dismissed", "觉得自己被敷衍"], "audioId": "p3-28-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "What kinds of topics do young people like to talk about nowadays?", "hooks": ["current trends", "personal concerns", "digital life"], "answer": ["It varies, but common topics include work or study, relationships, entertainment, travel and social media.", "Technology is also a frequent topic because new apps and AI tools affect daily life.", "Among close friends, conversations are usually much more personal than what people post publicly."], "vocab": ["current trends", "personal concerns", "digital life"], "audioId": "word3-7-1", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What might happen if someone does not listen carefully during a conversation?", "hooks": ["misunderstand information", "feel ignored", "lead to unnecessary conflict"], "answer": ["They may misunderstand important information or make the speaker feel ignored.", "In a workplace, poor listening can lead to mistakes; in a relationship, it can create unnecessary conflict.", "Even small signs such as repeatedly asking the same question can make communication frustrating."], "vocab": ["misunderstand information", "feel ignored", "lead to unnecessary conflict"], "audioId": "word3-7-2", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How can we tell whether someone is listening attentively?", "hooks": ["follow-up questions", "non-verbal cues", "respond to the actual point"], "answer": ["Usually through both verbal and non-verbal signals.", "They may maintain appropriate eye contact, respond to what has just been said and ask relevant follow-up questions.", "The strongest sign is probably that their response actually connects to the speaker's point rather than simply waiting for their turn to talk."], "vocab": ["follow-up questions", "non-verbal cues", "respond to the actual point"], "audioId": "word3-7-3", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "How can a teacher tell if students are listening in class?", "hooks": ["check understanding", "active participation", "appear attentive"], "answer": ["Teachers can ask short questions, invite students to summarise a point or use small activities during the lesson.", "Simply looking at students isn't always reliable because someone can appear attentive while thinking about something else.", "Active responses provide better evidence."], "vocab": ["check understanding", "active participation", "appear attentive"], "audioId": "word3-7-4", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "What do you think about talking with people who have different opinions?", "hooks": ["challenge assumptions", "respectful disagreement", "understand another perspective"], "answer": ["I think it is valuable as long as both sides are respectful.", "Different opinions can reveal assumptions we haven't questioned and help us understand an issue more fully.", "The aim doesn't always have to be changing someone's mind; sometimes understanding why they think differently is enough."], "vocab": ["challenge assumptions", "respectful disagreement", "understand another perspective"], "audioId": "word3-7-5", "frames": ["Point 直接表态", "Reasons 解释或举例", "条件或收束"], "type": "观点题"}, {"prompt": "Do most young people in your country like to talk with elderly people?", "hooks": ["取决于 · how well they know the person", "不熟且没共同话题较少主动", "对亲近长辈愿聊"], "answer": ["It depends on how well they know the person.", "If young people don't know an older person well, they may not immediately find a shared topic. Their daily routines and interests can feel quite different.", "However, many are happy to talk with a grandparent or someone who listens without judging them. A close relationship can make a much bigger difference than age."], "vocab": ["generation gap", "shared interests", "feel judged"], "audioId": "word3-7-6", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "批改稿", "en": "a close relationship", "zh": "亲近的关系"}]}], "lesson": "如何判断对方在听"}, {"kind": "事件", "status": "当季", "zh": "在店里受到好服务", "en": "Good service you received in a shop", "id": "p3-29", "related": "p2-29", "questions": [{"prompt": "What makes in-person customer service valuable today?", "hooks": ["线下能观察难说清的事", "店员一看靴子知道原因", "查库存退货线上也好"], "answer": ["In person, staff can notice things that are difficult to describe online.", "A person trying on boots may say they're uncomfortable, but an assistant can see why.", "Online help is still useful for straightforward tasks like checking stock or arranging a return."], "phrase": ["check stock", "查询库存"], "audioId": "p3-29-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What can small businesses do better than large chains?", "hooks": ["取决于 · where the customer needs more help", "要解释或售后小店灵活", "标准品连锁库存多"], "answer": ["It depends on where the customer needs more help.", "If a customer needs advice or a repair, a small business may be able to spend more time on the problem and change its service to suit local people.", "However, if somebody just needs a standard product quickly, a large chain can have a wider choice and more predictable stock because it buys in bulk."], "phrase": ["buy in bulk", "批量采购"], "audioId": "p3-bank-service", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Should schools teach children how to compare prices and products?", "hooks": ["支持生活技能", "比单价寿命和真实需求", "用小额现实任务"], "answer": ["I think it's a useful skill because the cheapest thing on display may not be the best value for what a person needs.", "Students could compare the price per hundred grams, or work out which of two products is likely to last longer.", "A small shopping exercise would give them a chance to make a real choice and explain their reasoning."], "phrase": ["compare the price per unit", "比较单位价格"], "audioId": "p3-bank-shops", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "当季", "zh": "和朋友度过的愉快夜晚", "en": "An evening you enjoyed with friends", "id": "p3-30", "related": "p2-30", "questions": [{"prompt": "Why do small gatherings sometimes feel more enjoyable than large ones?", "hooks": ["有几个原因", "少人能把话聊完整", "组织负担小"], "answer": ["There are several reasons.", "One reason is that it's easier to have a proper conversation when only a few people are there. Friends who've been out of touch can hear what everybody's been doing.", "In addition, a smaller gathering usually takes less organising. The host can spend more time with the guests instead of keeping an eye on food, music and the next thing on the schedule."], "phrase": ["lose people in the crowd", "在人群里走散"], "audioId": "p3-30-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "How are friendships at school different from friendships in adulthood?", "hooks": ["取决于 · how often people naturally see one another", "学校天天见自然熟", "成人找兴趣且要安排"], "answer": ["It depends on how often people naturally see one another.", "At school, people see each other almost every day. Friendships can develop slowly while they do fairly ordinary things together.", "However, adults often have to make time to meet, especially if they work in different places. A shared interest can make it easier to find people they get on with and want to see again."], "phrase": ["make time to meet", "特意留时间见面"], "audioId": "p3-bank-friends", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Do people behave differently at a party at home and at one in a public venue?", "hooks": ["取决于 · how the space is set up and what the guests want", "家聚放松能帮忙", "公共场地可认识更多人"], "answer": ["It depends on how the space is set up and what the guests want.", "At someone's home, people often chat in one group and offer to help with the food or the washing-up. That can suit friends who want to enjoy each other's company.", "However, at a larger public venue, guests can move around and meet more people. It works well for a bigger event where the host doesn't expect everyone to join the same conversation."], "phrase": ["catch up properly", "好好聊聊近况"], "audioId": "p3-bank-gather", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "批改稿", "en": "enjoy each other's company", "zh": "享受彼此陪伴"}]}]}, {"kind": "事件", "status": "当季", "zh": "常做却觉得浪费时间的事", "en": "A regular activity you find unproductive", "id": "p3-31", "related": "p2-31", "questions": [{"prompt": "How can people tell whether a leisure activity is a waste of time?", "hooks": ["看刷完感受和占用什么", "搞笑视频下班后能放松", "十分钟总拖一小时就改"], "answer": ["I'd look at how they feel afterwards and what the activity replaces.", "A silly video can be a welcome break after work.", "If ten minutes regularly turns into an hour and they miss things they genuinely wanted to do, it's worth changing the habit."], "phrase": ["a welcome break", "让人开心的休息"], "audioId": "p3-31-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Do people relax differently when they spend time outdoors and when they use a screen?", "hooks": ["取决于 · how tired people are and how much time they have", "白天久坐可出门换环境", "雨天累时看东西也方便"], "answer": ["It depends on how tired people are and how much time they have.", "If someone has been at a desk all day and has time to spare, getting outside can help them wind down. Even a short walk is a change of surroundings.", "However, if it's raining and they're already tired, watching something can be easier. I think it works best when they decide how long they want to spend on it before they start."], "phrase": ["a change of surroundings", "换个环境"], "audioId": "p3-bank-leisure", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "wind down", "zh": "放松下来"}]}, {"prompt": "Why is it hard to keep a new routine going after the first week?", "hooks": ["有几个原因", "最初的新鲜感会退", "没有时间点就要天天决定"], "answer": ["There are several reasons.", "One reason is that the novelty wears off. In the first week, people are excited about the change, but later the rest of their day gets in the way again.", "Besides that, a routine is hard to maintain without a clear time or place. A short walk after dinner is easier to remember than a vague plan to exercise whenever you're free."], "phrase": ["keep up a routine", "坚持日常习惯"], "audioId": "p3-bank-routine", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "事件", "status": "当季", "zh": "印象深的庆祝聚会", "en": "A memorable celebration", "id": "p3-32", "related": "p2-32", "questions": [{"prompt": "How have family celebrations changed in recent years?", "hooks": ["异地亲友能视频或发录音", "照片更快共享", "仍得留时间好好聊"], "answer": ["It's easier to include people who live far away because they can join a video call or send a recording.", "Photos are also shared much faster.", "That said, someone still has to make time for a proper conversation with the relatives who can't be there."], "phrase": ["join remotely", "远程参与"], "audioId": "p3-32-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "When do people like to hold a party?", "hooks": ["celebrate a milestone", "an informal get-together", "social connection"], "answer": ["Usually for milestones or occasions that give people a reason to gather, such as birthdays, weddings, graduations or festivals.", "Some people also organise informal parties simply because they haven't seen their friends for a long time.", "The occasion matters, but the main purpose is often social connection."], "vocab": ["celebrate a milestone", "an informal get-together", "social connection"], "audioId": "word3-3-1", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Do you think people nowadays prefer attending big parties or small gatherings with close friends? Why?", "hooks": ["取决于 · what people want from the occasion", "想深聊适合小聚", "认识新人适合大场"], "answer": ["It depends on what people want from the occasion.", "If people want to catch up properly, a small dinner with close friends is usually more relaxed and gives everybody a chance to speak.", "However, big parties can be exciting when the aim is to meet new people. They can feel impersonal if most of the guests are there to have a real conversation with someone they know."], "vocab": ["meaningful conversation", "feel impersonal", "a relaxed atmosphere"], "audioId": "word3-3-2", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Are there any differences between how young people and older people celebrate events with parties?", "hooks": ["取决于 · the people and the occasion, as well as age", "年轻朋友夜晚音乐", "长辈家聚吃饭聊天但有例外"], "answer": ["It depends on the people and the occasion, as well as age.", "A group of younger friends may be happy to stay out late, play louder music and share photos online, especially if it's a night out.", "However, for a family occasion, some older guests may prefer a meal with time to talk. Plenty of older people enjoy lively parties too, so personality and culture make a difference."], "vocab": ["stay out late", "focus on conversation", "avoid overgeneralising by age"], "audioId": "word3-3-3", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "What special events are celebrated in your country?", "hooks": ["family reunion", "traditional festival", "mark an important occasion"], "answer": ["In China, major events include the Spring Festival, Mid-Autumn Festival, weddings and important birthdays.", "The Spring Festival is probably the biggest family celebration, with reunion dinners and visits to relatives.", "In recent years, graduations and anniversaries have also become more commonly celebrated."], "vocab": ["family reunion", "traditional festival", "mark an important occasion"], "audioId": "word3-3-4", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Do you think it's a waste of money for governments to celebrate national events?", "hooks": ["strengthen social cohesion", "public spending should be proportionate", "basic public services"], "answer": ["Not necessarily.", "Public celebrations can strengthen a sense of community and preserve traditions, especially when they are accessible to everyone. However, spending should be proportionate.", "If a government spends excessively on ceremonies while basic public services are underfunded, people may reasonably criticise it."], "vocab": ["strengthen social cohesion", "public spending should be proportionate", "basic public services"], "audioId": "word3-3-5", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What festivals are the most important for people in your country?", "hooks": ["by far the most important", "be associated with", "family traditions"], "answer": ["The Spring Festival is by far the most important in China because it is strongly associated with family reunion.", "The Mid-Autumn Festival is also significant, especially because families traditionally spend time together and share mooncakes.", "Their importance comes from family traditions rather than entertainment alone."], "vocab": ["by far the most important", "be associated with", "family traditions"], "audioId": "word3-3-6", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}], "lesson": "聚会与人生节点"}, {"kind": "事件", "status": "当季", "zh": "帮助过别人的一次经历", "en": "A time you gave someone practical help", "id": "p3-33", "related": "p2-33", "questions": [{"prompt": "What kind of help enables people to do more on their own?", "hooks": ["问卡在哪里", "练演讲给两条建议", "让本人再试一次"], "answer": ["I'd start by asking which bit they're stuck on.", "If a friend is preparing a presentation, for instance, you could listen once and point out a couple of places that were hard to follow.", "Then give them a chance to make the changes themselves. They'll have a better idea of what to try next time."], "phrase": ["get stuck on something", "在某事上卡住"], "audioId": "p3-33-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should people be very kind when they help others?", "hooks": ["kindness with respect", "avoid being patronising", "offer practical support"], "answer": ["Yes, but I think kindness should come with respect.", "Helping someone doesn't mean treating them as helpless. The best kind of help is usually supportive without being patronising.", "For example, instead of taking over a task completely, we can ask what the person actually needs and give them enough space to solve the problem themselves."], "vocab": ["kindness with respect", "avoid being patronising", "offer practical support"], "audioId": "word3-1-1", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should children be taught to be kind to others?", "hooks": ["develop empathy", "model good behaviour", "learn through example"], "answer": ["Definitely.", "Kindness is a social skill as much as a personal quality, and children need opportunities to practise it. Parents and schools can teach them to share, listen and consider other people's feelings.", "However, adults also need to model this behaviour, because children are more likely to copy what they see than simply follow instructions."], "vocab": ["develop empathy", "model good behaviour", "learn through example"], "audioId": "word3-1-2", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should parents help their kids with their homework?", "hooks": ["to a reasonable extent", "get stuck", "develop independence"], "answer": ["Yes, to a reasonable extent.", "Parents can explain instructions, help children plan their time and encourage them when they get stuck. But if parents provide every answer, the child may become dependent and miss the chance to develop problem-solving skills.", "So guidance is useful, while doing the work for them is not."], "vocab": ["to a reasonable extent", "get stuck", "develop independence"], "audioId": "word3-1-3", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What kind of advice should parents give to their children?", "hooks": ["think about consequences", "practical life advice", "be less controlling"], "answer": ["I think the most useful advice is about decision-making rather than giving children a fixed answer to every problem.", "Parents can teach them to think about consequences, manage money, choose friends carefully and deal with failure.", "As children get older, advice should probably become less controlling and more like a discussion."], "vocab": ["think about consequences", "practical life advice", "be less controlling"], "audioId": "word3-1-4", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should parents give children advice? Why?", "hooks": ["benefit from experience", "explain the reasoning", "resist advice"], "answer": ["Yes, because parents usually have more life experience and can help children avoid obvious mistakes.", "That said, advice is most effective when children understand the reason behind it.", "If parents simply say 'do this because I said so', teenagers may resist even sensible advice."], "vocab": ["benefit from experience", "explain the reasoning", "resist advice"], "audioId": "word3-1-5", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Can kids provide any help to parents?", "hooks": ["household responsibilities", "emotional support", "work in both directions"], "answer": ["Of course.", "Help doesn't have to be financial or highly practical. Children can help with household tasks, technology and even emotional support.", "Older children may also introduce their parents to new ideas or digital tools, so support within a family can definitely work in both directions."], "vocab": ["household responsibilities", "emotional support", "work in both directions"], "audioId": "word3-1-6", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}], "lesson": "给帮助同时留空间"}, {"kind": "事件", "status": "保留", "zh": "一次早起", "en": "A morning when you got up unusually early", "id": "p3-34", "related": "p2-34", "questions": [{"prompt": "Why do some people enjoy getting up early?", "hooks": ["有几个原因", "独处安静", "提前跑步或办事"], "answer": ["There are several reasons.", "One reason is that the early morning may be the only time people have to themselves. They can read or go for a walk before anybody needs them.", "Besides that, an early start can make a busy day feel more manageable. For someone with a heavy workload, doing a short run before work can mean they still get time to exercise."], "phrase": ["time to themselves", "独处的时间"], "audioId": "p3-34-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "课件", "en": "heavy workload", "zh": "工作量大"}]}, {"prompt": "Should schools and workplaces offer more flexible starting times?", "hooks": ["支持有条件", "学生家庭与同事协作", "核心时段"], "answer": ["Where the work allows it, yes. People have different travel times, family responsibilities and times of day when they can concentrate.", "There still needs to be enough overlap to meet a teacher or speak to a colleague. It would be frustrating if people could never get an answer when they needed one.", "One option is to agree on a few core hours and let people choose the rest."], "phrase": ["a few core hours", "一段核心时段"], "audioId": "p3-bank-mornings", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why is it hard to keep a new routine going after the first week?", "hooks": ["有几个原因", "最初的新鲜感会退", "没有时间点就要天天决定"], "answer": ["There are several reasons.", "One reason is that the novelty wears off. In the first week, people are excited about the change, but later the rest of their day gets in the way again.", "Besides that, a routine is hard to maintain without a clear time or place. A short walk after dinner is easier to remember than a vague plan to exercise whenever you're free."], "phrase": ["keep up a routine", "坚持日常习惯"], "audioId": "p3-bank-routine", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "事件", "status": "保留", "zh": "不得不改变近期计划", "en": "A recent plan you had to rearrange", "id": "p3-35", "related": "p2-35", "questions": [{"prompt": "Why do people react differently when a plan changes at short notice?", "hooks": ["取决于 · what people have already arranged", "附近且没预订影响小", "已安排交通托儿影响大"], "answer": ["It depends on what people have already arranged.", "If the meeting is nearby and someone's evening is free, changing the venue may barely affect them.", "However, a change can be a real problem for someone who's booked transport or childcare. Giving them a clear alternative as early as possible lets them decide what they can still do."], "phrase": ["at short notice", "临时"], "audioId": "p3-35-0", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Are detailed plans more useful for groups or for individuals?", "hooks": ["取决于 · how many people need to coordinate", "多人要对齐时间地点", "一个人可随时改"], "answer": ["It depends on how many people need to coordinate.", "If several people are involved, a clear plan makes it easier to know when to arrive, what to bring and who needs an answer from you.", "However, if you're going out on your own, a rough plan may be enough. You can change direction halfway through without holding anybody up."], "phrase": ["leave something fairly open", "给安排留出余地"], "audioId": "p3-bank-plans", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Is it better to plan a whole day in detail or decide what matters most?", "hooks": ["取决于 · how fixed the day's commitments are", "有预约换乘该细排", "普通一天抓重点"], "answer": ["It depends on how fixed the day's commitments are.", "If you have a train to catch or several people to meet, writing down the exact times helps you stay on track.", "However, on an ordinary day, I'd rather prioritise two or three tasks and leave room for things to change. Otherwise the whole schedule can fall apart as soon as one job takes longer than expected."], "phrase": ["something takes longer than expected", "某事比预想更费时"], "audioId": "p3-bank-schedule", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "stay on track", "zh": "保持进度"}]}]}, {"kind": "事件", "status": "保留", "zh": "团队合作", "en": "Working as part of a group", "id": "p3-36", "related": "p2-36", "questions": [{"prompt": "What can a team do to prevent one person from doing most of the work?", "hooks": ["任务责任人和截止日", "简短同步查卡点", "紧急前重分工"], "answer": ["It helps to give each task an owner and a clear deadline.", "A quick check-in can show whether someone is stuck or has been given too much.", "At that point, the group can redistribute the work before it becomes a last-minute emergency."], "phrase": ["redistribute the work", "重新分配工作"], "audioId": "p3-36-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Why do some group projects run more smoothly than others?", "hooks": ["有几个原因", "开头对任务理解一致", "定期同步问题"], "answer": ["There are several reasons.", "One reason is that the team agrees on the work at the beginning. If everyone asks the same questions in a survey, the results are much easier to compare later.", "Another reason is that a quick check-in keeps the project on track. It gives people a chance to ask for help or share the workload before a small problem becomes urgent."], "phrase": ["the same picture of the task", "对任务有共同理解"], "audioId": "p3-bank-team", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Are detailed plans more useful for groups or for individuals?", "hooks": ["取决于 · how many people need to coordinate", "多人要对齐时间地点", "一个人可随时改"], "answer": ["It depends on how many people need to coordinate.", "If several people are involved, a clear plan makes it easier to know when to arrive, what to bring and who needs an answer from you.", "However, if you're going out on your own, a rough plan may be enough. You can change direction halfway through without holding anybody up."], "phrase": ["leave something fairly open", "给安排留出余地"], "audioId": "p3-bank-plans", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "保留", "zh": "做过的重要决定", "en": "An important choice you made", "id": "p3-37", "related": "p2-37", "questions": [{"prompt": "What should people weigh up before moving to another area?", "hooks": ["预算含水电通勤", "试走早高峰", "居住体验因人而异"], "answer": ["I'd look at the full cost first, including bills and what it takes to get to work or uni.", "I'd also try the commute at the time I'd actually be doing it. A flat can seem really close on a Sunday and feel miles away on a crowded Monday morning.", "Beyond that, it depends on what you need. Someone who works from home will probably care more about having somewhere quiet to sit."], "phrase": ["try the commute", "先试走通勤路线"], "audioId": "p3-37-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "How do the priorities of people choosing a place to live change with age?", "hooks": ["取决于 · the routines people expect to have", "初工作者先看租金通勤", "家庭和年长者看设施及空间"], "answer": ["It depends on the routines people expect to have.", "If somebody's just starting work, rent and transport can matter most because they don't spend much time at home during the week.", "However, a family may look for more space and good schools, whereas someone in later life might prioritise easy access to shops or a doctor."], "phrase": ["easy access to local services", "方便使用当地服务"], "audioId": "p3-bank-homes", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "How much should other people influence an important personal decision?", "hooks": ["问经历帮发现盲点", "他们承担不同", "本人最后判断"], "answer": ["It's worth asking people who've made a similar choice, because they may think of a cost or a benefit you've missed.", "Their situation may still be different. A friend who doesn't mind a long commute may give advice that doesn't fit someone working late shifts.", "I'd get several views and then make the decision based on the life I'll actually be living."], "phrase": ["a cost you might have missed", "可能没想到的代价"], "audioId": "p3-bank-choices", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"} ved, or try another cable before giving up on a presentation.", "They also need to know when a problem is beyond them and it's time to ask for help."], "phrase": ["within reason", "在合理范围内"], "audioId": "p3-bank-digital", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why can the same device be easy for some people and difficult for others?", "hooks": ["取决于 · what people have used before", "熟悉设备能迁移经验", "新手需要直观指引"], "answer": ["It depends on what people have used before.", "If someone's used several cameras, they may already know roughly where to look for a setting, even if the model is new to them.", "However, somebody who only takes pictures on a phone can find the same menu confusing. Clear examples and an easy way to undo a change make it easier to get the hang of it."], "phrase": ["undo a change", "撤销一次更改"], "audioId": "p3-bank-devices", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "get the hang of", "zh": "逐渐掌握窍门"}]}]}, {"kind": "事件", "status": "保留", "zh": "发消息后很久没收到回复", "en": "Waiting a long time for a reply", "id": "p3-39", "related": "p2-39", "questions": [{"prompt": "Why can slow replies cause tension at work?", "hooks": ["有几个原因", "回复慢卡住安排", "没确认让人猜关系"], "answer": ["There are several reasons.", "One reason is that people may be unable to move on until they get an answer. Somebody arranging a workshop, for example, can't send invitations before the room is confirmed.", "Another reason is that silence is easy to misread. A colleague might assume they're being ignored when the other person is simply busy, so a quick note about when they'll reply can help."], "phrase": ["hold up a plan", "拖延一个计划"], "audioId": "p3-39-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "When is it better to call someone instead of sending a message?", "hooks": ["取决于 · how urgent or complicated the message is", "急或有追问打电话", "地址时间需要记录发消息"], "answer": ["It depends on how urgent or complicated the message is.", "If a question is urgent or needs several follow-up questions, a call can save a long exchange of messages.", "However, if the information is something people will need to check later, like a room number or a meeting time, a message is better. After a call, you can also send a short note to confirm what you agreed."], "phrase": ["confirm what you agreed", "确认达成的约定"], "audioId": "p3-bank-message", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Why do some group projects run more smoothly than others?", "hooks": ["有几个原因", "开头对任务理解一致", "定期同步问题"], "answer": ["There are several reasons.", "One reason is that the team agrees on the work at the beginning. If everyone asks the same questions in a survey, the results are much easier to compare later.", "Another reason is that a quick check-in keeps the project on track. It gives people a chance to ask for help or share the workload before a small problem becomes urgent."], "phrase": ["the same picture of the task", "对任务有共同理解"], "audioId": "p3-bank-team", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "事件", "status": "保留", "zh": "改变一个重要看法", "en": "Changing your mind about an important issue", "id": "p3-40", "related": "p2-40", "questions": [{"prompt": "What makes people willing to reconsider a strongly held view?", "hooks": ["改主意不怕被笑", "有亲身经历能看到差异", "用问题打开讨论"], "answer": ["It's easier when people don't feel they're being judged for changing their minds.", "A direct experience can be persuasive, especially if it gives them a chance to notice the gap themselves.", "Questions can open that discussion more easily than telling someone they're wrong."], "phrase": ["reconsider a view", "重新考虑某种看法"], "audioId": "p3-40-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How much should other people influence an important personal decision?", "hooks": ["问经历帮发现盲点", "他们承担不同", "本人最后判断"], "answer": ["It's worth asking people who've made a similar choice, because they may think of a cost or a benefit you've missed.", "Their situation may still be different. A friend who doesn't mind a long commute may give advice that doesn't fit someone working late shifts.", "I'd get several views and then make the decision based on the life I'll actually be living."], "phrase": ["a cost you might have missed", "可能没想到的代价"], "audioId": "p3-bank-choices", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should companies train staff even if some of them may leave?", "hooks": ["值得", "能力提高即时有用", "培训与留下理由配合"], "answer": ["Yes. If employees learn to do a difficult part of their job well, the company gets the benefit while they're there.", "Training also makes it easier to promote people who already understand the business.", "Some will leave anyway, but giving people a chance to grow is one reason others might choose to stay."], "phrase": ["promote from within", "内部晋升"], "audioId": "p3-bank-work", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "保留", "zh": "近期做出的改变", "en": "A change you made recently", "id": "p3-41", "related": "p2-41", "questions": [{"prompt": "Why do small lifestyle changes sometimes last longer than big ones?", "hooks": ["有几个原因", "费力少也容易重来", "能接在固定习惯后"], "answer": ["There are several reasons.", "One reason is that a small change takes less effort on a difficult day. Going out for ten minutes can still feel manageable when a full workout doesn't.", "Apart from that, it's easier to attach a small change to something people already do. For instance, leaving your shoes by the door can make a walk after dinner feel like a natural part of the evening."], "phrase": ["a clear starting point", "明确的起点"], "audioId": "p3-41-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why is it hard to keep a new routine going after the first week?", " 42-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why do people sometimes replace things that could be repaired?", "hooks": ["有几个原因", "维修价格时间难预估", "替换有保障"], "answer": ["There are several reasons.", "One reason is that repair can involve an uncertain price and a long wait. If someone uses their kettle every morning, they may be unwilling to wait weeks for a part.", "In addition, a replacement can feel more predictable. People know when it will arrive and may get a warranty, whereas an older item could develop a different fault soon afterwards."], "phrase": ["a spare part", "备用零件"], "audioId": "p3-bank-repair", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why can the same device be easy for some people and difficult for others?", "hooks": ["取决于 · what people have used before", "熟悉设备能迁移经验", "新手需要直观指引"], "answer": ["It depends on what people have used before.", "If someone's used several cameras, they may already know roughly where to look for a setting, even if the model is new to them.", "However, somebody who only takes pictures on a phone can find the same menu confusing. Clear examples and an easy way to undo a change make it easier to get the hang of it."], "phrase": ["undo a change", "撤销一次更改"], "audioId": "p3-bank-devices", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "get the hang of", "zh": "逐渐掌握窍门"}]}]}, {"kind": "事件", "status": "保留", "zh": "花钱不多却特别的出游", "en": "A memorable day out on a small budget", "id": "p3-43", "related": "p2-43", "questions": [{"prompt": "What makes a day out enjoyable when there's little money to spend?", "hooks": ["同行和易达的环境", "树荫座位就能野餐", "免费公共空间少花钱"], "answer": ["Good company helps, but the place needs to be easy to reach and pleasant to stay in.", "A park with shade and somewhere to sit can be enough for a picnic.", "Free public spaces give people more choices without requiring them to buy something every hour."], "phrase": ["easy to reach", "容易到达"], "audioId": "p3-43-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why do some people prefer short local breaks to longer holidays?", "hooks": ["有几个原因", "请假和预算压力小", "可以常回来慢慢逛"], "answer": ["There are several reasons.", "One reason is that local trips are easier to arrange if people can't take much time off work or pay for several nights away.", "Besides that, being able to return lets someone see more than the main sights. They can spend one afternoon walking in a park and come back for a market another weekend."], "phrase": ["a change of scene", "换个环境"], "audioId": "p3-bank-weekends", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Should cities spend more on free places where people can spend time?", "hooks": ["支持无消费门槛", "公园图书馆用途", "和居民需求配"], "answer": ["I think it's worth doing because it gives residents somewhere to meet, study or take a break without paying every time they go out.", "A small library or a park with seats can be especially useful to people who share a crowded home.", "The money should go towards places people can actually reach and use, which means asking residents what they need first."], "phrase": ["a place people can actually use", "人们真正用得上的地方"], "audioId": "p3-bank-public", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "当季", "zh": "改变重要决定", "en": "Revising a major decision", "id": "p3-44", "related": "p2-44", "questions": [{"prompt": "Why do people sometimes stick with a decision after new information appears?", "hooks": ["有几个原因", "告诉过别人怕认错", "已投入的钱让人舍不得"], "answer": ["There are several reasons.", "One reason is that people may have told others about the decision and feel awkward about changing their mind in public.", "Another reason is that they've often spent time or money on it already. Asking what they'd choose today, with all the information they have, can make the future costs easier to see."], "phrase": ["change course", "改变方向"], "audioId": "p3-44-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Do people make better choices after trying something or after reading about it?", "hooks": ["取决于 · how much the decision depends on personal experience", "能先试用更清楚", "选项很多先搜索"], "answer": ["It depends on how much the decision depends on personal experience.", "If the choice depends on how something feels in practice, I'd try it. A trial lesson can tell you whether you're comfortable with the teacher's pace.", "However, if there are lots of options, reading first is more practical. I'd narrow the list down and then try the last one or two if the decision mattered."], "phrase": ["narrow down the options", "缩小选择范围"], "audioId": "p3-bank-choice", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "How much should other people influence an important personal decision?", "hooks": ["问经历帮发现盲点", "他们承担不同", "本人最后判断"], "answer": ["It's worth asking people who've made a similar choice, because they may think of a cost or a benefit you've missed.", "Their situation may still be different. A friend who doesn't mind a long commute may give advice that doesn't fit someone working late shifts.", "I'd get several views and then make the decision based on the life I'll actually be living."], "phrase": ["a cost you might have missed", "可能没想到的代价"], "audioId": "p3-bank-choices", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "当季", "zh": "印象深刻的课程", "en": "A course that stayed with you", "id": "p3-45", "related": "p2-45", "questions": [{"prompt": "What makes a course useful beyond the classroom?", "hooks": ["有自己试的机会", "学烘焙换一种面粉", "老师解释调整"], "answer": ["It helps if people get to try the skill in a slightly different situation before the course ends.", "In a baking class, for example, the teacher could change the flour and ask everyone to see what happens to the dough.", "Once they've talked through why it feels different, they'll have a better chance of working things out when they try the recipe at home."], "phrase": ["talk through why", "细说为什么"], "audioId": "p3-45-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What can a group course offer that studying on your own cannot?", "hooks": ["取决于 · what the learner is struggling with", "复习熟知识适合独立", "卡在错误上适合小组"], "answer": ["It depends on what the learner is struggling with.", "If you're reviewing material you've seen before, studying alone lets you work at your own pace and spend more time on anything you're unsure about.", "However, if you keep getting stuck on the same thing, a group can give you feedback. Somebody may spot an error you've stopped noticing or show you another way to approach it."], "phrase": ["spot an error", "发现错误"], "audioId": "p3-bank-lessons", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Should schools let students make more mistakes when learning a skill?", "hooks": ["允许可逆错误", "发现原因", "高风险场景要指导"], "answer": ["Yes, where the consequences are small. Finding out why something went wrong often makes the lesson easier to remember.", "A student who tests a few versions of a presentation can see which one is easier to follow.", "For something where a mistake could hurt somebody, of course, the teacher needs to demonstrate a safe way to practise first."], "phrase": ["a safe way to practise", "安全的练习方式"], "audioId": "p3-bank-mistakes", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}], "lesson": "课内技能迁移"}, {"kind": "事件", "status": "当季", "zh": "采访过一位知名人士", "en": "Interviewing someone well known", "id": "p3-46", "related": "p2-46", "questions": [{"prompt": "What matters more for an interviewer, preparation or spontaneity?", "hooks": ["备课了解背景备好题", "聆听时抓意外信息", "少量主题留追问时间"], "answer": ["Preparation makes sure the interviewer understands the person's background and has useful questions ready.", "Listening is what lets them respond when something unexpected comes up.", "I'd prepare a few important topics and leave enough time for follow-up questions."], "phrase": ["leave enough time for", "为……留出足够时间"], "audioId": "p3-46-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Should someone who's good at their job try to become well known for it?", "hooks": ["取决于 · what the person wants from the job", "开店需要客户可适当公开", "工作稳定者或看重隐私"], "answer": ["It depends on what the person wants from the job.", "If someone's trying to build a business, being known locally can help customers find them. They may not need to be in the limelight all the time to get that benefit.", "However, somebody who already has steady work may care more about their privacy or about having time to improve what they do. Keeping up a public profile can become another job in itself."], "phrase": ["keep up a public profile", "维持公众曝光度"], "audioId": "p3-bank-publicity", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "in the limelight", "zh": "处在公众聚光灯下"}]}, {"prompt": "When is it better to call someone instead of sending a message?", "hooks": ["取决于 · how urgent or complicated the message is", "急或有追问打电话", "地址时间需要记录发消息"], "answer": ["It depends on how urgent or complicated the message is.", "If a question is urgent or needs several follow-up questions, a call can save a long exchange of messages.", "However, if the information is something people will need to check later, like a room number or a meeting time, a message is better. After a call, you can also send a short note to confirm what you agreed."], "phrase": ["confirm what you agreed", "确认达成的约定"], "audioId": "p3-bank-message", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "保留", "zh": "为学习另一门语言做过的事", "en": "Something you did to learn another language", "id": "p3-47", "related": "p2-47", "questions": [{"prompt": "What can language learners gain from talking to other learners?", "hooks": ["同为学习者压力低", "练不断线和换词", "重复错误请老师反馈"], "answer": ["Other learners often understand how it feels to be struggling for words, so the conversation can feel less intimidating.", "They can practise keeping it going and explaining gaps.", "For detailed feedback on repeated errors, a teacher or an experienced speaker can still help."], "phrase": ["struggle for words", "一时找不到词"], "audioId": "p3-47-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Is it useful to speak a language before you feel ready?", "hooks": ["有用", "真交流找缺口", "从低风险小场景开始"], "answer": ["Yes, because you find out what you can actually get across, even if your grammar isn't perfect.", "In a real conversation, you also discover which words you need most. That's useful information for the next time you practise.", "I'd begin with something low-pressure, such as ordering a drink or asking a classmate a short question."], "phrase": ["get something across", "把意思表达出来"], "audioId": "p3-bank-language", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Are personal goals easier to reach alone or with other people?", "hooks": ["取决于 · what kind of help the goal calls for", "自己练可灵活调节", "同伴给反馈与督促"], "answer": ["It depends on what kind of help the goal calls for.", "If the goal mainly involves building a habit, working alone can make it easier to practise at times that suit you and spend longer on weak points.", "However, if the goal depends on feedback, working with another person is usually more helpful. A practice partner can point out something you'd never notice on your own."], "phrase": ["keep someone accountable", "帮某人保持自我约束"], "audioId": "p3-bank-goals", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "事件", "status": "当季", "zh": "在公共场所弄丢东西", "en": "Losing something in a public place", "id": "p3-48", "related": "p2-48", "questions": [{"prompt": "How can public venues handle lost property well?", "hooks": ["有一个明显失物处", "记时间位置·验物品细节", "清楚流程给大家省时间"], "answer": ["There should be one obvious place to ask, even if the item was found in another part of the venue.", "Staff can record the time and location and ask the person to describe the item before handing it over.", "A clear process saves time for everyone."], "phrase": ["hand an item over", "交付一件物品"], "audioId": "p3-48-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "How can communities make it easier for residents to get to know each other?", "hooks": ["给共享机会", "低压力活动", "要可重复"], "answer": ["I'd give people a reason to be in the same place without making them feel they have to introduce themselves formally.", "A shared garden or a weekend repair session can work, because everybody already has a practical thing to talk about.", "It helps if the activity happens regularly. People often get to know each other over several short conversations."], "phrase": ["a reason to get together", "相聚的理由"], "audioId": "p3-bank-local", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "When is a rule more effective than asking people to do the right thing voluntarily?", "hooks": ["行为影响他人", "一致标准", "可执行解释"], "answer": ["A rule makes more sense when one person's choice regularly affects other people, such as leaving rubbish in a shared area.", "It also tells everyone what standard to expect. That can be useful if people would otherwise make quite different assumptions.", "It still needs to be clear how people can follow the rule, or explaining it will achieve very little."], "phrase": ["a clear standard", "明确的标准"], "audioId": "p3-bank-rules", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "事件", "status": "保留", "zh": "成功组织开心的活动", "en": "A happy event you helped organise", "id": "p3-49", "related": "p2-49", "questions": [{"prompt": "Which skills make someone good at organising an event?", "hooks": ["预想参与者需要什么", "预备一两种意外", "吃的来晚先上饮料"], "answer": ["A good organiser thinks through what attendees will need and gives them clear information.", "They also plan for one or two things going wrong.", "If food is delayed, having drinks ready can buy time without making everyone feel that the event has stopped."], "phrase": ["buy time", "争取时间"], "audioId": "p3-49-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Do people behave differently at a party at home and at one in a public venue?", "hooks": ["取决于 · how the space is set up and what the guests want", "家聚放松能帮忙", "公共场地可认识更多人"], "answer": ["It depends on how the space is set up and what the guests want.", "At someone's home, people often chat in one group and offer to help with the food or the washing-up. That can suit friends who want to enjoy each other's company.", "However, at a larger public venue, guests can move around and meet more people. It works well for a bigger event where the host doesn't expect everyone to join the same conversation."], "phrase": ["catch up properly", "好好聊聊近况"], "audioId": "p3-bank-gather", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "批改稿", "en": "enjoy each other's company", "zh": "享受彼此陪伴"}]}, {"prompt": "Why do some group projects run more smoothly than others?", "hooks": ["有几个原因", "开头对任务理解一致", "定期同步问题"], "answer": ["There are several reasons.", "One reason is that the team agrees on the work at the beginning. If everyone asks the same questions in a survey, the results are much easier to compare later.", "Another reason is that a quick check-in keeps the project on track. It gives people a chance to ask for help or share the workload before a small problem becomes urgent."], "phrase": ["the same picture of the task", "对任务有共同理解"], "audioId": "p3-bank-team", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "事件", "status": "当季", "zh": "省下很多时间的方法", "en": "A change that saves you time", "id": "p3-50", "related": "p2-50", "questions": [{"prompt": "Which everyday tasks are worth planning in advance?", "hooks": ["重复或牵涉他人更值得计划", "饭菜和杂事能合并跑腿", "留余地别把计划做太长"], "answer": ["Planning saves the most time when a task comes up often or involves other people.", "Meals and errands are good examples because you can combine trips.", "It's worth leaving some room for changes, since a very detailed plan can take as much time as the task itself."], "phrase": ["combine trips", "把几趟行程合在一起"], "audioId": "p3-50-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Is it better to plan a whole day in detail or decide what matters most?", "hooks": ["取决于 · how fixed the day's commitments are", "有预约换乘该细排", "普通一天抓重点"], "answer": ["It depends on how fixed the day's commitments are.", "If you have a train to catch or several people to meet, writing down the exact times helps you stay on track.", "However, on an ordinary day, I'd rather prioritise two or three tasks and leave room for things to change. Otherwise the whole schedule can fall apart as soon as one job takes longer than expected."], "phrase": ["something takes longer than expected", "某事比预想更费时"], "audioId": "p3-bank-schedule", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "stay on track", "zh": "保持进度"}]}, {"prompt": "Why is it hard to keep a new routine going after the first week?", "hooks": ["有几个原因", "最初的新鲜感会退", "没有时间点就要天天决定"], "answer": ["There are several reasons.", "One reason is that the novelty wears off. In the first week, people are excited about the change, but later the rest of their day gets in the way again.", "Besides that, a routine is hard to maintain without a clear time or place. A short walk after dinner is easier to remember than a vague plan to exercise whenever you're free."], "phrase": ["keep up a routine", "坚持日常习惯"], "audioId": "p3-bank-routine", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "事件", "status": "保留", "zh": "长时间堵车", "en": "A long time spent in a traffic jam", "id": "p3-51", "related": "p2-51", "questions": [{"prompt": "How can cities reduce congestion during busy periods?", "hooks": ["可靠公交让人愿意不开车", "公司可错开上班时间", "班次得稳定才好安排"], "answer": ["Frequent buses or trains give people a practical reason to leave the car at home.", "Employers can help by allowing different start times where possible.", "Those changes are most effective when the alternatives are reliable enough that people can plan their day around them."], "phrase": ["plan their day around something", "围绕某事安排一天"], "audioId": "p3-51-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Why do people keep driving when public transport is available?", "hooks": ["有几个原因", "门到门更方便", "依赖稳定时间"], "answer": ["There are several reasons.", "One reason is that the car may go straight from one door to the other. A train that looks quick on paper can be less convenient if it takes two buses to reach the station.", "Apart from that, people need trips they can rely on. A parent picking up two children at fixed times may keep driving if missing a connection would make them late."], "phrase": ["go straight from door to door", "从门口直达目的地"], "audioId": "p3-bank-traffic", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Should schools and workplaces offer more flexible starting times?", "hooks": ["支持有条件", "学生家庭与同事协作", "核心时段"], "answer": ["Where the work allows it, yes. People have different travel times, family responsibilities and times of day when they can concentrate.", "There still needs to be enough overlap to meet a teacher or speak to a colleague. It would be frustrating if people could never get an answer when they needed one.", "One option is to agree on a few core hours and let people choose the rest."], "phr
