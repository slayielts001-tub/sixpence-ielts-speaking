<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ed">
<title>雅思口语练习册 · 2026 秋冬</title>
<style>
:root{color-scheme:light;--paper:#f7f5ed;--white:#fffefa;--ink:#182b23;--green:#214838;--moss:#4b6458;--line:#d9ded3;--lime:#dcec9d;--warm:#f1e7d6;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
a{color:inherit;text-underline-offset:4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8aa43d;outline-offset:3px}
[hidden]{display:none!important}
.wrap{width:min(1180px,calc(100% - 64px));margin-inline:auto}
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;gap:10px;align-items:center;font-weight:750;letter-spacing:.04em}
.mark{display:block;width:48px;height:47px;flex:none;object-fit:contain}
.hero{margin:26px 0 20px;background:var(--green);color:#fffdf4;border-radius:24px;display:grid;grid-template-columns:1.45fr 1fr;min-height:318px;overflow:hidden}
.hero-copy{padding:40px 0 37px 45px;z-index:1;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:11px;letter-spacing:.17em;font-weight:750;color:var(--lime);margin:0 0 16px}
h1{font-size:clamp(32px,5vw,60px);letter-spacing:-.075em;line-height:1.1;margin:0 0 12px}
.english{font:italic clamp(21px,3.1vw,40px)/1.2 var(--serif);color:var(--lime);margin:0}

.hero-art{position:relative;display:grid;place-items:center;overflow:hidden;min-height:236px;isolation:isolate}
.orbit{position:absolute;width:330px;aspect-ratio:1;border:1px solid #a2bc9b54;border-radius:50%;transform:rotate(-25deg) scaleY(.63)}
.orbit:nth-child(2){transform:rotate(25deg) scaleY(.63)}
.orbit:nth-child(3){transform:rotate(90deg) scaleY(.65)}
.band{width:190px;aspect-ratio:1;display:grid;place-content:center;text-align:center;background:var(--lime);color:var(--green);border-radius:50%;transform:rotate(-9deg);box-shadow:8px 12px #152f26;z-index:1}
.band strong{font:italic 56px/.95 var(--serif);letter-spacing:-.09em;margin-right:8px}
.band span{font-size:10px;letter-spacing:.12em;font-weight:800;margin-top:13px}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 24px}
.part{min-width:0;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 17px;display:grid;grid-template-columns:auto 1fr auto;gap:9px 13px;align-items:center}
.part:hover,.part[aria-pressed=true]{background:#e8efdc;border-color:#9bac9d}
.part b{font: bold 26px/1 var(--serif);color:var(--green);white-space:nowrap}
.part span{font-weight:750}
.part small{color:var(--moss);white-space:nowrap}
.studio{display:grid;grid-template-columns:285px minmax(0,1fr);gap:20px;align-items:start}
.sidebar,.sheet{background:var(--white);border:1px solid var(--line);border-radius:18px}
.sidebar{padding:15px}
.controls{display:grid;gap:9px}
.controls input,.controls select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.topic-status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 5px;font-size:12px;color:var(--moss)}
progress{width:100%;height:7px;display:block;accent-color:var(--green)}
.topic-list{position:relative;overflow:auto;max-height:565px;display:grid;align-content:start;gap:3px;margin:12px -4px 0;padding:3px 4px}
.topic{width:100%;border:0;background:transparent;border-radius:8px;text-align:left;padding:7px 8px;line-height:1.35;display:flex;align-items:center;justify-content:space-between;gap:6px}
.topic small{display:block;color:var(--moss);font-size:11px;margin-top:3px}
.topic:hover{background:#f2f5eb}
.topic[aria-current=true]{background:#e4edda;font-weight:750}
.topic i{font-style:normal;color:var(--green);font-size:12px}
.directory-heading{margin:8px 0 2px;padding:5px 8px;background:#eef2e6;border-radius:6px;color:var(--green);font-size:12px;font-weight:800}
.directory-heading:first-child{margin-top:0}
.directory-subhead{margin:4px 0 0;padding:3px 8px;color:var(--moss);font-size:11px;font-weight:760}
.frame{display:inline-flex;align-items:center;margin-right:7px;padding:1px 5px;border-radius:4px;background:#e1ead8;color:#284e3b;font:700 10px/1.45 var(--sans);vertical-align:1px;white-space:nowrap}
.question-panel{border-top:1px solid var(--line)}
.question-panel summary{position:relative;cursor:pointer;padding:14px 27px;color:var(--green);font-weight:700}
.question-panel summary .question-title{font-family:var(--serif);font-size:17px}
.question-panel summary .tag{margin-left:7px;white-space:nowrap}
.question-panel .practice{padding-top:4px}
.question-panel:not([open]) summary:hover{background:#f5f7ef}
.footer{margin-top:22px}
@media(max-width:590px){.question-panel summary{padding:12px 15px}.question-panel summary .question-title{font-size:16px}}
@media print{.question-panel:not([open])>.practice{display:block!important}}
.sheet{overflow:hidden;min-width:0}
.sheet-head{padding:22px 27px 18px;border-bottom:1px solid var(--line)}
.actions,.meta,.clock-actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.actions{justify-content:flex-end;margin-bottom:12px}
.btn{border:1px solid var(--line);border-radius:8px;background:var(--white);padding:6px 10px;font-size:12px;font-weight:650}
.btn:hover{background:#edf1e7}
.btn.primary,.btn[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
.tag{font-size:11px;font-weight:750;padding:3px 8px;border-radius:20px;color:#2d503e;background:#e7efdc}
.tag.alt{background:var(--warm);color:#635033}
.sheet h2{margin:7px 0 0;font-size:clamp(24px,4.5vw,36px);line-height:1.25;overflow-wrap:anywhere}
.subhead{font:italic 19px/1.35 var(--serif);color:var(--moss);margin:5px 0 0}
.practice{padding:21px 27px;border-bottom:1px solid var(--line)}
.practice:last-child{border-bottom:0}
.prompt{font:700 clamp(18px,2.7vw,24px)/1.3 var(--serif);margin:0 0 12px}
.model{border-left:3px solid #aac18e;padding:4px 13px;background:#f8f9f3;border-radius:0 8px 8px 0}
.model p{font:17px/1.55 var(--serif);margin:8px 0;overflow-wrap:anywhere}
.model p+p{margin-top:10px}
.answer-model{display:grid;gap:7px;border:0;background:transparent;padding:0}
.answer-step{min-width:0;border-left:3px solid #aac18e;border-radius:0 8px 8px 0;background:#f8f9f3;padding:6px 12px}
.answer-step p{margin:5px 0 6px}
.cue{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;border-radius:6px;background:transparent;padding:2px 4px;font-size:12px;font-weight:750;color:var(--green)}
.cue-label{color:var(--green);font-size:12px;font-weight:750;display:block;margin:2px 4px}
.cue:hover{background:#ecf2e3}
.cue-state{font-size:11px;color:var(--moss);font-weight:550;white-space:nowrap}
.answer-step.is-covered{background:#f1f4e9;border-color:#83a071}
.covered-line{height:7px;max-width:75%;border-radius:9px;margin:7px 4px 5px;background:#dbe5d0}
.recall-actions{display:flex;gap:7px;margin:0 0 9px}
.recall-actions .btn{padding:4px 8px}
.classroom{margin:14px 0 0;font-size:12px;color:var(--moss)}
.classroom summary{cursor:pointer;font-weight:700;color:var(--green)}
.classroom p{margin:5px 0 0}
.classroom p+p{margin-top:7px}
.adaptations{padding:15px 27px;background:#f5f7ee;border-top:1px solid var(--line);color:var(--moss)}
.adaptations h3{font-size:14px;color:var(--ink);margin:0 0 7px}
.adaptations ul{margin:0;padding:0;list-style:none}
.adaptations li{padding:6px 0;border-top:1px solid var(--line)}
.adaptations li:first-child{border-top:0}
.adaptations li p{margin:3px 0 0;font-size:12px}
.adaptations .btn{margin:2px 5px 2px 0}
@media(max-width:590px){.adaptations{padding:14px 15px}.cue{min-height:36px}.recall-actions .btn{min-height:34px}}
.phrase{margin:10px 0 0;color:var(--moss);font-size:12px}
.phrase b{color:var(--ink);font-weight:700}
.course-phrases{margin:10px 0 0;font-size:12px;color:var(--moss)}
.course-phrases summary{cursor:pointer;font-weight:700;color:var(--green)}
.course-phrases ul{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0;margin:8px 0;list-style:none}
.course-phrases b{color:var(--ink)}
.practice .actions{justify-content:flex-start;margin:12px 0 0}
.clock{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.clock output{font-size:12px;font-variant-numeric:tabular-nums;color:var(--moss)}
.empty{padding:30px;color:var(--moss)}

.notice{margin:6px 0;color:var(--moss);font-size:12px}
.audio-speed{display:flex;align-items:center;gap:6px;color:var(--moss);font-size:12px}
.audio-speed select{padding:4px 3px;border:1px solid var(--line);border-radius:6px;background:var(--white)}
.footer{border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0 24px;color:var(--moss)}
.footer-logo{display:block;width:155px;height:52px;position:relative;overflow:hidden;mix-blend-mode:multiply;flex:none}
.footer-logo img{position:absolute;width:178px;height:178px;max-width:none;left:-16px;top:-55px}
.footer a{font-size:12px;padding:6px 0;white-space:nowrap;text-decoration-color:#a5b2a3}
@media(max-width:590px){.mark{width:39px;height:38px}.footer{padding-top:8px}}

@media(max-width:850px){.wrap{width:calc(100% - 32px)}.studio{grid-template-columns:225px minmax(0,1fr);gap:12px}.part{grid-template-columns:1fr;gap:4px}.hero-copy{padding-left:29px}.hero-art .orbit{width:260px}}
@media(max-width:590px){.wrap{width:calc(100% - 24px)}.top .wrap{min-height:51px}.hero{margin-top:14px;min-height:0;grid-template-columns:1fr .54fr;border-radius:16px}.hero-copy{padding:22px 0 22px 16px}.hero-art{min-height:0}.band{width:clamp(73px,21vw,112px);box-shadow:4px 5px #152f26}.band strong{font-size:clamp(24px,7vw,39px);margin-right:3px}.band span{font-size:8px;margin-top:6px;letter-spacing:.04em}.hero-art .orbit{width:130px}.kicker{font-size:9px;margin-bottom:10px}h1{font-size:clamp(23px,6.2vw,36px)}.english{font-size:20px}.parts{gap:6px;margin-bottom:12px}.part{padding:9px}.part b{font-size:19px}.part span,.part small{font-size:11px}.studio{grid-template-columns:1fr}.topic-list{max-height:145px}.sheet-head,.practice{padding:15px}.actions{justify-content:flex-start}.prompt{font-size:19px}}
@media print{.top,.parts,.hero,.sidebar,.actions,.clock,.recall-actions,.cue-state,.covered-line,.footer{display:none!important}.studio{display:block}.sheet{border:0}.answer-step p[hidden],.phrase[hidden]{display:block!important}.wrap{width:100%}}
</style>
</head>

t by a river.", "If you go out early, the old streets are already busy with breakfast stalls.", "That's where I'd take a friend on their first morning."], "phrase": ["breakfast stalls", "早餐摊"]}, {"prompt": "Has your hometown changed a lot since you were young?", "hooks": ["河岸变了", "仓库变步道", "周末父母爱去"], "answer": ["Yes, particularly along the river.", "It used to be lined with warehouses, but there's a walking path now.", "It's the first place my parents suggest when I come home for the weekend."], "phrase": ["be lined with", "两旁排列着"]}], "lesson": "家乡与居住"}, {"id": "p1-4", "status": "常见", "zh": "居住街区", "en": "Neighbourhood", "bank": "The area you live in", "questions": [{"prompt": "How would you describe the area around your home?", "hooks": ["近主路但安静", "面包店和小公园", "买日用品不跑远"], "answer": ["It's fairly quiet, even though it's close to a main road.", "There's a bakery downstairs and a little park behind the building.", "I rarely need to go far for everyday things."], "phrase": ["everyday things", "日常所需"]}, {"prompt": "If you could improve one thing in your neighbourhood, what would it be?", "hooks": ["步行可达的图书馆", "晚间关得早", "多开一小时"], "answer": ["I'd keep our local library open a bit later.", "It's within walking distance, but by the time I'm free in the evening, it's usually closed.", "Even an extra hour would give people time to go after work."], "phrase": ["within walking distance", "步行可达"], "courseVocab": [{"kind": "课件", "en": "within walking distance", "zh": "步行可达"}]}], "lesson": "社区设施"}, {"id": "p1-5", "status": "当季", "zh": "旅行", "en": "Travel", "bank": "Travelling", "questions": [{"prompt": "What sorts of places do you enjoy visiting?", "hooks": ["节奏慢的小地方", "步行闲逛", "下午留给集市"], "answer": ["I usually go for somewhere I can explore on foot.", "I like being able to slow down and see what people actually do there.", "Last time I went away, I spent a whole afternoon at a market and that was probably my favourite part of the trip."], "phrase": ["explore on foot", "步行探索"], "courseVocab": [{"kind": "课件", "en": "slow down", "zh": "放慢节奏"}]}, {"prompt": "Who makes a good travel companion for you?", "hooks": ["一起去的朋友", "只订头一晚", "其余留白"], "answer": ["My friend Mei's great to travel with.", "We normally book somewhere to stay for the first night and leave the rest fairly open.", "If we find a town we like, we can just stay another day."], "phrase": ["leave the rest fairly open", "其余安排留有余地"]}], "lesson": "旅行与放松"}, {"id": "p1-6", "status": "当季", "zh": "垃圾与回收", "en": "Recycling & waste", "bank": "Rubbish and Recycling", "questions": [{"prompt": "How do you deal with recyclable waste at home?", "hooks": ["压平纸箱放门口", "袋满送楼下", "厨余另放"], "answer": ["I flatten cardboard boxes and keep them in a bag by the door.", "Once the bag is full, I take it downstairs to the recycling point.", "Food waste goes in a separate bin."], "phrase": ["flatten cardboard boxes", "压平纸箱"]}, {"prompt": "Did anyone teach you about recycling when you were young?", "hooks": ["小学教的", "废纸背面做数学", "用久成习惯"], "answer": ["My primary school did.", "We had a box for one-sided worksheets so we could use the blank side for maths.", "It made reusing paper feel like a normal thing to do."], "phrase": ["the blank side", "空白的一面"]}]}, {"id": "p1-7", "status": "当季", "zh": "疲劳", "en": "Feeling tired", "bank": "Tiredness", "questions": [{"prompt": "At what point in the day do you tend to feel tired?", "hooks": ["下午三点盯屏累", "同一句读两遍", "出去走走"], "answer": ["Usually around three in the afternoon, especially if I've been staring at a screen.", "That's when I start reading the same sentence twice.", "A short walk outside usually helps me focus again."], "phrase": ["stare at a screen", "盯着屏幕"]}, {"prompt": "How do you wind down when you're exhausted?", "hooks": ["简餐·收手机", "刷视频容易熬夜", "改读几页书"], "answer": ["I make something simple for dinner and put my phone away.", "If I start watching videos, I usually stay up longer than I meant to.", "Reading a few pages makes it easier to switch off."], "phrase": ["switch off", " getables as a child?", "hooks": ["小时候只吃几种", "讨厌蘑菇口感", "吃过烤的·现在加进面"], "answer": ["Only a few of them.", "I wouldn't touch mushrooms because I didn't like the texture.", "I tried them grilled a couple of years ago, and now I put them in noodles all the time."], "phrase": ["the texture", "口感"]}]}, {"id": "p1-11", "status": "当季", "zh": "广告", "en": "Advertising", "bank": "Advertisement", "questions": [{"prompt": "Where do you tend to notice advertisements?", "hooks": ["手机短视频之间", "看到实用演示才停", "修理工具广告"], "answer": ["Mostly between short videos on my phone.", "I skip them when I can, but I sometimes notice a product if it's shown doing something useful.", "An advert for a repair kit caught my attention last week."], "phrase": ["catch my attention", "引起我的注意"]}, {"prompt": "Has an advert ever persuaded you to buy something?", "hooks": ["视频买了台灯", "能折平·桌子小", "下单前查评价"], "answer": ["Yes, a video persuaded me to buy a small desk lamp.", "It showed how the lamp folded flat, which was useful because my desk was tiny.", "I checked the reviews before ordering it, though."], "phrase": ["fold flat", "折叠后变平"]}]}, {"id": "p1-12", "status": "当季", "zh": "纸张", "en": "Paper", "bank": "Paper", "questions": [{"prompt": "What do you still use paper for?", "hooks": ["纸上排一周", "放桌面随时看", "做完划掉"], "answer": ["I still use paper to plan my week.", "If the list is on my desk, I can see it without opening an app.", "I also like crossing things out once they're done."], "phrase": ["cross things out", "把事项划掉"]}, {"prompt": "Do you prefer printed text or a screen for long reading?", "hooks": ["长文用纸", "页边批注·没有通知", "短新闻用手机"], "answer": ["I'd choose a printed copy if the text was long.", "I can mark important points in the margin, and I don't get distracted by messages.", "For a quick news story, my phone is fine."], "phrase": ["in the margin", "在页边空白处"]}]}, {"id": "p1-13", "status": "当季", "zh": "中学", "en": "Secondary school", "bank": "Secondary school", "questions": [{"prompt": "What subject did you look forward to at secondary school?", "hooks": ["地理课", "画地图·看新旧照片", "城市变化很快"], "answer": ["I always looked forward to geography.", "We got to draw maps and compare photographs of the same place from different years.", "It helped me see how quickly a city can change."], "phrase": ["look forward to", "期待"]}, {"prompt": "Do you still see any of your old school friends?", "hooks": ["仍联系两位", "假期回家见", "很快聊回从前"], "answer": ["Yes, I keep in touch with two people from my class.", "We don't live in the same city anymore, but we usually meet when we're home for a holiday.", "It's surprising how quickly we fall back into our old conversations."], "phrase": ["keep in touch", "保持联系"]}]}, {"id": "p1-14", "status": "当季", "zh": "名字", "en": "Names", "bank": "Name", "questions": [{"prompt": "How did your family choose your name?", "hooks": ["父母一起取", "好发音·好寓意", "有个字是平静"], "answer": ["My parents chose it together.", "They wanted a name that was easy to say and had a positive meaning.", "One of the characters suggests calmness, which I quite like."], "phrase": ["suggest calmness", "有平静的意味"]}, {"prompt": "Did people call you by a nickname growing up?", "hooks": ["表亲缩成一个音节", "叫法留下来", "聚会还会听到"], "answer": ["Yes, my cousins shortened my name to one syllable when we were kids.", "I can't remember who started it, but it stuck.", "I still hear it whenever we get together."], "phrase": ["it stuck", "这个叫法留了下来"]}]}, {"id": "p1-15", "status": "当季", "zh": "机会", "en": "Opportunities", "bank": "Opportunities", "questions": [{"prompt": "How do you hear about useful opportunities?", "hooks": ["熟人介绍", "同学说周末工作坊", "小工作室难搜到"], "answer": ["I hear about a lot of them through people I know.", "A classmate told me about a weekend design workshop, for example.", "I probably wouldn't have found it on my own because it was run by a very small studio."], "phrase": ["on my own", "靠自己"]}, {"prompt": "What opportunity would you like to have in the future?", "hooks": ["加入国际团队", "用英语解决真问题", "看还差在哪里"], "answer": ["I'd like a chance to work in an international team.", "I already read a lot in English, but I'd love to use it to solve a real problem with other people.", "That would show me what I still need to work on."], "phrase": ["work on", "改进"]}]}, {"id": "p1-16", "status": "保留", "zh": "无聊", "en": "Feeling bored", "bank": "Feeling bored", "questions": [{"prompt": "When are you most likely to get bored?", "hooks": ["等着却没准信", "晚点有时间也行", "没消息就反复看表"], "answer": ["I get bored when I'm waiting somewhere and don't know how long it'll take.", "A late bus isn't so bad if I know when it's coming.", "If there's no information, I tend to check the time every minute."], "phrase": ["tend to", "往往会"]}, {"prompt": "What did you do when you were bored as a child?", "hooks": ["姐妹用纸箱", "画门窗", "一下午不腻"], "answer": ["My sister and I used to make little houses out of cardboard boxes.", "We'd cut out windows and draw the furniture on the inside.", "We could happily spend a whole afternoon doing that."], "phrase": ["cut out windows", "剪出窗户"]}], "lesson": "童年游戏"}, {"id": "p1-17", "status": "当季", "zh": "收藏", "en": "Collections", "bank": null, "questions": [{"prompt": "Is there anything you like to collect?", "hooks": ["旅行明信片", "找当地画家设计", "攒了一小盒"], "answer": ["I keep postcards from places I've visited.", "I try to find ones drawn by local artists, so the pictures are often quite different from the usual tourist photos.", "I've got a small box of them now."], "phrase": ["local artists", "当地艺术家"]}, {"prompt": "Is there anything you've kept since childhood?", "hooks": ["爷爷送的小本", "画了鸟", "很少翻也舍不得扔"], "answer": ["I've still got a little notebook my grandfather gave me.", "The first few pages are full of drawings of birds I saw near his house.", "I rarely look at it, but I know I'd miss it if I threw it away."], "phrase": ["be full of", "满是"]}]}, {"id": "p1-18", "status": "当季", "zh": "电脑和平板", "en": "Computers & tablets", "bank": null, "questions": [{"prompt": "Which tasks do you prefer to do on a computer?", "hooks": ["写长 , "土干了再浇", "泡水喝"], "answer": ["Just some mint on my kitchen windowsill.", "It gets the morning sun there, and I water it when the soil feels dry.", "Every now and then, I pick a few leaves and put them in my water."], "phrase": ["every now and then", "偶尔"]}, {"prompt": "Have you given flowers to anyone recently?", "hooks": ["妈妈生日送郁金香", "几天还好看", "玻璃壶摆厨房"], "answer": ["I gave my mum a bunch of tulips on her birthday.", "She likes flowers that still look good after a few days.", "We put them in a glass jug on the kitchen table."], "phrase": ["a bunch of tulips", "一束郁金香"]}], "lesson": "植物与自然"}, {"id": "p1-24", "status": "当季", "zh": "守时", "en": "Punctuality", "bank": null, "questions": [{"prompt": "How do you make sure you arrive on time?", "hooks": ["前晚查路线＋十分钟", "错过公交也不慌", "重要时设出门提醒"], "answer": ["I check the route the night before and allow ten extra minutes.", "That gives me a bit of breathing room if I miss a bus.", "For important appointments, I set a reminder for when I need to leave."], "phrase": ["allow ten extra minutes", "多预留十分钟"]}, {"prompt": "Does it bother you when people are late?", "hooks": ["先看是否通知", "有消息就买咖啡等", "不知来不来最烦"], "answer": ["It depends on whether they let me know.", "If a friend texts me, I can get a coffee and wait somewhere comfortable.", "It's more frustrating when I have no idea whether they're still coming."], "phrase": ["let me know", "通知我一声"]}]}, {"id": "p1-25", "status": "当季", "zh": "街头市场", "en": "Street markets", "bank": "Street Markets", "questions": [{"prompt": "What do you like buying at outdoor markets?", "hooks": ["爱买水果·看得见", "常去摊先尝", "上周甜橙"], "answer": ["I like buying fruit there because I can see exactly what I'm getting.", "My usual stall lets me taste a slice before I buy anything.", "Last weekend I took home some really sweet oranges."], "phrase": ["my usual stall", "我常去的摊位"]}, {"prompt": "When did you last visit a street market?", "hooks": ["两周前朋友夜市", "被小吃香味吸引", "分一盘炒面"], "answer": ["I went to a night market with a friend ab  be when you were little?", "hooks": ["小时想做厨师", "梦想天天发明新菜", "后来知道厨房不轻松"], "answer": ["I wanted to be a chef because I liked watching my grandfather make noodles.", "I imagined I'd get to invent a new dish every day.", "Later I realised how much work goes into running a kitchen."], "phrase": ["go into", "投入到……"]}, {"prompt": "Do you consider yourself ambitious?", "hooks": ["算有抱负", "想脱稿做英文汇报", "也要留时间给亲友"], "answer": ["In some ways, yes.", "I like having a goal I can work towards, like giving a presentation in English without reading my notes.", "At the same time, I want enough time for friends and family."], "phrase": ["work towards a goal", "朝目标努力"]}]}, {"id": "p1-46", "status": "保留", "zh": "晚间时间", "en": "Evenings", "bank": null, "questions": [{"prompt": "How do you spend a typical evening?", "hooks": ["做饭洗碗·电话或看剧", "久坐先去散步", "晚上显得长些"], "answer": ["I usually cook something simple, wash up, and call a friend or watch an episode of a show.", "If I've been sitting all day, I take a short walk first.", "It makes the evening feel a bit longer."], "phrase": ["wash up", "洗餐具"]}, {"prompt": "Did your evenings look different when you were a child?", "hooks": ["小时厨房桌写作业", "父母做饭后看电视", "隔壁新闻声"], "answer": ["Very different.", "I'd do my homework at the kitchen table while my parents made dinner, then watch whatever they put on TV.", "I remember the sound of the news coming from the next room."], "phrase": ["come from the next room", "从隔壁房间传来"]}]}, {"id": "p1-47", "status": "保留", "zh": "电影与影院", "en": "Films & cinemas", "bank": null, "questions": [{"prompt": "When would you choose to watch a film at the cinema?", "hooks": ["声效或大场景去影院", "海洋纪录片得大屏", "喜剧在家看"], "answer": ["I'd go to the cinema for a film with great sound or big outdoor scenes.", "I recently watched a documentary there about the ocean, and the underwater footage looked amazing on a large screen.", "For a light comedy, home is fine."], "phrase": ["underwater footage", "水下影像"]}, {"prompt": "What kinds of films do you usually enjoy?", "hooks": ["喜欢反转", "边看边猜", "和朋友聊结局"], "answer": ["I'm really into films that keep me guessing.", "I like picking up little clues and then realising I've got the whole thing wrong.", "If I watch with a friend, we'll usually end up talking about the ending on the way home."], "phrase": ["keep me guessing", "让我一直猜下去"]}], "lesson": "电影和观影感受"}, {"id": "p1-48", "status": "保留", "zh": "食物", "en": "Food", "bank": null, "questions": [{"prompt": "Is there a dish you never get tired of?", "hooks": ["番茄鸡蛋面", "汤清但香·十五分钟", "晚回家就煮"], "answer": ["I never get tired of tomato and egg noodles.", "The broth is light but full of flavour, and the whole thing takes about fifteen minutes to make.", "It's what I cook when I come home late."], "phrase": ["full of flavour", "味道浓郁"]}, {"prompt": "Do your eating habits change with the seasons?", "hooks": ["冬天喝汤", "夏天黄瓜凉面", "热天不守灶"], "answer": ["Yes, I have a lot more soup in winter.", "In summer, I'd rather make something cold, like noodles with cucumber.", "I don't want to stand over a hot stove when the kitchen is already warm."], "phrase": ["stand over a hot stove", "守在热灶台前"]}]}, {"id": "p1-49", "status": "保留", "zh": "历史", "en": "History", "bank": null, "questions": [{"prompt": "What kind of history do you find interesting?", "hooks": ["唐代诗歌", "友情和自然", "古人也熟悉"], "answer": ["I quite like learning about the Tang dynasty, mostly through poetry.", "A lot of the poems I've read are about things like friendship or being far from home.", "That's what makes them easy to relate to, even now."], "phrase": ["be easy to relate to", "容易让人产生共鸣"]}, {"prompt": "When did you last visit a history museum?", "hooks": ["去年春天铁路博物馆", "老车厢椅子窄", "小细节让历史真实"], "answer": ["I went to a railway museum last spring.", "They had an old carriage you could walk into, and the seats were much narrower than I expected.", "That small detail made the past feel real."], "phrase": ["walk into a carriage", "走进一节车厢"]}], "lesson": "历史与文化"}, {"id": "p1-50", "status": "保留", "zh": "爱好", "en": "Hobbies", "bank": null, "questions": [{"prompt": "What do you enjoy doing in your free time?", "hooks": ["走路拍照", "专拍门口或水坑倒影", "看到平时忽略的细节"], "answer": ["I like taking photos on walks.", "I usually pick one thing to look for, such as interesting doorways or reflections in puddles.", "It helps me notice details I'd normally walk past."], "phrase": ["walk past", "从旁边走过"]}, {"prompt": "Has one of your childhood hobbies stayed with you?", "hooks": ["现在还拼图", "小时在地板和姐妹拼", "晚上拼一小幅"], "answer": ["Yes, I still like doing puzzles.", "As a child I did jigsaws with my sister on the living room floor.", "These days I tend to do small ones that I can finish on a quiet evening."], "phrase": ["do a jigsaw", "拼拼图"]}]}, {"id": "p1-51", "status": "保留", "zh": "晨间时间", "en": "Mornings", "bank": null, "questions": [{"prompt": "What are the first few things you do in the morning?", "hooks": ["拉窗帘泡茶看计划", "有空在家吃早饭", "赶车前的安静"], "answer": ["I open the curtains, make tea and look at my plans for the day.", "If I have enough time, I eat breakfast at home.", "That gives me a few quiet minutes before I have to think about catching a train."], "phrase": ["catch a train", "赶车"]}, {"prompt": "Do you find it easy to get up early?", "hooks": ["看为何早起", "出游六点能起·工作日难", "前晚摆衣服"], "answer": ["It depends on why I'm getting up.", "I can get out of bed at six for a trip, but I struggle to do it on an ordinary weekday.", "Laying out my clothes the night before makes it a little easier."], "phrase": ["lay out my clothes", "提前摆好要穿的衣服"]}]}, {"id": "p1-52", "status": "保留", "zh": "老建筑", "en": "Old buildings", "bank": null, "questions": [{"prompt": "Is there an old building near you that you like?", "hooks": ["旧邮局拱形窗", "一部分成咖啡店", "还能见到旧柜台"], "answer": ["There's an old post office near my home with these tall arched windows.", "Part of it is a café now, so I sometimes go inside for coffee.", "You can still see the original counters along one wall."], "phrase": ["arched windows", "拱形窗"]}, {"prompt": "Would you choose to live in an older home?", "hooks": ["有暖气好厨房就考虑", "层高但冬天难保温", "冷天去看再定"], "answer": ["I would if it had good heating and a decent kitchen.", "I like the high ceilings in some older flats, but they can be hard to keep warm in winter.", "I'd want to visit on a cold day before deciding."], "phrase": ["high ceilings", "高天花板"]}]}, {"id": "p1-53", "status": "保留", "zh": "阅读", "en": "Reading", "bank": null, "questions": [{"prompt": "What kind of reading do you do for pleasure?", "hooks": ["小说", "通勤读几页", "换换脑子"], "answer": ["I usually go for fiction.", "I'll read a few pages on the train, especially after a long day.", "It's nice to have something else to think about for a while."], "phrase": ["go for fiction", "选小说读"]}, {"prompt": "When do you have to read especially carefully?", "hooks": ["检查预订得细读", "日期和站名容易看错", "付款前再核一遍"], "answer": ["I read carefully when I'm checking booking details.", "It's easy to miss a small difference between dates or stations with similar names.", "I usually go back over those details once before I pay."], "phrase": ["go back over", "重新核对"]}], "lesson": "阅读与放松"}, {"id": "p1-54", "status": "保留", "zh": "体育节目", "en": "Sports on TV", "bank": null, "questions": [{"prompt": "What sports do you enjoy watching on screen?", "hooks": ["爱看羽毛球节奏快", "快落地还救回来", "周末和爸爸看"], "answer": ["I like watching badminton because the pace is so quick.", "A rally can look as if it's over, and then one player somehow gets the shuttle back.", "I usually watch a few games with my dad at weekends."], "phrase": ["get the shuttle back", "把羽毛球救回去"]}, {"prompt": "Would you rather watch a match at home or at the venue?", "hooks": ["大比赛去现场", "在家回放看清判罚", "取决于在不在意结果"], "answer": ["I'd rather be there for a big match because the crowd makes every point exciting.", "At home, though, the replays help me understand close calls.", "It depends on how much I care about the result."], "phrase": ["a close call", "难以判断的判罚"]}]}, {"id": "p1-55", "status": "保留", "zh": "团队运动", "en": "Team sports", "bank": null, "questions": [{"prompt": "Have you ever played on a team?", "hooks": ["校队打过一学期排球", "发球一般·学会喊球", "队友很快熟起来"], "answer": ["I played volleyball on a school team for one term.", "I wasn't particularly good at serving, but I learned to call for the ball so we didn't run into each other.", "I enjoyed how quickly we got to know one another."], "phrase": ["call for the ball", "喊队友把球交给自己"]}, {"prompt": "Would you rather play a team sport or exercise alone?", "hooks": ["水平相近愿意组队", "队友等着会更认真", "忙时自己跑"], "answer": ["I'd rather play a team sport if I can find people at a similar level.", "I try harder when other people are counting on me to turn up.", "On a busy week, I just go for a run by myself."], "phrase": ["count on someone", "指望某人"]}]}, {"id": "p1-56", "status": "保留", "zh": "打字", "en": "Typing", "bank": null, "questions": [{"prompt": "When do you prefer typing to writing by hand?", "hooks": ["长稿打字好挪段落", "随手想法先拿笔", "草稿能看清关联"], "answer": ["I type when I'm working on a long draft because I can move whole paragraphs around.", "For quick ideas, I still reach for a pen.", "A page of rough notes helps me see how things fit together."], "phrase": ["move paragraphs around", "调整段落位置"]}, {"prompt": "How did you become quicker at typing?", "hooks": ["带电脑上课记笔记", "低头打字漏听", "几个月就能盲打"], "answer": ["I got faster when I started taking notes on a laptop in class.", "At first I had to look down all the time, so I missed parts of what the teacher said.", "After a few months, I could type most words by feel."], "phrase": ["by feel", "凭手感"]}]}], "2": [{"kind": "人物", "status": "当季", "zh": "完成难事的人", "en": "Someone who pulled off a difficult task", "id": "p2-1", "related": "p3-1", "questions": [{"prompt": "Describe someone who pulled off a difficult task.", "hooks": ["表姐期末遇上兼职", "画周计划与复述", "做完汇报有成就感"], "answer": ["I'm going to tell you about my cousin Lin and how she got through a particularly heavy workload at university. In her final year at uni, she had a big group presentation due in the same week as two exams. She also worked at a café at weekends, so she couldn't just take a few days off to catch up. I remember her sitting at our kitchen table with three different deadlines written on the back of a receipt.", "What helped was splitting everything up. She gave herself one small thing to finish after each shift, like making a slide or explaining one idea out loud without looking at her notes. When she got stuck on the figures, she asked a classmate to run through them with her. By the night before the presentation, she could actually explain the whole thing in her own words.", "The presentation went well, and she passed both exams. What impressed me was how calmly she dealt with the workload once she had a plan. Watching her made me realise I can usually get started if I give myself one clear thing to do first. Overall, I feel that her hard work paid off. I'd give myself small deadlines to stay on track if I found myself in the same situation."], "phrase": ["run through something with someone", "和某人一起快速过一遍"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "heavy workload", "zh": "工作量大"}, {"kind": "课件", "en": "stay on track", "zh": "保持进度"}, {"kind": "课件", "en": "paid off", "zh": "取得回报"}]}], "lesson": "迎接挑战与备考", "extended": true, "stories": ["p2-course-exams"]}, {"kind": "人物", "status": "当季", "zh": "快乐的人", "en": "Someone who seems genuinely cheerful", "id": "p2-2", "related": "p3-2", "questions": [{"prompt": "Describe someone who seems genuinely cheerful.", "hooks": ["校门口早餐摊认识", "雨天炉子不着·开玩笑", "记住我的考试·主动问结果", "从熟客和歇口气找乐趣"], "answer": ["When it comes to this topic, the first thing that comes to mind is Mr Chen, who runs the breakfast stall near my old school. I've known him since I was a teenager because I used to buy breakfast from him before class.", "Once, on a rainy morning, his stove wouldn't light and there was a queue under the awning. He started joking that we were all going to learn to make our own breakfast. He's got a great sense of humour. A couple of people in the queue started joking back, and nobody seemed to mind the wait after that.", "What stayed with me was that he'd remembered I had an exam that morning. A few days later he asked how it had gone, even though there were people lining up behind me. I see him do the same thing with other customers. Someone walks up looking half asleep, and two minutes later they're telling him what they're doing that weekend.", "He has bad days like everyone else. What I admire is that he notices small things to enjoy, like seeing an old customer again or having time to sit down after the morning rush. I hope I can be as good as he is at noticing the little things that lift people's mood."], "phrase": ["put people at ease", "让大家放松"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "a great sense of humour", "zh": "很有幽默感"}]}], "extended": true}, {"kind": "人物", "status": "当季", "zh": "做事有条理的人", "en": "Someone who plans things well", "id": "p2-3", "related": "p3-3", "questions": [{"prompt": "Describe someone who plans things well.", "hooks": ["大学管班级出游的梅", "一页放齐信息·备雨天地点", "雨天换地点·没人白跑", "有准备反而能灵活"], "answer": ["When I think about this question, the first person that comes to mind is my friend Mei, who's good at working out what to prioritise when people make plans together. We met at university, where she used to organise trips for our class.", "For a recent picnic, she checked who had dietary restrictions and put all the food, travel and weather information on one page. She's adaptable as well. When it started raining, she suggested a sheltered spot five minutes away.", "She sent one message with a photo of the new spot and where to get off the bus. We'd already bought the food, so nobody had to start again. The only thing we changed was where we sat. A friend showed up twenty minutes late and went straight to the right place without needing to call any of us.", "I used to associate being organised with making long lists. Watching Mei taught me that planning can make you more flexible, because you have a clear picture of your options when something changes. I hope I'll get better at adjusting a plan without making it feel like a crisis."], "phrase": ["have a place in mind", "心里已有合适的地点"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "adaptable", "zh": "能随机应变"}]}], "extended": true, "stories": ["p2-course-exams"]}, {"kind": "人物", "status": "当季", "zh": "爱拍照的人", "en": "Someone who takes photos wherever they go", "id": "p2-4", "related": "p3-4", "questions": [{"prompt": "Describe someone who takes photos wherever they go.", "hooks": ["徒步群认识·随身相机", "雨中车站·自行车影子", "选有等车人的照片·有故事", "自己走路也会看细节"], "answer": ["I'd like to talk about my friend Jun, who takes a small camera even when he goes out for groceries. We met through a walking group, and he often falls a few steps behind us to take a photo.", "Most of his pictures are of ordinary things, like empty bus stops in the rain. Once he photographed a row of bicycles just as the sun came out, and their shadows almost looked like another row of bikes.", "When he showed me the photos afterwards, he picked one with someone waiting for a bus in the corner. I'd thought the empty shelter looked more interesting. He said the person made you wonder how long they'd been standing there. We looked at both pictures again, and I could see what he meant.", "He's made me notice more on my own walks. I used to think a good picture needed a famous place or a special occasion, but he can find one on the street where we live. I hope I can take a photo that captures the feel of an ordinary day as well as he does."], "phrase": ["a row of bicycles", "一排自行车"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "人物", "status": "当季", "zh": "敬佩的年长者", "en": "An older person you look up to", "id": "p2-5", "related": "p3-5", "questions": [{"prompt": "Describe an older person you look up to.", "hooks": ["年长邻居·疫情时认识", "狗视频和夜聊", "被平等对待"], "answer": ["I'm going to tell you about an open-minded older neighbour I got to know through our building's group chat. I got to know him through our building's WeChat group during lockdown. Most people used it to ask about deliveries, but he'd send funny clips. I still remember one about a dog that kept getting back at its owner for hiding its favourite toy.", "I sent him a message about one of the clips and we ended up talking quite a bit. One evening I told him I was fed up with being inside, and he suggested we each watch the same film at home and talk about it afterwards. At the end, we'd completely disagreed about which character we liked best, which gave us something to laugh about the next day.", "I look up to him because he gives people his full attention and treats me like an equal. He's also willing to try things that are new to him. I'd love to have that attitude when I'm his age. I hope I'll be as open to new things as he is when I'm his age."], "phrase": ["treat someone like an equal", "把某人当作平等的人"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "open-minded", "zh": "思想开放的"}, {"kind": "批改稿", "en": "look up to", "zh": "敬佩"}, {"kind": "批改稿", "en": "treats me like an equal", "zh": "平等地对待我"}]}, {"label": "课堂完整范例 · 把学生当平等朋友的老师", "hooks": ["学生时代认识老师", "喝咖啡聊选择·先问建议·如何说挫折", "给我看问题的新角度"], "answer": ["Someone older than me whom I really admire is one of my former teachers. I first met him when I was a student, and we have stayed in touch since then.", "What I admire most is that he is knowledgeable but never makes younger people feel inferior. Whenever we meet, we usually have coffee or a meal and talk about work, education and life choices. He tends to ask questions first rather than immediately telling me what to do, which means his advice never feels forced. I also respect the way he deals with setbacks. He has experienced several changes in his career, but he talks about them calmly and sees them as part of life rather than as failures. That attitude has influenced me a lot.", "I feel fortunate to know him because he gives me perspective when I become too focused on short-term problems. I don't necessarily follow every piece of advice he gives me, but I value his judgement and the fact that he treats me as an equal."], "phrase": ["give someone perspective", "帮某人看得更全面"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Describe an older person you look up to.", "courseVocab": [{"kind": "批改稿", "en": "treats me as an equal", "zh": "平等地对待我"}]}], "stories": ["p2-u6"], "lesson": "年长邻居与开放心态", "extended": true}, {"kind": "人物", "status": "当季", "zh": "擅长做手工的人", "en": "Someone who makes things by hand", "id": "p2-6", "related": "p3-6", "questions": [{"prompt": "Describe someone who makes things by hand.", "hooks": ["邻居有木工房·刀柄松了", "切木头磨边·照手大小改", "先试旧刀·新柄不打滑", "每天用·看见设计用心"], "answer": ["When it comes to this topic, the first thing that comes to mind is my neighbour Yan, who makes things from scratch in his little woodworking shop. I found out about it when the handle of my favourite kitchen knife came loose and he offered to look at it.", "He cut a new handle from a piece of leftover wood, sanded the edges and asked me to try holding it before he finished. He changed the shape slightly because I have quite small hands.", "The thing I hadn't noticed was how often the old handle slipped when my hands were wet. He asked me to bring the knife back before he put anything on the wood. I tried it on a carrot at his workbench, and he took a little more off one side because my thumb was pressing on the edge.", "I still use that knife most days. It fits my hand better than it did before, and watching him make it gave me a better idea of how much thought goes into an everyday object. I'm glad I've got something I use every day that reminds me what goes into making things by hand."], "phrase": ["sand the edges", "打磨边缘"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "from scratch", "zh": "从零开始"}]}], "extended": true}, {"kind": "人物", "status": "当季", "zh": "喜爱历史的人", "en": "Someone who is fascinated by the past", "id": "p2-7", "related": "p3-7", "questions": [{"prompt": "Describe someone who is fascinated by the past.", "hooks": ["朋友喜欢唐诗", "读李白送别诗", "读出古人的日常"], "answer": ["When I think about this question, the first person that comes to mind is my friend Rui, who's doing a history degree and has got really into poetry from the Tang dynasty. It started when she took an optional course and realised how much you could learn about everyday life from the things people wrote.", "One evening she showed me a poem by Li Bai about saying goodbye to a friend. Instead of starting with the date or the place names, she asked me to picture the friend leaving and the person on the shore watching him go. Then she told me why people travelled in those days and how long it might be before they saw each other again.", "I liked the fact that she'd made something I'd studied at school feel personal. I used to think of history as a list of things to remember before an exam. After that conversation, I started to see it as a way of finding out how people lived and where some of our ideas come from. It made me want to trace my cultural roots a bit further. I hope she'll show me more poems that help me understand where some of our traditions come from."], "phrase": ["say goodbye to a friend", "跟朋友道别"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "trace my cultural roots", "zh": "追溯文化根源"}]}, {"label": "课堂完整范例 · 爱读历史的大学朋友", "hooks": ["大学朋友·历史非专业", "纪录片播客博物馆·研究事件背景", "热情有感染力"], "answer": ["I'd like to talk about one of my friends who is genuinely fascinated by history. I met him at university, and although history was not his main subject, he spent a surprising amount of his free time learning about it.", "He learns history in several ways. He watches documentaries, listens to podcasts and reads biographies, especially about twentieth-century history. Whenever he travels, he also makes a point of visiting museums and historic sites rather than only going to popular tourist attractions. I think he loves history because he sees it as a way of understanding why the world is the way it is today. Instead of memorising dates, he is interested in the decisions people made and the social conditions behind major events. I really admire that approach because it makes history feel relevant rather than distant.", "Personally, I enjoy talking to him because he can explain complicated events in a simple and engaging way. His enthusiasm is quite infectious, and he has actually made me more curious about history as well."], "phrase": ["put something into context", "把事物放进背景理解"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Describe someone who is fascinated by the past."}], "lesson": "唐代与文化根源", "extended": true, "stories": ["p2-course-history"]}, {"kind": "人物", "status": "当季", "zh": "教你技能的人", "en": "Someone who helped you pick up a skill", "id": "p2-8", "related": "p3-8", "questions": [{"prompt": "Describe someone who helped you pick up a skill.", "hooks": ["同事教拍人像", "靠窗侧身·拍照间隙聊天", "比较两张照片·关掉顶灯", "表情自然·记住怎么做"], "answer": ["I'd like to talk about my colleague Eva, who helped me get the hang of taking portraits. I wanted to photograph a friend for a profile page, but the pictures I took indoors always looked flat.", "Eva had me stand near a window and ask my friend to turn slightly so the light fell across her face. She also suggested talking to her between shots so she didn't have to hold the same smile.", "We took a photo before and after she turned off the ceiling light. In the first one, there were dark shadows under my friend's eyes. In the second, you could actually see her expression properly. Seeing the two images side by side helped me work out what to look for the next time I was taking a picture.", "The pictures looked much more natural, and I could see why. Eva let me make small changes and compare the results, so I remembered the lesson the next time I picked up a camera. Overall, I feel much more confident experimenting with light now."], "phrase": ["between shots", "拍摄间隙"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "get the hang of", "zh": "逐渐掌握窍门"}]}], "stories": ["p2-u2"], "extended": true}, {"kind": "人物", "status": "当季", "zh": "受欢迎的人", "en": "Someone people enjoy being around", "id": "p2-9", "related": "p3-9", "questions": [{"prompt": "Describe someone people enjoy being around.", "hooks": ["微信群里的邻居", "狗视频和问候", "群友开始互相帮忙"], "answer": ["I'm going to tell you about Mr Chen, who became well known in our building by getting neighbours to talk to each other. I first noticed him in our WeChat group during lockdown. He was the person who'd send a funny video just when everyone was getting a bit tired of talking about deliveries and rules.", "It wasn't just the jokes, though. He's a good listener and has an easy-going way of talking to people. One evening somebody mentioned that they lived alone and were finding things hard. Mr Chen replied to them privately, and the next day he started a little thread where people could say if they needed anything. A few neighbours offered to pick up groceries for people on the same floor. I ended up talking to someone who'd lived next door for two years and whose name I hadn't even known.", "I think he's popular because people feel comfortable around him. He never makes a big thing of what he's done, but the group is much friendlier now. I'd like to be that good at bringing people together. I hope I'll find my own way of making new people feel included."], "phrase": ["bring people together", "让大家聚到一起"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "easy-going", "zh": "随和的"}]}], "stories": ["p2-u6"], "lesson": "受欢迎的人与幽默", "extended": true}, {"kind": "人物", "status": "当季", "zh": "敬佩的运动员", "en": "An athlete you admire", "id": "p2-10", "related": "p3-10", "questions": [{"prompt": "Describe an athlete you admire.", "hooks": ["国际羽毛球赛", "落后时改变打法", "冷静等机会"], "answer": ["When it comes to this topic, the first thing that comes to mind is a badminton player I watched make a comeback in an international tournament. I was watching at home with my dad, and halfway through the second game we thought the match was nearly over. The player had already lost the first game and was several points behind. He kept trying to finish the rallies early, and quite a few of his shots were going out.", "After the break, he started playing differently. He sent the shuttle deep into one corner and then dropped it short on the other side. His opponent had to cover much more of the court. At one point, an attack finally opened up and he put the shuttle away. It was the first time in a while that he looked in control.", "He came back to win, and that's the part that stayed with me. It takes a fair amount of patience to change your game when you're already losing. Next time I'm behind in a match, I'd like to remember that I've still got choices about how to play the next point. I hope I can stay as composed under pressure the next time I fall behind in a game."], "phrase": ["put the shuttle away", "用一记制胜球结束这一分"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "批改稿", "en": "stay as composed under pressure", "zh": "在压力下保持冷静"}, {"kind": "批改稿", "en": "make a comeback", "zh": "扭转局势"}]}, {"label": "课堂完整范例 · 逆风翻盘的羽毛球赛", "hooks": ["国际赛·表现让人记住", "首局失利·变节奏等机会", "体能和冷静促成逆转"], "answer": ["I'd like to talk about a badminton player I watched in an international tournament. What impressed me was not only that he won the match, but the way he handled a very difficult situation.", "He lost the first game and was several points behind in the second, so it looked as though he might be eliminated. However, he stayed calm, changed his tactics and started playing more patiently. Instead of trying to win every rally immediately, he moved his opponent around the court and waited for better opportunities to attack. He eventually came back to win the match.", "I think he performed so well because of both physical ability and mental strength. At that level, most players are technically excellent, so the ability to remain composed under pressure can make the difference. His stamina was also impressive because the match was long and demanding. For me, his comeback showed that successful athletes need resilience and good decision-making, not just natural talent."], "phrase": ["remain composed under pressure", "压力下保持镇定"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Describe an athlete you admire.", "courseVocab": [{"kind": "批改稿", "en": "remain composed under pressure", "zh": "在压力下保持冷静"}, {"kind": "批改稿", "en": "changed his tactics", "zh": "改变战术"}]}], "lesson": "羽毛球逆转", "extended": true}, {"kind": "人物", "status": "当季", "zh": "你帮助改善体能的人", "en": "Someone you helped become more active", "id": "p2-11", "related": "p3-11", "questions": [{"prompt": "Describe someone you helped become more active.", "hooks": ["弟弟坐班不爱去健身房", "每周俩次公园走·自己加长", "不设步数·下雨才改", "后来还提醒我出门"], "answer": ["When I think about this question, the first person that comes to mind is how I got my brother to build a bit of exercise into his daily routine. He'd taken a desk job and said he barely moved on weekdays, but starting a gym routine felt like too much.", "We began with a short route round the park near his office. I met him there twice a week, and we talked about anything other than exercise. After a couple of weeks, he suggested taking the longer path himself.", "We agreed we wouldn't set a target for how far to walk. All he had to do was meet me by the park gate. One evening it started raining, so we just walked around the block and went home. We still met again two days later. That made the whole thing feel much easier to keep up.", "The change I noticed was that he stopped treating a walk as a chore. He goes by himself now, and sometimes he's the one who reminds me to get outside. I hope we keep meeting for walks even when neither of us feels we need the reminder."], "phrase": ["get into a habit", "养成习惯"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "人物", "status": "保留", "zh": "喜欢种植物的人", "en": "Someone who enjoys growing plants", "id": "p2-12", "related": "p3-12", "questions": [{"prompt": "Describe someone who enjoys growing plants.", "hooks": ["阳台只有晨光·从罗勒开始", "筷子撑番茄·送薄荷", "午饭剪罗勒·冬天挪进厨房", "每天观察长势"], "answer": ["I'd like to talk about my uncle, who grows herbs and vegetables on his balcony. He started with one pot of basil and gradually worked out what could survive on a balcony that only gets morning sun.", "He now has mint, tomatoes and a few chilli plants. The last time I visited, he showed me how he'd tied the tomato stems to chopsticks to stop them bending. He sent me home with more mint than I could use. I like the smell of fresh herbs when you rub a leaf between your fingers.", "While we were making lunch, he stepped outside to cut a few leaves from the basil. It was something he'd grown himself, and it smelled much stronger than the stuff I'd bought the week before. He told me he brings the pots in when it gets cold, which explained why there were marks from them all along the kitchen shelf.", "I think he likes having something to check on every morning. He remembers which plant did well each year and gets quite excited when something finally produces fruit. I'm tempted to try a couple of pots myself now that I've seen how much he can grow in a small space."], "phrase": ["produce fruit", "结果实"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true, "stories": ["p2-course-trees"]}, {"kind": "人物", "status": "保留", "zh": "童年朋友", "en": "A friend from your early years", "id": "p2-13", "related": "p3-13", "questions": [{"prompt": "Describe a friend from your early years.", "hooks": ["同栋楼·一起滑板车", "粉笔画路·雨天纸箱造城", "粉笔被雨冲掉·纸箱留住", "隔年见面也无需从头解释"], "answer": ["I'm going to tell you about Nina, a childhood friend I used to build things with. Our families lived in the same building, and we met because we both came downstairs with scooters on the same afternoon.", "We spent a lot of time drawing roads in chalk so we could pretend we were driving through a town. When it rained, we'd move indoors and build the same town out of boxes. We kept adding things for weeks.", "I remember one afternoon when it started raining just as we'd finished drawing a roundabout. We stood at the window watching the chalk wash off and decided to build the town again indoors. Nina made a bus stop out of a cereal box. It was still by the sofa when I came to her flat the next week.", "We live in different places now and only meet once or twice a year. But when we do meet, I never feel I have to explain every part of myself before we can have a proper conversation. We go back a long time, and I hope we keep making time for each other."], "phrase": ["draw in chalk", "用粉笔画"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "we go back a long time", "zh": "我们认识很久了"}]}], "extended": true}, {"kind": "人物", "status": "保留", "zh": "想从事医疗工作的人", "en": "Someone interested in a healthcare career", "id": "p2-14", "related": "p3-14", "questions": [{"prompt": "Describe someone interested in a healthcare career.", "hooks": ["表妹膝伤后想当理疗师", "学会自己安全训练·做志愿", "康复动作说清楚·记在小本", "擅长换方法解释"], "answer": ["When it comes to this topic, the first thing that comes to mind is my cousin, who wants to train as a physiotherapist. She got interested after a knee injury kept her away from basketball, and regular appointments helped her get back to playing.", "She told me the part she remembered best was learning to do an exercise safely on her own. Since then, she's volunteered at a local sports club and spoken to people in the profession about what the work is like.", "She used to write down the exercises after each appointment because she'd forget the order by the time she got home. Once she showed me how she'd been practising one of the movements. She explained where she used to get it wrong and how the physiotherapist helped her notice. I could see why she'd got interested in the work.", "I think it suits her because she's good at noticing when people don't understand an instruction. She'll demonstrate it a different way and give them time to practise. I hope she gets the chance to work with people returning to a sport they love, like she did."], "phrase": ["get back to playing", "重新开始运动"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "人物", "status": "保留", "zh": "创业成功的人", "en": "Someone who built a successful business", "id": "p2-15", "related": "p3-15", "questions": [{"prompt": "Describe someone who built a successful business.", "hooks": ["朋友在车站开修车店", "早送晚取·短信先报价", "下班前修好刹车·口碑", "回头客多·流程可预期"], "answer": ["When I think about this question, the first person that comes to mind is my friend Sara, who started a bike repair business from scratch. She started by fixing friends' bikes at weekends and noticed that commuters often needed a quick repair before going home.", "She rented a small space and offered a service where people could drop off a bike in the morning and collect it that evening. She texted each customer a price before doing any extra work.", "One customer came in with a brake that made a terrible noise on the way to the station. Sara explained what she could do that day and what would have to wait. He collected his bike on the way home and brought his partner's in the following week. Encounters like that helped the shop grow.", "The shop now gets plenty of repeat customers. I think that's mainly because she identified a problem that happened every day and made the whole process predictable for busy people. I hope her shop keeps its personal touch as it gets busier."], "phrase": ["repeat customers", "回头客"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "from scratch", "zh": "从零开始"}]}], "extended": true}, {"kind": "人物", "status": "保留", "zh": "善学语言的人", "en": "Someone who learns languages effectively", "id": "p2-16", "related": "p3-16", "questions": [{"prompt": "Describe someone who learns languages effectively.", "hooks": ["室友为首尔团队学韩语", "午餐听词·当天试说", "午餐学句子·隔天用", "一年能加入讨论"], "answer": ["I'd like to talk about my former flatmate Ana, who learned Korean so she could talk to her colleagues in Seoul. At first she only knew greetings, and she was nervous about making mistakes with people she saw every day.", "She began by learning the phrases her colleagues used at lunch. She wrote down one or two each day, then tried to use them in a short conversation before they slipped her mind.", "One day she asked a colleague to explain a phrase she'd heard people use when they were deciding where to eat. She wrote it down and tried it the next day. Her colleague understood her and answered normally. It was a small moment, but having a conversation that went on after that gave her quite a boost.", "A year later, she could join in without asking someone to translate every sentence. I admire how she gave herself plenty of small chances to speak, even when she knew she wouldn't get everything right. I'm much more willing to step out of my comfort zone when I practise a language now."], "phrase": ["slip my mind", "一时忘记"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "step out of my comfort zone", "zh": "走出舒适区"}]}], "extended": true}, {"kind": "人物", "status": "保留", "zh": "聪明地解决问题的人", "en": "Someone who found a clever fix", "id": "p2-17", "related": "p3-17", "questions": [{"prompt": "Describe someone who found a clever fix.", "hooks": ["校展外借器材总丢", "给借的人和物拍合照", "照片按顺序翻·一眼看见", "结束追得回·简单易用"], "answer": ["I'm going to tell you about my classmate Ben, who found a simple way to keep track of the equipment at a school fair. One of my jobs at the fair was to lend out things like extension cables to different stalls.", "Instead of making everyone fill out a form, he took a photo of each stall holder with the things they borrowed. He kept the pictures in order and deleted them once everything was back.", "Towards closing time, we saw that a stand was missing and everyone assumed someone else had packed it. Ben was pretty sharp about it. He went through the photos in order and found a picture of it being borrowed with two cables. We asked the stall holder and got it back within five minutes. Nobody had to remember which table they'd lent it to.", "At the end of the day we could see exactly who still had a cable or a sign. What I liked was that he solved the problem with a system busy volunteers could actually remember to use. I hope the next group running the fair borrows his idea and has an easier time of it."], "phrase": ["keep track of equipment", "随时掌握器材去向"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "pretty sharp", "zh": "反应很快"}]}], "stories": ["p2-u4"], "extended": true}, {"kind": "人物", "status": "保留", "zh": "克服挫折最终成功的人", "en": "Someone who recovered from a setback", "id": "p2-18", "related": "p3-18", "questions": [{"prompt": "Describe someone who recovered from a setback.", "hooks": ["朋友两次驾考没过", "换教练·出错先停再来", "先在安静街练·忘了就重来", "最终通过·不怕一次犯错"], "answer": ["When it comes to this topic, the first thing that comes to mind is my friend Jia, who dealt with a couple of setbacks before passing her driving test. Parallel parking was the part that made her nervous, and after one mistake she usually stopped concentrating on the rest of the test.", "She changed instructors and started practising on quieter roads. Her new instructor also taught her to pause and reset whenever something went wrong, instead of rushing to make up for it.", "I went out with her once towards the end of her lessons. She took a while to get the angle right and had to pull out and start again. What struck me was that she was able to laugh about it and carry on. A couple of months earlier, the same thing would've spoiled her whole afternoon.", "She passed a few months later. I remember how pleased she was that the final test felt manageable. She'd spent enough time dealing with mistakes in practice to know that one mistake wasn't the end of everything. Overall, I feel her patience paid off, and I'd try her approach if I had to retake a test."], "phrase": ["pause and reset", "停一下重新调整"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "paid off", "zh": "取得回报"}]}], "extended": true}, {"kind": "人物", "status": "保留", "zh": "常常帮助别人的人", "en": "Someone who regularly helps others", "id": "p2-19", "related": "p3-19", "questions": [{"prompt": "Describe someone who regularly helps others.", "hooks": ["邻居经常帮新住户", "指收包裹地点·发电话清单", "邻居收包裹·教去哪儿领", "帮小忙很好接受"], "answer": ["When I think about this question, the first person that comes to mind is my neighbour Lili, who often gives new residents a hand. When I arrived, I didn't know where to collect parcels or which bus stopped nearest to the metro.", "She showed me around in ten minutes and later sent me a short list of useful numbers. A few months afterwards, I saw her doing almost the same thing for a family with young children.", "One evening a delivery driver left something for me in a different part of the building. I mentioned it to Lili, and she walked over with me because the numbers on the doors were confusing. The whole thing took five minutes. Later, when someone new asked me the same question, I knew exactly what to tell them.", "She's warm-hearted, and I appreciate that her help is practical and easy to accept. She usually offers one small thing at a time, so you can say yes without feeling that you're putting her out. I hope I make it a little easier for the next person who moves into the building."], "phrase": ["put someone out", "给某人添麻烦"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "warm-hearted", "zh": "热心的"}]}], "stories": ["p2-u6"], "extended": true}, {"kind": "人物", "status": "当季", "zh": "本地知名人物", "en": "Someone well known in your neighbourhood", "id": "p2-20", "related": "p3-20", "questions": [{"prompt": "Describe someone well known in your neighbourhood.", "hooks": ["常年做面包的陆太太", "免费教青少年烘焙·妹妹烤焦", "姐姐回来炫耀面包·记住店", "面包吸引·分享留人"], "answer": ["I'd like to talk about Mrs Lu, a baker who's well known where I grew up. Her shop is small, but people have been going there for years, especially for the rolls she makes on Saturday mornings.", "She once ran a series of free baking sessions for teenagers during the holidays. My sister went to one and came home with rolls that looked slightly burnt but tasted good. She'd made them herself from scratch.", "My sister was so pleased with the rolls that she put one aside for our dad. When he asked where she'd learned to make it, she took him to the bakery the following Saturday. While they were there, someone came in to ask when the next class would be. That was when I realised how far word had spread.", "I think that sums up why people know Mrs Lu. The bread brings them to the shop, and her willingness to share what she knows gives them something to talk about afterwards. I hope she'll keep running the sessions, because there's nearly always someone asking about the next one."], "phrase": ["make something from scratch", "从头做起"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "from scratch", "zh": "从零开始"}]}], "extended": true}, {"kind": "人物", "status": "当季", "zh": "只见过一次却想了解的人", "en": "Someone you met once and would like to know better", "id": "p2-21", "related": "p3-21", "questions": [{"prompt": "Describe someone you met once and would like to know better.", "hooks": ["河边志愿时认识玛拉", "认出弯的谱架·知道修", "旁边有人认不出谱架·她一眼认出", "想问怎么入行和最难修理"], "answer": ["I'm going to tell you about Mara, a woman I met just once while volunteering by the river. We were sorting supplies for a clean-up, and she told me she used to repair instruments for a living.", "It came up because she recognised a bent piece of metal someone had found as part of an old music stand. She explained how she'd straighten it without snapping it. A few minutes later we had to go to different parts of the riverbank.", "I remember the two of us turning the metal piece over because it looked like it could've come from just about anything. She pointed out the part that would have held a sheet of music and drew the rest of the stand in the dirt with a stick. We never even got on to what she'd done before that job.", "I'd like to ask how she got into such an unusual job and what the hardest repairs were. I've only met her that once, but the way she described her work made me curious about it. I hope I run into her again and get a chance to ask her what she enjoyed about repairing instruments."], "phrase": ["get into an unusual job", "入行做一份少见的工作"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "人物", "status": "当季", "zh": "主动改善体能的人", "en": "Someone who took steps to improve their fitness", "id": "p2-22", "related": "p3-22", "questions": [{"prompt": "Describe someone who took steps to improve their fitness.", "hooks": ["同事爬楼喘", "提前一站下车·午休走", "慢慢坚持下来"], "answer": ["When it comes to this topic, the first thing that comes to mind is my colleague Omar, who found a way to fit more physical activity into a normal working day. We work upstairs, and one morning he stopped halfway up the stairs and joked that he was already out of breath. He spent most of the day at a desk and wanted to move a bit more without having to build his whole week around going to the gym.", "He started by getting off the bus one stop early on the way to work. On days when the weather was decent, he'd sometimes go out again at lunch. I went with him once and he showed me a route that takes you past a row of trees and back to the office in twenty minutes. He also started protecting his sleep, especially in the middle of a busy week.", "What I like about his approach is that it fits into the life he already has. A few months later we went up those stairs together, and he was still talking when we reached the top. I started going out at lunchtime myself more often after that. Overall, I feel his example makes it easier to see how a healthy routine can be sustainable in the long run."], "phrase": ["fit into daily life", "融入日常生活"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "批改稿", "en": "protecting his sleep", "zh": "把睡眠放在重要位置"}, {"kind": "批改稿", "en": "sustainable in the long run", "zh": "从长远看做得到"}]}, {"label": "课堂完整范例 · 作息规律的前同事", "hooks": ["以前共事·观察到习惯", "早餐运动做饭·保证睡眠", "习惯长期可行·影响我"], "answer": ["A person I know who has a particularly healthy routine is one of my former colleagues. We got to know each other through work, and I gradually noticed that she was extremely consistent with her lifestyle.", "She usually gets up early, has a proper breakfast and exercises before work several times a week. She doesn't follow an extreme diet, but she cooks most of her meals herself and tries to eat plenty of vegetables and protein. Another habit I admire is that she protects her sleep. Even when work gets busy, she rarely stays up unnecessarily late.", "What makes her lifestyle impressive is that it is sustainable. She doesn't treat health as a short-term challenge or obsess over every calorie. Instead, she has built a few sensible habits into her normal routine. I admire her because she is disciplined without making it look stressful. Being around her has also encouraged me to pay more attention to sleep, exercise and regular meals rather than relying on motivation alone."], "phrase": ["stick to a routine", "坚持一套作息"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Describe someone who took steps to improve their fitness.", "courseVocab": [{"kind": "批改稿", "en": "protects her sleep", "zh": "把睡眠放在重要位置"}]}], "lesson": "把运动融入日常", "extended": true}, {"kind": "人物", "status": "保留", "zh": "在成功公司工作的人", "en": "Someone who works for a thriving company", "id": "p2-23", "related": "p3-23", "questions": [{"prompt": "Describe someone who works for a thriving company.", "hooks": ["表姐在餐饮设备公司收反馈", "搅拌机难洗·做出易拆版", "厨房忙时看员工怎么洗", "客户反馈看得到变化"], "answer": ["When I think about this question, the first person that comes to mind is my older cousin, who works at a successful firm making equipment for restaurants. It started with a single product and now sells to kitchens in several countries. She works on the team that handles feedback from customers.", "She once told me about a restaurant where a mixer was hard to clean during a busy shift. Her team asked staff to show them the problem and passed the details to the designers. A later version was easier to take apart.", "What I found interesting was that her team went in when the kitchen was busy enough to see the real problem. The staff were trying to clean the mixer between orders and there wasn't much room to lay the parts out. Seeing it for themselves helped them notice something the complaint on its own hadn't made clear.", "I like hearing those stories because they show how a company can grow by listening carefully to its customers. I can also see why she enjoys having a job where her suggestions lead to visible changes. Overall, I feel like I'd enjoy a working atmosphere where people can see what happens to their suggestions."], "phrase": ["take something apart", "拆开某物"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "working atmosphere", "zh": "工作氛围"}]}], "extended": true}, {"kind": "事件", "status": "当季", "zh": "结果令人满意的决定", "en": "A decision that turned out well", "id": "p2-24", "related": "p3-24", "questions": [{"prompt": "Describe a decision that turned out well.", "hooks": ["怕课程占周末·自学卡住", "问老师·试最短班", "出门前紧张·同学给反馈", "拍出好照片交到朋友"], "answer": ["I'd like to talk about my decision to sign up for a weekend photography course. I was worried that it would take up too much time, but I'd spent a year trying to improve on my own and felt stuck.", "I called the tutor and found out that we'd be outdoors for most sessions. I booked the shortest course first, so I could see whether I liked learning in a group.", "On the first morning I almost turned around at the bus stop because I didn't know anyone and hadn't used my camera much. In the class, we paired up and took two pictures in different light. My partner pointed out a shot I was about to delete and showed me what she liked about it. That was a good start.", "By the end, I'd taken a series of portraits I was happy to show people. I also met someone I still go on photo walks with. I'm glad I stepped out of my comfort zone and gave it a try. I hope I'll take another course when there's something I want to learn and I've reached a point where I need feedback."], "phrase": ["talk myself out of it", "说服自己打消念头"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "stepped out of my comfort zone", "zh": "走出了自己的舒适区"}]}], "stories": ["p2-u4", "p2-course-delay"], "extended": true}, {"kind": "事件", "status": "当季", "zh": "看名人接受采访", "en": "Watching a public figure being interviewed", "id": "p2-25", "related": "p3-25", "questions": [{"prompt": "Talk about your experience of watching a public figure being interviewed.", "hooks": ["在家看运动员采访", "输球后重看最后一局", "也会失去信心"], "answer": ["I'm going to tell you about an interview in which a badminton player spoke openly about losing confidence after a match. I came across a short clip on my phone after dinner, then watched the full interview at home. I expected the usual questions about medals and training, so I was surprised when the interviewer asked about a match he'd lost.", "The player said he'd avoided watching the replay for days. When he finally sat down with his coach, they only watched the last game and picked out two things he could change. He remembered rushing his serves whenever he fell behind. They worked on that at training the next morning, one serve at a time.", "I liked hearing him talk about something that was still difficult for him. You usually see a short clip of a player holding a trophy, and it can look as if confidence comes naturally to them. He sounded like someone who'd had a rough week and was figuring out how to deal with pressure the next time he played. I found that quite reassuring. Overall, I feel reassured by the idea that progress is rarely a straight line, even for people at that level."], "phrase": ["fall behind", "落后"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "批改稿", "en": "spoke openly about", "zh": "坦率谈论"}, {"kind": "批改稿", "en": "deal with pressure", "zh": "应对压力"}, {"kind": "批改稿", "en": "progress is rarely a straight line", "zh": "进步很少一帆风顺"}]}, {"label": "课堂完整范例 · 运动员谈输球和压力", "hooks": ["家里看运动员采访", "失利打击信心·团队支持", "真诚可信·对挫折释然"], "answer": ["One interview I remember clearly was with a well-known athlete. I watched it online at home after seeing a short clip on social media. The interview focused on the pressure of competing professionally and how the athlete dealt with failure.", "What caught my attention was that the conversation was not mainly about trophies or achievements. The athlete spoke quite openly about losing confidence after an important defeat and explained how training, support from the team and a more balanced mindset helped with recovery. I found the interview refreshing because famous people are often presented as if they are naturally confident and successful all the time. This interview showed a more human side. The answers also felt thoughtful rather than rehearsed, which made the conversation more believable.", "After watching it, I felt motivated but also reassured. It reminded me that setbacks are normal even for highly successful people, and that progress is rarely a straight line."], "phrase": ["speak openly about", "坦率谈论"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Talk about your experience of watching a public figure being interviewed.", "courseVocab": [{"kind": "批改稿", "en": "progress is rarely a straight line", "zh": "进步很少一帆风顺"}]}], "lesson": "名人采访与挫折", "extended": true}, {"kind": "事件", "status": "当季", "zh": "存钱买特别的东西", "en": "Putting money aside for something special", "id": "p2-26", "related": "p3-26", "questions": [{"prompt": "Talk about your experience of putting money aside for something special.", "hooks": ["合租不能专注·想买降噪耳机", "带午饭周周存", "临时想买便宜款·还是等", "火车上终于能读书"], "answer": ["When it comes to this topic, the first thing that comes to mind is the time I put money aside for a pair of noise-cancelling headphones. I wanted somewhere quiet to concentrate, but I couldn't afford the pair I liked straight away.", "I set a weekly target and brought lunch from home three days a week. Whenever I was tempted to order food, I checked how much I'd already put aside. It took a little over two months.", "Halfway through, I saw a much cheaper pair and was tempted
