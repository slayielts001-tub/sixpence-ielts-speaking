re I could finally stand still long enough to flip through it.", "I liked the fair itself, but it was hard to flip through a book at my own pace. If I went again, I'd arrive later in the day, even if some of the best things had already gone. Overall, I feel I'd enjoy it more at a quiet time when I could flip through the books without blocking the aisle."], "phrase": ["browse at my own pace", "按自己的节奏慢慢看"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "flip through", "zh": "随手翻阅"}]}], "extended": true}, {"kind": "地点", "status": "当季", "zh": "经常去却不喜欢的短途行程", "en": "A short journey you make often and dislike", "id": "p2-75", "related": "p3-75", "questions": [{"prompt": "Describe a short journey you make often and dislike.", "hooks": ["短途坐公交去超市", "下雨等车没遮挡还拎东西", "拎沉袋等雨停·调时间", "改周六早去不赶"], "answer": ["When I think about this question, the first place that comes to mind is a short bus journey I make to a supermarket that can take much longer than it should. The trip is only a couple of kilometres, but it crosses two very busy junctions.", "The part I dislike is that the timetable looks fine until it rains or a bus gets stuck. The stop has almost no shelter, and I usually have a heavy bag on the way back. A short trip can take up most of my lunch break.", "Last winter I went straight after work and waited at the stop in the rain with two heavy bags. A bus went past while I was still on the other side of the road. By the time I got home I could have done the shopping twice over. Going at a quieter time has made a surprisingly big difference.", "I still go because the shop carries things I can't get near home. I try to go early on Saturday now, when there's less traffic and I don't feel pressed for time. I hope the stop gets a better shelter, because it would make the trip a lot easier in winter."], "phrase": ["feel pressed for time", "感到时间紧迫"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "地点", "status": "当季", "zh": "喜欢去的建筑", "en": "A building you enjoy visiting", "id": "p2-76", "related": "p3-76", "questions": [{"prompt": "Describe a building you enjoy visiting.", "hooks": ["走路可达·球形外墙", "图书馆翻新·窗边阅读", "比在家专注"], "answer": ["I'd like to talk about the library within walking distance of my flat, which was recently renovated. It's close enough to walk to, and you can normally spot it from the main road because the front of the building looks a bit like a giant globe. It was done up a while ago, and I went to have a look the first weekend it reopened.", "What I noticed straight away was how much more daylight there was inside. There are long tables by the windows, a quiet room at the back and a little space where they put on exhibitions. If I've got work to do, I take my laptop upstairs. If I'm just there for a break, I have a look at what's on or find a book to flip through by the window.", "I go quite often because it's easier to concentrate there than it is at home. When I see other people quietly getting on with their work, I tend to do the same. It's also one of the few places in my area where I can stay for a while without having to buy anything. Overall, I feel lucky to have somewhere with that kind of atmosphere where I can get some work done."], "phrase": ["get on with your work", "专心做手头的事"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "flip through", "zh": "随手翻阅"}, {"kind": "课件", "en": "within walking distance", "zh": "步行可达"}, {"kind": "批改稿", "en": "get some work done", "zh": "完成一些学习或工作"}]}, {"label": "课堂完整范例 · 伦敦的大英图书馆", "hooks": ["国王十字站旁·朋友介绍", "外观朴素·玻璃藏书塔", "容易专注·也能看展"], "answer": ["A public building I really enjoy visiting is the British Library in London, which is close to King's Cross station. I first heard about it from friends when I was studying in London, and later I started going there quite regularly when I needed a quiet place to read or work.", "From the outside, the building is fairly modern and perhaps not especially eye-catching. However, the interior is spacious and well organised. There are large reading areas, exhibitions and plenty of seats. One of the most impressive features is the glass tower containing old books in the centre of the building, which gives the place a strong academic atmosphere.", "I enjoy visiting it for two main reasons. First, it is much easier for me to concentrate there than at home because everyone around me is studying or reading. Second, I like the atmosphere. Even when I am not doing serious academic work, I can walk around an exhibition or simply have a coffee and read. For me, it is both a practical place to study and somewhere I can slow down and enjoy being surrounded by books."], "phrase": ["a change of scenery", "换个环境"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "prompt": "Describe a building you enjoy visiting.", "courseVocab": [{"kind": "课件", "en": "slow down", "zh": "放慢节奏"}, {"kind": "批改稿", "en": "surrounded by books", "zh": "被书籍环绕"}, {"kind": "批改稿", "en": "academic atmosphere", "zh": "学习氛围"}]}], "stories": ["p2-u5"], "lesson": "社区图书馆翻新", "extended": true}, {"kind": "地点", "status": "保留", "zh": "喜欢或不喜欢的高楼", "en": "A tall building you have strong feelings about", "id": "p2-77", "related": "p3-77", "questions": [{"prompt": "Describe a tall building you have strong feelings about.", "hooks": ["车站高楼是地标", "把广场罩在阴影里", "阴影让公共座位没人用", "位置合理但应考虑周围"], "answer": ["I'm going to tell you about a tall office tower near our main station that I have mixed feelings about. It's easy to spot from the train, and people use it as a landmark when giving directions.", "At street level, though, it casts a long shadow over a square where people used to sit. I went there to meet a friend one winter and noticed that almost everyone stayed on the sunny side of the road.", "I walked past the same square again a few weeks later at about midday. There was a coffee stand and a row of decent benches, but people were drinking on the other side of the road without anywhere to sit. It seemed like a small thing, yet it changed how the whole space felt.", "I can see why the tower was built there, because so many people arrive at the station each day. I wish the design had given more thought to how people would use the space around it. Overall, I feel that a building can be useful and still make the place around it less pleasant to spend time in."], "phrase": ["cast a long shadow", "投下长长的阴影"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "mixed feelings", "zh": "复杂的感受"}]}], "extended": true}, {"kind": "地点", "status": "保留", "zh": "去过的无聊地点", "en": "A place you found dull", "id": "p2-78", "related": "p3-78", "questions": [{"prompt": "Describe a place you found dull.", "hooks": ["错过换乘等长途车", "自动售卖坏·窗外只有墙", "快到了没信息·不敢走开", "没发车信息不敢放松"], "answer": ["When it comes to this topic, the first thing that comes to mind is a coach terminal where I spent an hour after missing a connection. I couldn't leave because the next coach was due to arrive at any time.", "The waiting area had a few plastic seats, a vending machine that didn't work and almost nothing to read. I tried to look outside, but the windows faced a concrete wall. Most people just stared at their phones.", "I thought about going to get something to eat, but there was no screen with a reliable arrival time and I didn't want to miss the second coach as well. I stayed where I was and kept checking the door. A notice saying it would be another forty minutes would've made it a completely different wait.", "I think I'd have felt differently if there had been a clear display showing when the coach was coming. As it was, I couldn't relax enough to do anything with the time. I hope they put up a reliable departures display so people can use their waiting time better."], "phrase": ["miss a connection", "错过换乘"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}], "extended": true}, {"kind": "地点", "status": "保留", "zh": "去过且愿意推荐的地方", "en": "Somewhere you visited and would recommend", "id": "p2-79", "related": "p3-79", "questions": [{"prompt": "Describe somewhere you visited and would recommend.", "hooks": ["运河小镇周末徒步", "仓库烘焙店·早市摆摊", "问面包店的人·推荐沿水路线", "建议过夜避开当天客流"], "answer": ["When I think about this question, the first place that comes to mind is a small canal town I'd recommend to anyone who wants a change of scenery. You can reach the centre on foot from the station and never really need a car.", "I followed the canal past some old warehouses and stopped at a bakery inside one of them. The next day I took a different route and got to a little market just as people were setting up their stalls.", "I asked the person at the bakery whether it was possible to walk back along the other side of the canal. She drew a route for me on a scrap of paper and marked a bridge that wasn't on the map I'd been using. I went that way the following morning and had most of it to myself.", "I'd recommend staying overnight because the streets were quieter before the day visitors arrived. I liked having enough time to go somewhere twice if I found a place I enjoyed. In the future, I think I will go back for another weekend and try a different route along the canal."], "phrase": ["stay overnight", "住一晚"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "批改稿", "en": "a change of scenery", "zh": "换个环境"}]}], "extended": true}, {"kind": "地点", "status": "保留", "zh": "爱去做客但不想住的家", "en": "A home you enjoy visiting but wouldn't live in", "id": "p2-80", "related": "p3-80", "questions": [{"prompt": "Describe a home you enjoy visiting but wouldn't live in.", "hooks": ["乡下祖父母家有院子", "饭后安静·亲友住得下", "乡下晚上很安静·不过车站远", "长住公交少·日常不便"], "answer": ["I'd like to talk about my grandparents' house in the countryside, where I love to visit. It has a shady courtyard and a large table where we usually eat lunch when the weather's warm.", "I like how quiet it gets after dinner. There are few cars, and you can sit outside without hearing traffic from the next street. My grandparents also have enough room for several people to stay.", "Last time I stayed there I wanted to go out for a couple of things after dinner, but the local shop had already closed. My grandparents were used to buying everything before they came home. I don't really plan my week that way, which is probably why I enjoy being there most when I have a few free days.", "I wouldn't choose to live there full-time because the nearest station is a long way away and the buses stop quite early. It's wonderful when I have time to slow down, but it would make my normal week harder to organise. Overall, I feel that I can escape the hustle and bustle there for a few days, even if living there would make my week harder to organise."], "phrase": ["live there full-time", "长期住在那里"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "hustle and bustle", "zh": "喧闹与忙碌"}, {"kind": "课件", "en": "slow down", "zh": "放慢节奏"}]}], "extended": true}, {"kind": "地点", "status": "保留", "zh": "空闲时想去的地方", "en": "Somewhere you'd like to visit on a free day", "id": "p2-81", "related": "p3-81", "questions": [{"prompt": "Describe somewhere you'd like to visit on a free day.", "hooks": ["有空想去城边植物园", "和妹妹先逛室外再喝点东西", "妹妹也喜欢随意走·玻璃温室避雨", "可待一小时也可到关门"], "answer": ["I'm going to tell you about a botanical garden on the edge of town where I'd like to spend a free afternoon. I've seen photographs of the glasshouses, but I've only ever gone past the entrance on a bus.", "I'd go with my sister and start in the outdoor area if the weather was good. Neither of us knows much about plants, so I'd choose one or two things to look at properly and then stop for a drink.", "My sister and I tend to have long conversations when we go somewhere without a tight schedule. If it started raining, we could go inside and spend some time in one of the glasshouses. I'd like to look for the plants with the biggest leaves because those are the ones I remember from the photos.", "It appeals to me because there'd be no need to plan the whole day around it. We could wander for an hour and enjoy the tranquillity or stay until closing time, depending on how much we found to see. I hope my sister comes with me so we can slow down and see what catches our attention."], "phrase": ["wander for an hour", "闲逛一个小时"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "enjoy the tranquillity", "zh": "享受宁静"}, {"kind": "课件", "en": "slow down", "zh": "放慢节奏"}]}], "extended": true, "stories": ["p2-course-yunnan"]}, {"kind": "地点", "status": "当季", "zh": "去过的自然景观附近的地方", "en": "Somewhere you visited near a natural feature", "id": "p2-82", "related": "p3-82", "questions": [{"prompt": "Describe somewhere you visited near a natural feature.", "hooks": ["和朋友去水库旁小村", "买面包沿水走·风大躲矮墙", "村里买吃的·回程休息喝茶", "无车也能到·回程喝茶"], "answer": ["When it comes to this topic, the first thing that comes to mind is a little village near a reservoir where I went walking with friends. We went there because the walking trail along the water starts just outside the village.", "We bought bread near the bus stop and followed a path to a picturesque spot where we could see the reservoir between the trees. There was a strong breeze off the water, so we sat behind a low wall to eat.", "The wall was just high enough to block the wind, and after we sat there for a while we could hear the water from the other side. A friend wanted to keep walking, but we decided to give ourselves enough time to get back before the bus. We stopped for tea by the shop where we'd bought the bread.", "I remember the village because it made visiting the reservoir straightforward. We could get there without a car, and there was somewhere to warm up over tea before we caught the bus home. Overall, I feel I'd happily go back for the fresh air and the chance to spend a bit more time by the water."], "phrase": ["a breeze off the water", "从水面吹来的风"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "a picturesque spot", "zh": "景色宜人的地方／风景"}]}], "extended": true, "stories": ["p2-course-hike"]}, {"kind": "地点", "status": "保留", "zh": "喜欢去的安静地方", "en": "A quiet spot you like spending time in", "id": "p2-83", "related": "p3-83", "questions": [{"prompt": "Describe a quiet spot you like spending time in.", "hooks": ["图书馆深处小阅览室", "窗边阅读·翻页雨声", "靠窗小房间·不用消费也能坐", "不被家务提醒打扰"], "answer": ["When I think about this question, the first place that comes to mind is a quiet reading room at the back of my local library where I can get away from the bustle of the main street. You reach it through a side corridor, so few people pass through on their way somewhere else.", "I like sitting near the window with a book I can finish in one visit. You can hear an occasional page turn or rain against the glass, but there's very little conversation.", "I first went into that room because the tables in the rest of the library were full. I found a seat near the window and planned to stay until someone left upstairs. After twenty minutes I realised I didn't want to move. Now if I have a free afternoon, that's usually the first place I check.", "I find that kind of quiet easier to enjoy than sitting alone at home. Other people are nearby, and there isn't a pile of washing or a phone charger reminding me what I should be doing. I hope it stays a place where people can sit and clear their minds for a while."], "phrase": ["a side corridor", "侧面走廊"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "clear their minds", "zh": "让头脑清静"}]}], "stories": ["p2-u1", "p2-u5"], "extended": true}, {"kind": "地点", "status": "当季", "zh": "想再去的城市", "en": "A city you'd happily visit again", "id": "p2-84", "related": "p3-84", "questions": [{"prompt": "Describe a city you'd happily visit again.", "hooks": ["想再去青岛·日落海边", "错过咖啡馆老街", "首访赶火车·下次选住那片", "住那片·平日慢逛"], "answer": ["I'd like to talk about Qingdao, a city I'd love to visit again. I spent two days there with a friend and remember taking a long walk beside the sea just before sunset.", "On our last morning, we passed a street with several small cafés and older houses, but we had to get to the station. I remember wishing we'd left one day without much planned.", "We'd chosen a hotel near the station the first time because we didn't know how long the journeys would take. Next time I'd stay nearer the cafés we saw. I could go out for breakfast before the street got busy, and I'd have time to ask someone who lives there which way to walk if I wanted to get back towards the sea.", "If I went back, I'd stay near that part of town and explore it slowly. I'd still walk by the water, but I'd like to see more of what the city feels like on an ordinary weekday. In the future, I think I will leave more time to experience local life instead of fitting everything into two days."], "phrase": ["leave a day free", "留一天不安排行程"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "experience local life", "zh": "体验当地生活"}]}], "extended": true}, {"kind": "地点", "status": "保留", "zh": "重要的河流或湖泊", "en": "An important river or lake in your country", "id": "p2-85", "related": "p3-85", "questions": [{"prompt": "Describe an important river or lake in your country.", "hooks": ["武汉江边看到长江", "运货船与岸边散步的人", "岸边看船·对比以前理解", "运输和生活都靠河"], "answer": ["I'm going to tell you about the Yangtze River, which I first saw properly when I visited Wuhan. I first saw it properly when I visited Wuhan, where I stood on the bank and watched boats going past.", "I'd known from school that the river connects places a long way apart. Seeing the bustling waterfront for myself helped me understand what that meant. There were people out walking in the evening while cargo boats were still moving along the water.", "I remember seeing several boats come from the same direction while people next to me were just taking an evening walk. I'd heard about the river in school, but I'd always pictured it on a map. Standing there made it much easier to imagine how it links towns and cities far beyond the part I could actually see.", "That mix of everyday life and work stayed with me. People depend on a river in several ways, which is also why decisions about how to use and protect it matter far beyond one city. Overall, I feel that seeing the river in person helped me understand why protecting it matters to so many places."], "phrase": ["stand on the bank", "站在河岸上"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "bustling waterfront", "zh": "热闹的滨水区"}]}], "extended": true}, {"kind": "地点", "status": "补充", "zh": "想去旅行的地方", "en": "A destination you hope to travel to", "id": "p2-86", "related": "p3-86", "questions": [{"prompt": "Describe a destination you hope to travel to.", "hooks": ["想去云南大理", "朋友·湖边骑车·逛早市", "慢下来再回工作"], "answer": ["When it comes to this topic, the first thing that comes to mind is Dali in Yunnan, where I'd love to take a trip with a couple of friends. One of them went last spring and showed me some pictures she'd taken around Erhai Lake. What caught my eye was how much time she'd spent just walking or sitting by the water. That's the sort of break I'd like to have.", "I'd stay for three or four days and leave at least one morning free. We could rent bikes and ride part of the way around the lake, or walk to a market and see what people were having for breakfast. I'd also ask my friend which part of town she stayed in, because I'd like to be somewhere we could get around easily on foot.", "I think the main reason I want to go is to slow down a bit. When I try to fit too many sights into a trip, I come back feeling like I need another day off. A few days by the water would give us a chance to recharge before we went back to our normal routine. I hope we get a chance to slow down, experience local life and come back feeling recharged."], "phrase": ["fit too much into a trip", "把行程排得太满"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "recharge", "zh": "恢复精力"}, {"kind": "课件", "en": "slow down", "zh": "放慢节奏"}, {"kind": "课件", "en": "experience local life", "zh": "体验当地生活"}]}], "lesson": "云南旅行", "extended": true, "stories": ["p2-course-yunnan"]}, {"kind": "地点", "status": "海外补充", "zh": "家里放松的地方", "en": "A place at home where you unwind", "id": "p2-87", "related": "p3-87", "questions": [{"prompt": "Describe a place at home where you unwind.", "hooks": ["卧室窗边的椅子挪出来", "饭后读书喝茶·远离书桌", "把工作和休息分开·用一盏灯", "小角落标记下班"], "answer": ["When I think about this question, the first place that comes to mind is the chair by my bedroom window where I go to wind down after dinner. It used to be covered in clothes, but I moved it closer to the light and put a little table next to it.", "I usually sit there for twenty minutes after dinner. I make tea and read a couple of pages or look outside while the street gets quieter. My desk is on the other side of the room, so I can leave work things where they are.", "Sometimes I read the same few pages again because by that point I'm quite tired. Other evenings I just make tea and watch people going home. The little lamp beside the chair helps because I can leave the main light off. It feels different from sitting down at my desk and getting ready to do another bit of work.", "I like that I don't need much space for the chair. Having a regular place to sit gives me a simple way to end the working part of the day. Overall, I feel I can clear my mind there even if I only have twenty minutes to myself."], "phrase": ["the working part of the day", "一天中用来工作的那段时间"], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "wind down", "zh": "放松下来"}, {"kind": "课件", "en": "clear my mind", "zh": "让头脑清静"}]}], "extended": true}, {"id": "p2-u1", "kind": "地点", "status": "通用素材", "zh": "关掉通知去公园", "en": "A park break without my phone", "related": "p3-73", "questions": [{"prompt": "Describe a place you go to when you want to relax.", "hooks": ["忙乱的一周·手机响不停", "绕湖跑步·雨后草香", "家人野餐·找回节奏"], "phrase": ["turn my notifications off", "关闭消息通知"], "answer": ["I'd like to talk about a local park that gives me a chance to switch off and get close to nature. I started going there when I was studying for finals and getting a bit fed up with how much time I was spending on my phone. I'd sit down to work and a message would come through before I'd even opened my notes.", "One Saturday I went for a jog around the pond and turned my notifications off before I left. It had just rained, and the air smelled of wet grass. After a couple of laps, I sat on a bench and flipped through a few pages of my book in the sunshine. The funny thing was that I'd brought my phone in case I got bored, but I didn't take it out once.", "Since then, I've taken my family there for a picnic a few times. We usually bring something simple and stay until it starts to get cool. I like having a place where I can get some exercise, spend time with people and come back feeling a bit more like myself. I hope I keep making time for that little digital detox, especially when work starts to feel too busy."], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "get close to nature", "zh": "亲近自然"}, {"kind": "课件", "en": "digital detox", "zh": "暂时远离电子设备"}, {"kind": "课件", "en": "flipped through", "zh": "随手翻阅"}, {"kind": "课件", "en": "in the sunshine", "zh": "在阳光下"}, {"kind": "课件", "en": "wet grass", "zh": "新鲜草地或雨后草地"}]}, {"prompt": "Describe a place you go to when you want to relax.", "label": "课堂完整范例 · 公园里的数字排毒", "hooks": ["社区公园 · 城市喧嚣 · 通知多", "慢跑 · 躺在草地上 · 鸟鸣和流水", "周末野餐 · 亲人聊天 · 放手机", "秋风 · 回想过去 · 脑子更清楚"], "answer": ["I'd like to talk about the park near where I live. City life is full of hustle and bustle. There's traffic, noise from construction sites and the occasional ambulance siren. On top of that, I'm constantly bombarded with notifications from different apps. Going to the park is a way for me to calm down and get some peace and quiet.", "I usually go jogging or just sit on a bench there. After jogging, I often lie down on the grass to rest. I can hear the chirping of the birds and the water running in the stream. I can smell the flowers and the fresh grass as well. If it's just rained, the air feels especially fresh.", "I also spend quality time with my family there at weekends. We sometimes go for a picnic and talk about how things have been. I usually turn off my notifications while we're there. For me, that's a form of digital detox.", "I often reflect on things while enjoying the tranquillity and feeling the gentle autumn breeze on my face. Overall, I feel that going there helps me clear my mind and think more clearly about what I want to do next."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "clear my mind", "zh": "让头脑清静"}, {"kind": "课件", "en": "digital detox", "zh": "暂时远离电子设备"}, {"kind": "课件", "en": "hustle and bustle", "zh": "喧闹与忙碌"}, {"kind": "课件", "en": "bombarded with notifications", "zh": "被大量通知轰炸"}, {"kind": "课件", "en": "spend quality time", "zh": "好好相处"}, {"kind": "课件", "en": "chirping of the birds", "zh": "鸟鸣"}, {"kind": "课件", "en": "fresh grass", "zh": "新鲜草地或雨后草地"}, {"kind": "课件", "en": "gentle autumn breeze", "zh": "微风"}]}], "adaptations": [{"id": "p2-73", "note": "先交代地点和自然细节，再讲雨后草地、鸟声和绕池慢跑。"}, {"id": "p2-83", "note": "突出公园里较安静的角落，以及那里和街道的声音差别。"}, {"id": "p2-43", "note": "把主场景换成自带食物去野餐，说明当天花了多少钱。"}, {"id": "p2-41", "note": "突出从一回家就刷手机，到主动关通知、出门散步。"}], "lesson": "公园与数字排毒", "extended": true}, {"id": "p2-u2", "kind": "经历", "status": "通用素材", "zh": "从零学语音识别", "en": "Learning speech recognition from scratch", "related": "p3-45", "questions": [{"prompt": "Describe a challenge that taught you something useful.", "hooks": ["商科背景·好奇语音识别", "录十段声音·请教老师", "读懂结果·有成就感"], "phrase": ["feel out of my depth", "感到超出自己的能力范围"], "answer": ["I'm going to tell you about a project on speech recognition that made me step out of my comfort zone. I'd studied business, so I knew very little about programming. But I'd watched a voice assistant get a friend's name wrong three times in a row, and I wanted to know why familiar speech could be so hard for a machine to deal with.", "I started with an online course, but I got lost as soon as the tutor began talking about how to label the data. A teacher suggested I work with ten short recordings and listen to every one before trying anything bigger. I did that, and it turned out that several of my recordings had background noise I'd barely noticed when I made them. I re-recorded a few and compared the results.", "It was satisfying when I could finally explain what had changed in my own words. I still feel out of my depth sometimes, but I know what helps me get started. I can pick one small problem, try something and actually see what happens. Overall, I feel a sense of achievement when I can explain something I had to learn from scratch."], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "sense of achievement", "zh": "成就感"}, {"kind": "课件", "en": "from scratch", "zh": "从零开始"}, {"kind": "课件", "en": "step out of my comfort zone", "zh": "走出舒适区"}, {"kind": "批改稿", "en": "background noise", "zh": "持续的背景声"}]}], "adaptations": [{"id": "p2-45", "note": "把线上课程放在开头，说明哪一节课或哪个方法给你留下印象。"}, {"id": "p2-38", "note": "明确声音样本有背景噪音，以及你通过重录和对照来排查。"}, {"id": "p2-8", "note": "换成老师是主角，说清对方怎样把任务缩成十段录音。"}, {"id": "p2-62", "note": "把已经做完的小项目当作起点，补上之后想做的项目和时间计划。"}], "lesson": "从零学语言与科技", "extended": true}, {"id": "p2-u3", "kind": "经历", "status": "通用素材", "zh": "伦敦的中秋饭局", "en": "A Mid-Autumn dinner away from home", "related": "p3-32", "questions": [{"prompt": "Describe an evening with friends that you remember well.", "hooks": ["伦敦留学·家里发照片", "拼餐桌·分月饼·打电话", "异乡也有人陪"], "phrase": ["feel a bit homesick", "有点想家"], "answer": ["When it comes to this topic, the first thing that comes to mind is a Mid-Autumn dinner I had with friends while studying in London. My family had sent me photos of their dinner earlier in the day, and I was feeling a bit homesick. A friend said we could all come to her flat and bring one thing to eat.", "There were about ten of us, so we pushed two small tables together and borrowed a couple of chairs from next door. One friend brought mooncakes and cut each one into pieces so everyone could try the different fillings. At one point somebody called their parents and held the phone up so we could all wave. We were still talking when the last bus was nearly due.", "What I remember is how quickly the place started to feel like home. We all missed different things about the festival and got to share a little of what it meant to us. I'd happily do it again, even if we only had time for tea and one mooncake. I hope we keep finding ways to spend quality time together when we're away from home for a festival."], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "spend quality time", "zh": "好好相处"}]}], "adaptations": [{"id": "p2-30", "note": "多说朋友之间的互动，比如拼桌、分月饼、边吃边聊。"}, {"id": "p2-32", "note": "交代是中秋节、在朋友家以及大约十个人，结尾回到思乡。"}, {"id": "p2-58", "note": "直接从月饼切入，讲口味、分着吃和家里过节的回忆。"}, {"id": "p2-49", "note": "用组织者的角度，说明你怎样安排带菜、桌椅和人数。"}], "lesson": "在海外和朋友过中秋", "extended": true}, {"id": "p2-u4", "kind": "经历", "status": "通用素材", "zh": "大学第一次合租", "en": "Moving into a shared flat at uni", "related": "p3-37", "questions": [{"prompt": "Describe a decision that helped you become more independent.", "hooks": ["上大学第一次合租", "电费·重复买菜·轮班", "开始会自己安排"], "phrase": ["settle in", "逐渐适应新环境"], "answer": ["When I think about this question, the first thing that comes to mind is the first shared flat I lived in at university. I'd been excited about choosing when to cook and when to come home, but I'd never had to keep track of bills or work out how much a whole week's food actually cost.", "The first month was a mess. My flatmate and I both bought milk twice in the same week, and neither of us noticed the electricity bill sitting by the front door. We decided to put a list on the fridge and take turns buying things we both used. I also started writing down what I'd spent each Sunday, which showed me how much I was paying for food on the way home.", "It took a little while to settle in, but I'm glad I had to figure those things out. I still ask my parents for advice sometimes. The difference now is that I have a much better idea of what I can handle myself. Overall, I feel more independent now that I know how to handle my own finances and work out a routine with someone else."], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "handle my own finances", "zh": "管理自己的财务"}]}], "adaptations": [{"id": "p2-37", "note": "说清住家通勤和搬出去之间的选择，补上决定前最担心的一笔开销。"}, {"id": "p2-41", "note": "只拿一个确实持续的变化来讲，比如每周日记账。"}, {"id": "p2-17", "note": "把室友的办法放在中心，解释冰箱清单如何避免重复买菜。"}, {"id": "p2-24", "note": "多说搬出去之前的顾虑，再用能自己管理预算说明结果为何让你满意。"}], "lesson": "大学独立生活", "extended": true}, {"id": "p2-u5", "kind": "地点", "status": "通用素材", "zh": "社区图书馆重新开门", "en": "The library that reopened near home", "related": "p3-76", "questions": [{"prompt": "Describe a change in your neighbourhood that you were pleased about.", "hooks": ["家门口旧图书馆", "翻新后采光和展览", "有免费自习的地方"], "phrase": ["hold on to a seat", "保住一个座位"], "answer": ["I'd like to talk about the reopening of the library in my neighbourhood. I used to walk past it on the way to school, and all I remember from the old building is a narrow entrance and a reading room that always seemed to be full.", "I went back on the first weekend after it reopened. There's a much brighter room upstairs now, with big windows and shared tables. It has a quiet, slightly academic atmosphere, even on a Saturday. I ended up staying for an hour because there was a small exhibition of old photographs of our street. In one of the pictures I could actually see the bakery my parents used to take me to, though almost everything around it had changed.", "I use the library quite a lot now, especially when I need a quiet place to work. It's good to have somewhere local where you don't feel you need to keep ordering coffee just to hold on to a seat. I hope more people get to enjoy the exhibitions and see how much the area has changed."], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "批改稿", "en": "academic atmosphere", "zh": "学习氛围"}]}, {"prompt": "Describe a change in your neighbourhood that you were pleased about.", "label": "课堂完整范例 · 翻新的社区图书馆", "hooks": ["社区图书馆 · 政府拨款 · 工程延期", "外观像地球仪 · 室内变宽敞", "新增藏书 · 自习室 · 冥想室", "爱阅读 · 步行可到 · 想常去"], "answer": ["When I think about this question, the first thing that comes to mind is the renovation of the library in my community. There have been several changes near where I live, but that was the one I noticed most. I still remember hearing that the local government had set aside money to enlarge it. It was supposed to take just a year, but work was delayed during the pandemic.", "Compared with the old library, the renovated one looks quite modern. It has an artistic exterior that looks a bit like a huge globe. The layout inside has changed too, so there's more space to move around and more places to sit down and read.", "The library now has a much wider selection of books and magazines. There are also quiet study rooms with computers, as well as a meditation room. I didn't expect to find that in a library, but it's nice to have somewhere quiet to go for a few minutes if you've been studying for hours.", "As an avid reader, I was really pleased when it reopened. In the future, I think I'll spend more of my spare time there. It's within walking distance of my home, so I can drop by and read even when I only have an hour."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "within walking distance", "zh": "步行可达"}, {"kind": "课件", "en": "avid reader", "zh": "爱读书的人"}]}], "adaptations": [{"id": "p2-76", "note": "先说建筑在哪、外观和你怎么知道它的，再讲里面最喜欢的位置。"}, {"id": "p2-83", "note": "聚焦自习区的声音、光线，以及为什么你能专心。"}, {"id": "p2-64", "note": "改从得知重开消息讲起，说明邻居为什么关注。"}], "lesson": "图书馆与社区变化", "extended": true}, {"id": "p2-u6", "kind": "人物", "status": "通用素材", "zh": "楼里很会聊天的年长邻居", "en": "The older neighbour I got to know online", "related": "p3-5", "questions": [{"prompt": "Describe someone you enjoy talking to.", "hooks": ["疫情小区微信群", "各自看同一部电影 · 看完聊剧情", "有代沟也聊得来"], "phrase": ["make space for someone to speak", "留出空间让别人表达"], "answer": ["I'm going to tell you about an older neighbour I got to know through our building's WeChat group. Everyone was staying indoors during lockdown, so the group chat was one of the few ways to meet people in the building. He posted a funny video about a dog, and I messaged him to ask where he'd found it. We ended up chatting every few days.", "One evening I mentioned that I'd started to find the days pretty repetitive. He asked what I'd normally do on a Friday, and I said I'd probably watch a film with someone. We each watched the same film at home and chatted about it afterwards. I was sure he'd find it too strange, but he picked out a scene I'd barely noticed and explained why it had made him laugh.", "I think I enjoyed talking to him because he made space for what I had to say. He was also happy to try something new and didn't seem particularly worried about whether people his age normally did it. I still message him when I see a film I think he might like. Overall, I feel fortunate that we can still have a proper conversation about a film even when we see it quite differently."], "frames": ["I Introduction", "M Main points", "F Feelings / Future"]}], "adaptations": [{"id": "p2-5", "note": "明确年龄差，然后用认真回应和愿意尝试新事物来说明敬佩的原因。"}, {"id": "p2-9", "note": "把范围从你个人扩到楼群，补一个别人也愿意和他交流的例子。"}, {"id": "p2-19", "note": "讲具体帮助，比如隔离时主动关心邻居或帮忙联系生活物资。"}], "lesson": "年长邻居与倾听", "extended": true}, {"kind": "人物", "status": "当季", "zh": "有创造力的朋友", "en": "A creative friend", "id": "p2-88", "related": "p3-88", "extended": true, "questions": [{"prompt": "Describe a friend who comes up with creative ideas.", "hooks": ["认识于大学海报小组", "雨天活动取消·把门票变小地图", "学会先试一个版本"], "answer": ["When it comes to this topic, the first thing that comes to mind is my friend Mei, who came up with a creative way to guide people around a university event. She was always the person who'd look at the materials we'd already got and say, 'What else could we do with these?' I didn't think much of it until a plan went wrong and I saw her do it under pressure.", "We were going to run a little outdoor fair, but heavy rain meant we had to move everything indoors. The old tickets had a map that was now completely wrong. Mei took one, folded it in half and used the blank side to draw the new route. Then she added a few pictures so visitors could tell which room sold food and which one had games. We tried it on a student who'd just arrived, and he found the right room without asking anyone.", "I liked how ordinary the solution was. She'd used paper we were about to throw away and tested it in about five minutes. Now, when I'm stuck on a group task, I try to make one rough version before spending ages talking about what it should look like. I hope I can rise to the occasion as calmly as she did the next time a group plan falls through."], "phrase": ["make a rough version", "先做一个粗略版本"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "rise to the occasion", "zh": "迎难而上"}]}]}, {"kind": "事件", "status": "保留", "zh": "不太会用的科技产品", "en": "A device you find difficult to use", "id": "p2-89", "related": "p3-89", "extended": true, "questions": [{"prompt": "Describe a piece of technology you own that you find difficult to use.", "hooks": ["收到二手相机·想脱离自动挡", "改设置照片却变黑·看前后对比", "学会一点·还想继续用"], "answer": ["When I think about this question, the first thing that comes to mind is a second-hand camera my cousin gave me, which I still find tricky to use. I'd only taken pictures on my phone before, so I thought I'd be able to pick it up fairly quickly. I could get a decent picture on the automatic setting, but as soon as I tried changing anything myself, I more or less lost track of what the camera was doing.", "The first time I took it out in the evening, the photos came out much darker than the street actually looked. I'd changed two settings at once and couldn't remember which one had caused the problem. The next day I put a mug by the window and took the same photo several times, changing just one setting each time. I wrote the numbers down so I could compare them afterwards.", "That helped me understand one or two things, although I still look up the instructions when I haven't used it for a while. I like the pictures I get when it works, so I'd like to keep practising. For now, I'm happy if I can work out what went wrong without changing every button on the camera. I hope I'll get the hang of using it in low light if I keep practising one setting at a time."], "phrase": ["pick something up", "学会某事"], "frames": ["I Introduction", "M Main points", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "get the hang of", "zh": "逐渐掌握窍门"}]}]}, {"id": "p2-course-yunnan", "kind": "地点", "status": "通用素材", "theme": "旅行", "zh": "想去云南慢慢旅行", "en": "A slow trip to Yunnan", "extended": true, "related": "p3-86", "adaptations": [{"id": "p2-86", "note": "保留将来时，把云南、同行朋友和体验当地生活作为主线。"}, {"id": "p2-52", "note": "把出行方式改成骑车环洱海，交代从哪出发、在哪里停、为什么想骑；保留体验当地生活的一段。"}, {"id": "p2-81", "note": "把行程缩为一天，选一个集市和一个靠近自然的地方，说明为何适合放空。"}], "questions": [{"prompt": "Describe a place you would like to travel to with friends.", "hooks": ["云南 · 气候温和 · 和好友去", "当地美食 · 节庆 · 体验日常", "安静 · 亲近自然 · 短暂休息", "希望以后多旅行 · 体验不一样的生活"], "answer": ["I'd like to talk about a place that has always appealed to me: Yunnan, in south-western China. The part I'd most like to visit is around Dali, where the weather is often mild. The local food and festivals are both things I'd love to experience, and I'd like to travel there with my best friends.", "We'd spend most of our time walking around and taking part in local activities to get a feel for daily life there. For example, I'd love to visit a market in the morning and try something local for breakfast. If there happened to be a festival while we were there, we'd spend some time seeing how people celebrate it.", "The main reason I'd like to go is the peace and quiet and the chance to get close to nature. I think it would be a great opportunity to slow down for a while and recharge our batteries, so that we can get back to our usual lives with more energy. I'd probably stay for a few days. For me, that's long enough to have a proper break.", "In the future, I hope I can travel to more places and experience different ways of life. I'd be happy to start with a few days in Yunnan."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "get close to nature", "zh": "亲近自然"}, {"kind": "课件", "en": "recharge", "zh": "恢复精力"}, {"kind": "课件", "en": "slow down", "zh": "放慢节奏"}, {"kind": "课件", "en": "recharge our batteries", "zh": "给自己充电"}, {"kind": "课件", "en": "get a feel for daily life", "zh": "体验当地生活"}]}]}, {"id": "p2-course-hike", "kind": "事件", "status": "通用素材", "theme": "旅行", "zh": "雨后走错路的徒步", "en": "A hike that took an unexpected turn", "extended": true, "related": "p3-82", "adaptations": [{"id": "p2-82", "note": "提前点出瀑布的位置，主体保留林间小路和瀑布的声音、岩石和绿色植被。"}, {"id": "p2-35", "note": "一句话交代原本计划，重点讲走错岔路后为什么改走低处，以及结果。"}, {"id": "p2-43", "note": "补上往返车票和自带午餐的花费，说明为什么这趟低预算出游依然难忘。"}, {"id": "p2-34", "note": "把早起赶第一班车放在开头，多说清晨进山看到和听到什么。"}], "questions": [{"prompt": "Describe an outdoor trip that turned out differently from what you expected.", "hooks": ["第一次自己规划 · 山路 · 同学同行", "密林 · 陡坡 · 找错岔路", "原路折返 · 改走低处 · 看到瀑布", "累但满足 · 下次留余量"], "answer": ["I'm going to tell you about a hike I planned with two friends from university. It was our first time organising a trip without anyone who knew the area. We'd seen pictures of a waterfall and worked out that we could get there and back on a day ticket, so we went on a Saturday.", "We hit the trail after breakfast. The first stretch ran through dense forest, and everything looked fresh after the rain. Then we took a wrong turn and ended up halfway up a steep slope. We stopped to catch our breath and realised the sound of running water was coming from the path below us.", "We went back to the last junction and decided to stick to the lower trail. We reached the waterfall about an hour later than planned. The water was coming down in sheets, and the rocks were covered in lush greenery. We ate our sandwiches well back from the water and caught the last bus with minutes to spare.", "I'm glad we were able to change our plans and still finish the hike. In the future, I think I will download the map before I leave and give myself more time to get back."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "hit the trail", "zh": "出发去徒步"}, {"kind": "课件", "en": "dense forest", "zh": "茂密的森林"}, {"kind": "课件", "en": "steep slope", "zh": "陡坡"}, {"kind": "课件", "en": "lush greenery", "zh": "茂盛的绿植"}]}]}, {"id": "p2-course-delay", "kind": "事件", "status": "通用素材", "theme": "旅行", "zh": "出发前才改期的旅行", "en": "A trip that had to be put off", "extended": true, "related": "p3-35", "adaptations": [{"id": "p2-35", "note": "把取消通知、为什么宁可改期和后来结果放在中心，目的地只需一句带过。"}, {"id": "p2-24", "note": "先说「是否仍按原假期出发」这个决定，再对照改期前后的实际结果。"}], "questions": [{"prompt": "Describe a trip you were looking forward to that had to be delayed.", "hooks": ["第一次自己出国 · 盼着见朋友", "收到取消通知 · 找可改签的班次", "失望 · 改订住宿 · 留足时间", "改期也有好结果 · 下次留弹性"], "answer": ["I'd like to talk about a trip I was looking forward to that had to be put off. A friend from university had moved to Singapore, and I'd booked a long weekend to go and see her. It would have been my first time travelling abroad on my own, and I'd spent weeks looking forward to seeing the neighbourhood where she lived.", "The evening before I was due to leave, I got an email saying my flight had been cancelled. I looked at the flights I could switch to, but the earliest one would have got me there on the last evening of my break. After a quick call with my friend, I decided to move the whole trip to the following month.", "At first I felt really frustrated. I'd packed and even arranged how to get to the airport. Luckily, I could change my hotel booking. My friend had an extra day off the following month, so we ended up having more time together than we'd originally planned.", "Overall, I feel that putting the trip off was the right call. In the future, I think I'll book accommodation that I can change easily, especially when there aren't many flights to choose from."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"]}]}, {"id": "p2-course-work", "kind": "事件", "status": "通用素材", "theme": "工作", "zh": "想做一份有意义的教学工作", "en": "A job I'd like to do: teaching", "extended": true, "related": "p3-69", "adaptations": [{"id": "p2-69", "note": "以岗位、实际任务和适合你的原因为主，课业负担用来补充对工作的真实认识。"}, {"id": "p2-62", "note": "把成为英语教师设成长期目标，交代下一步每周试教一次，以及怎样观察学生进步。"}], "questions": [{"prompt": "Describe a job you think would suit you.", "hooks": ["理想工作 · 教英语 · 为什么想到它", "备课 · 找学生卡点 · 练真实对话", "工作量 · 向同事请教 · 找到归属感", "先试小班 · 了解自己合不合适"], "answer": ["When it comes to this topic, the first thing that comes to mind is teaching English at a language centre. I've helped a couple of classmates prepare for presentations, and I really enjoyed working out what was stopping them from saying what they wanted to say. That's what first made me consider teaching as a job.", "I'd want to work somewhere with small classes. That way I could spend time preparing lessons that fit the group. If several students went blank in a role-play, for example, I'd give them a few phrases to get started and let them try the same conversation again with a different partner. I'd love to see whether they got further the second time.", "I know the workload can be heavy, especially when there's marking to do and another class to prepare for. A friendly working atmosphere would matter a lot to me. I'd like to work alongside people I could ask for advice and share lesson ideas with. I think that would give me a sense of belonging as well.", "In the future, I hope I can start by teaching a small group once a week. I'd get a better idea of what the job feels like when you're the one responsible for everyone's progress."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "working atmosphere", "zh": "工作氛围"}, {"kind": "课件", "en": "workload can be heavy", "zh": "工作量可能很大"}, {"kind": "课件", "en": "a sense of belonging", "zh": "归属感"}]}]}, {"id": "p2-course-music", "kind": "事件", "status": "通用素材", "theme": "音乐", "zh": "考试后的一次现场音乐体验", "en": "A loud night out after finals", "extended": true, "related": "p3-72", "adaptations": [{"id": "p2-72", "note": "明确是去过的地方，保留耳边的鼓点、地板震动和听不到朋友说话这三个细节。"}], "questions": [{"prompt": "Describe a time when music around you was louder than you expected.", "hooks": ["期末考完 · 朋友邀约 · 去夜店", "电子乐 · 歌曲加速 · 鼓点震地板", "听不清朋友 · 人群喊叫跳舞", "焦虑 · 之后避开类似场合"], "answer": ["I'd like to talk about a night out after my final exams. A friend took me to a nightclub to have some fun. He meant well, but I found the place incredibly noisy. I felt uneasy almost as soon as we got inside.", "I couldn't stand the music the DJ was playing. Most of the songs were electronic tracks with a fast tempo and really piercing high notes. Even a slow love song had been turned into a fast dance track. The drumbeat was so loud that the floor was shaking.", "I couldn't hear what my friend was saying even though he was sitting next to me. People around us were shouting and dancing. I kept thinking I'd get used to the noise, but that never really happened, and I felt out of place the whole time.", "Overall, I felt anxious and stressed out. I haven't been back to a nightclub since. I still enjoy music, but in the future I think I'll choose somewhere I can hear the person next to me."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "fast tempo", "zh": "节奏快"}, {"kind": "课件", "en": "piercing high notes", "zh": "刺耳的高音"}]}]}, {"id": "p2-course-film", "kind": "事件", "status": "通用素材", "theme": "电影", "zh": "看完还想聊的《瞬息全宇宙》", "en": "A film I kept thinking about", "extended": true, "related": "p3-53", "adaptations": [{"id": "p2-53", "note": "如果这部电影确实让你失望，以真实体验为准；突出具体不喜欢的剪辑和节奏，结尾交代最后是否改观。"}, {"id": "p2-40", "note": "把原看法改成「我以为它只是动作片」，然后讲室友的哪句话让你重新理解母女关系。"}], "questions": [{"prompt": "Describe a film you felt strongly about.", "hooks": ["朋友推荐 · 和室友看 · 以为是动作片", "平行世界 · 母女关系 · 谁能替孩子做决定", "剪辑太快 · 开始不喜欢 · 聊完改观", "感受复杂 · 希望重看"], "answer": ["I'm going to tell you about Everything Everywhere All at Once, which I watched at home with my flatmate. A friend had described it as a funny action film, so I expected something we could watch while eating dinner. About twenty minutes in, we'd both put our food down because we were trying to follow what was happening.", "Michelle Yeoh plays Evelyn, a mother who can see how different versions of her life might have turned out. The film is full of twists and turns, but the story I wanted to follow was the one between Evelyn and her daughter, Joy. Evelyn cares about Joy, and you can see how often that turns into trying to decide what Joy should do.", "At first I found the editing chaotic. My flatmate had a different reaction. She said the film felt most honest in the moments when the two characters struggled to say anything at all. We talked about that after the film, and it made me think about how much I sometimes miss when I'm waiting for a big scene.", "Overall, I feel quite attached to that part of the story. I hope I can watch it again with someone who hasn't seen it and hear what they make of the relationship."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "full of twists and turns", "zh": "情节多次反转"}, {"kind": "课件", "en": "found the editing chaotic", "zh": "觉得剪辑混乱"}]}]}, {"id": "p2-course-clothes", "kind": "事件", "status": "通用素材", "theme": "服装", "zh": "兼职咖啡店的制服", "en": "The uniform I wore at a café", "extended": true, "related": "p3-56", "adaptations": [{"id": "p2-56", "note": "换成希望引入的新规定时，先提出明确条款，比如允许岗位员工按季节选轻便制服，再用咖啡店经历解释原因。"}, {"id": "p2-36", "note": "把四个人如何收集意见、向经理建议和试用新版围裙放到中心，补上你的职责。"}], "questions": [{"prompt": "Describe a rule about clothing that you had to follow.", "hooks": ["咖啡店兼职 · 开班前换制服", "来客找人 · 显得专业 · 有团队感", "围裙厚 · 夏天太热 · 提出调整", "理解规定 · 今后会兼顾舒适"], "answer": ["I'd like to talk about the dress code at a café where I worked on Saturdays. We had to wear plain black trousers, dark shoes and a navy apron with our name on it. I remember turning up on my first day and checking what everyone else was wearing before I tied mine on.", "I could see the point once it got busy. Customers could tell who worked there without having to ask, which mattered when people were queuing to pay. The uniform made us look a bit more professional. It gave me a sense of belonging as well, especially when I was new and still learning where everything was.", "The one thing I disliked was the fabric. The aprons were thick, and I was often the one carrying trays in and out of the kitchen. A couple of us asked if we could use lighter ones in hot weather. Our manager tried a cotton version the next month, and several people switched straight away.", "Overall, I feel the rule worked well once we could choose a more comfortable apron. If I ever had to decide on a uniform for a team, I'd ask the people wearing it what a full shift in it would feel like."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "a sense of belonging", "zh": "归属感"}, {"kind": "课件", "en": "dress code", "zh": "着装规定"}]}]}, {"id": "p2-course-trees", "kind": "事件", "status": "通用素材", "theme": "环保", "zh": "和邻居种第一棵树", "en": "Planting a tree with my neighbours", "extended": true, "related": "p3-63", "adaptations": [{"id": "p2-12", "note": "把会种树的邻居设为主角，讲她为什么喜欢、怎么教你判断坑的深浅和土壤松紧。"}, {"id": "p2-36", "note": "突出分工挖坑、扶树和轮流浇水，并具体交代你做了哪一部分。"}, {"id": "p2-63", "note": "另起一句提出环保法，比如要求公共绿化工程包含养护计划，再用种树故事说明原因。"}], "questions": [{"prompt": "Describe something you did to improve your local environment.", "hooks": ["楼旁空地 · 社区植树日", "邻居教我 · 挖坑 · 扶树回填", "轮流浇水 · 夏天遮阴 · 居民用起来", "更愿意参与 · 希望长期照料"], "answer": ["I'm going to tell you about a tree-planting day I joined in my neighbourhood. There was an empty patch of ground next to our block where people sometimes left their bikes. A few neighbours asked whether we could turn it into a small green space, and the community centre offered us a dozen young trees.", "I worked with a neighbour who'd grown fruit trees before. We used a spade to dig a hole, and she showed me how deep it needed to be. I held the young tree upright while she filled the hole. She told me to leave the soil loose enough for the roots to spread, then passed me a watering can.", "By the end of the morning we'd planted two trees together. I signed up to water them once a week until the weather cooled down. The trees are still small, but I can already see how they'll change the space. In a few summers I'd love to see people sitting there in the shade.", "Overall, I feel proud that I know which tree I helped plant and that I can check on it on my way home. I hope we keep looking after the trees now that the planting day is over."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "dig a hole", "zh": "挖坑"}, {"kind": "课件", "en": "watering can", "zh": "浇水壶"}]}]}, {"id": "p2-course-exams", "kind": "事件", "status": "通用素材", "theme": "备考", "zh": "一边兼职一边准备期末考", "en": "Preparing for finals while working part-time", "extended": true, "related": "p3-50", "adaptations": [{"id": "p2-50", "note": "把主线放在「按截止时间排序＋任务拆小」，用通勤复述解释具体怎么省时间。"}, {"id": "p2-1", "note": "把完成难事的人作为主角，补清楚对方的工作安排，以及他是怎么解决复习卡点的。"}, {"id": "p2-3", "note": "用亲眼见过的清单和每周安排来证明对方有条理，最后解释你跟他学到了什么。"}], "questions": [{"prompt": "Describe a time you managed several responsibilities at once.", "hooks": ["期末将近 · 还要兼职 · 背术语没进展", "按到期日排序 · 大任务拆小 · 通勤练复述", "找同学对答案 · 尽早暴露错误 · 放弃重抄", "成就感 · 下次提早拆任务"], "answer": ["When it comes to this topic, the first thing that comes to mind is the week I had to prepare for a final exam while working part-time. My exam was just around the corner, and I couldn't take time off. I was trying to juggle my shifts and revision, and I kept coming home too tired to make much progress.", "I made a to-do list for the week and prioritised tasks by when they were due. Then I broke the revision down into smaller tasks. On the bus I picked three terms and tried to explain them in my own words. On evenings when I had more time, I did a practice question and checked where I'd gone wrong.", "A friend and I compared our answers a couple of days before the exam. She spotted that I'd been mixing up two terms since the beginning of the course. After that I stopped rewriting my notes and did two more practice questions on those topics. I walked into the exam feeling much clearer about what I knew.", "Overall, I feel a sense of achievement because I managed to stay on top of my shifts and pass the exam. Next time I'd make the list a week earlier and give myself an evening off before the exam."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "sense of achievement", "zh": "成就感"}, {"kind": "课件", "en": "around the corner", "zh": "快到了"}, {"kind": "课件", "en": "juggle my shifts and revision", "zh": "兼顾排班和复习"}, {"kind": "课件", "en": "broke the revision down into smaller tasks", "zh": "把复习拆成小任务"}]}]}, {"id": "p2-course-history", "kind": "事件", "status": "通用素材", "theme": "历史", "zh": "从一首李白的诗认识唐朝", "en": "Discovering the Tang Dynasty through a poem", "extended": true, "related": "p3-7", "adaptations": [{"id": "p2-7", "note": "改成爱历史的朋友为主角，让他推荐诗、带你看展，并点明他怎样讲解唐朝的生活。"}, {"id": "p2-54", "note": "换成一本唐诗选集，重点讲你读了哪些内容、为什么没放下，再保留纪录片或看展作为余波。"}, {"id": "p2-45", "note": "把纪录片换成一节正式课程，明确课堂上老师展示了什么、你之后做了什么。"}], "questions": [{"prompt": "Describe a period of history that interests you.", "hooks": ["唐朝 · 重读李白 · 为什么感兴趣", "自然意象 · 朋友 · 把诗放回时代", "博物馆 · 展品 · 看到时代联系", "找文化根源 · 想读更多"], "answer": ["I'd like to talk about the Tang Dynasty, which I got interested in after rereading a poem by Li Bai. I'd learned a few lines at school and remembered them well enough to recite them, but I couldn't have explained why I liked them. Years later, a friend sent me a recording and I started paying attention to the images in the poem.", "What struck me was how simple some of the details were. You could picture a person looking out over water or saying goodbye to a friend. I wanted to know what life was like when those poems were written, so I watched a short documentary. It helped me put the poems into context and see why people describe the Tang as a golden age of Chinese arts and culture.", "I later went to an exhibition with the friend who sent me the recording. We found ourselves looking at an object made in another part of Asia and trying to work out how it had ended up in China. I came away wanting to learn more about the people and ideas that travelled along the Silk Road.", "Overall, I feel that reading the poems helped me trace my cultural roots in a very personal way. I hope I get to learn more about the period one poem or object at a time."], "frames": ["I Introduction", "M Main points", "M 具体场景", "F Feelings / Future"], "courseVocab": [{"kind": "课件", "en": "trace my cultural roots", "zh": "追溯文化根源"}, {"kind": "课件", "en": "put the poems into context", "zh": "把诗放到当时的背景下理解"}, {"kind": "课件", "en": "a golden age of Chinese arts and culture", "zh": "中国艺术和文化的黄金时期"}]}]}], "3": [{"kind": "人物", "status": "当季", "zh": "完成难事的人", "en": "Someone who pulled off a difficult task", "id": "p3-1", "related": "p2-1", "questions": [{"prompt": "Why do people keep going when a task gets harder than they expected?", "hooks": ["有几个原因", "事情对本人重要", "小进展让人坚持"], "answer": ["There are several reasons.", "One reason is that the task can mean something to them personally. People may keep working on a reading room if they know the children who'll use it.", "Another reason is that seeing a bit of progress makes the next step feel possible. Getting one shelf up can give the group enough confidence to carry on."], "phrase": ["signs of progress", "取得进展的迹象"], "audioId": "p3-1-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why can small signs of progress help people stick with a difficult task?", "hooks": ["有几个原因", "知道努力有回报", "可以及时调整"], "answer": ["There are several reasons.", "One reason is that a small result shows that the work is paying off. If a learner manages one real conversation, the larger goal suddenly feels closer.", "Apart from that, early feedback shows them what to change. They can try a different way of practising before they get discouraged."], "phrase": ["stick with a difficult task", "坚持做一件难事"], "audioId": "p3-bank-support", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "课件", "en": "paying off", "zh": "取得回报"}]}, {"prompt": "Are personal goals easier to reach alone or with other people?", "hooks": ["取决于 · what kind of help the goal calls for", "自己练可灵活调节", "同伴给反馈与督促"], "answer": ["It depends on what kind of help the goal calls for.", "If the goal mainly involves building a habit, working alone can make it easier to practise at times that suit you and spend longer on weak points.", "However, if the goal depends on feedback, working with another person is usually more helpful. A practice partner can point out something you'd never notice on your own."], "phrase": ["keep someone accountable", "帮某人保持自我约束"], "audioId": "p3-bank-goals", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "人物", "status": "当季", "zh": "快乐的人", "en": "Someone who seems genuinely cheerful", "id": "p3-2", "related": "p2-2", "questions": [{"prompt": "Can people learn to be happier, or is it mainly a matter of personality?", "hooks": ["性格有影响·习惯也能改", "见友或出门有盼头", "压力源不会全消失"], "answer": ["Personality probably plays a part, but habits can change how people feel day to day.", "Making time for friends or getting outside may give someone more things to look forward to.", "Of course, those habits can't remove every source of stress."], "phrase": ["play a part", "起到一定作用"], "audioId": "p3-2-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why do some enjoyable activities become stressful over time?", "hooks": ["有几个原因", "开始计成绩", "还想证明给别人看"], "answer": ["There are several reasons.", "One reason is that people start measuring something they used to do for fun. A runner can feel disappointed about an ordinary outing if every time has to be faster.", "In addition, there may be pressure from other people. Once friends expect updates or results, even skipping one session can feel like letting someone down."], "phrase": ["compare results", "比较结果"], "audioId": "p3-bank-mood", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Do people relax differently when they spend time outdoors and when they use a screen?", "hooks": ["取决于 · how tired people are and how much time they have", "白天久坐可出门换环境", "雨天累时看东西也方便"], "answer": ["It depends on how tired people are and how much time they have.", "If someone has been at a desk all day and has time to spare, getting outside can help them wind down. Even a short walk is a change of surroundings.", "However, if it's raining and they're already tired, watching something can be easier. I think it works best when they decide how long they want to spend on it before they start."], "phrase": ["a change of surroundings", "换个环境"], "audioId": "p3-bank-leisure", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "wind down", "zh": "放松下来"}]}]}, {"kind": "人物", "status": "当季", "zh": "做事有条理的人", "en": "Someone who plans things well", "id": "p3-3", "related": "p2-3", "questions": [{"prompt": "Can being too organised ever cause problems?", "hooks": ["计划太死会出问题", "旅程排满接不了邀请", "基本计划留些空"], "answer": ["It can if someone treats the plan as fixed.", "On a trip, for example, a packed schedule can leave no time for an unexpected invitation.", "A basic plan with a few gaps is often more useful than planning every hour."], "phrase": ["a packed schedule", "排得很满的日程"], "audioId": "p3-3-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Are detailed plans more useful for groups or for individuals?", "hooks": ["取决于 · how many people need to coordinate", "多人要对齐时间地点", "一个人可随时改"], "answer": ["It depends on how many people need to coordinate.", "If several people are involved, a clear plan makes it easier to know when to arrive, what to bring and who needs an answer from you.", "However, if you're going out on your own, a rough plan may be enough. You can change direction halfway through without holding anybody up."], "phrase": ["leave something fairly open", "给安排留出余地"], "audioId": "p3-bank-plans", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Is it better to plan a whole day in detail or decide what matters most?", "hooks": ["取决于 · how fixed the day's commitments are", "有预约换乘该细排", "普通一天抓重点"], "answer": ["It depends on how fixed the day's commitments are.", "If you have a train to catch or several people to meet, writing down the exact times helps you stay on track.", "However, on an ordinary day, I'd rather prioritise two or three tasks and leave room for things to change. Otherwise the whole schedule can fall apart as soon as one job takes longer than expected."], "phrase": ["something takes longer than expected", "某事比预想更费时"], "audioId": "p3-bank-schedule", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题", "courseVocab": [{"kind": "课件", "en": "stay on track", "zh": "保持进度"}]}]}, {"kind": "人物", "status": "当季", "zh": "爱拍照的人", "en": "Someone who takes photos wherever they go", "id": "p3-4", "related": "p2-4", "questions": [{"prompt": "How has being able to take photos on a phone changed the way people travel?", "hooks": ["随手记小事", "菜单照片唤起一顿饭", "老想着发帖会分心"], "answer": ["It's easier to record little details, so people come home with a fuller picture of the trip.", "A photo of a menu can bring back a meal you might otherwise forget.", "The downside is that taking photos can take over if you're always thinking about what to post."], "phrase": ["bring back a memory", "唤起回忆"], "audioId": "p3-4-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Why might people value personal photos more as they get older?", "hooks": ["有几个原因", "照片留下会变化的地方", "让回忆可以分享"], "answer": ["There are several reasons.", "One reason is that a photo preserves details people don't notice disappearing. An old picture of a street might bring back a shop that's been gone for years.", "Besides that, photos make memories easier to share. Someone can show a grandchild what their first home was like instead of trying to describe everything from memory."], "phrase": ["bring back details", "唤起细节"], "audioId": "p3-bank-photos", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "Why can short online videos be easier to remember than long explanations?", "hooks": ["有几个原因", "内容只聚焦一点", "动作更直观"], "answer": ["There are several reasons.", "One reason is that short videos often concentrate on one question, so it's easier to know what to pay attention to.", "Another reason is that a visible action gives viewers something concrete to remember. Seeing the hands of a broken clock start moving again can stick with you longer than hearing an explanation of how it works."], "phrase": ["concentrate on one thing", "聚焦一件事"], "audioId": "p3-bank-media", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}]}, {"kind": "人物", "status": "当季", "zh": "敬佩的年长者", "en": "An older person you look up to", "id": "p3-5", "related": "p2-5", "questions": [{"prompt": "What can young and old people learn from each other?", "hooks": ["exchange knowledge", "practical judgement"], "answer": ["Older people can share experience, practical judgement and knowledge of the past, while younger people can introduce new technology, trends and different ways of thinking.", "The exchange works best when neither group assumes that age automatically makes one side right."], "vocab": ["exchange knowledge", "practical judgement", "mutual respect"], "audioId": "word3-8-1", "frames": ["Point 给出做法", "Reasons 解释或举例"], "type": "做法题"}, {"prompt": "Has the quality of life for old people improved compared to the past?", "hooks": ["life expectancy", "material improvements", "social isolation"], "answer": ["In many ways, yes.", "Healthcare, housing, transport and communication technology have improved, and people generally live longer.", "However, loneliness can still be a serious issue, especially when families live far apart, so material improvements don't automatically guarantee a better social life."], "vocab": ["life expectancy", "material improvements", "social isolation"], "audioId": "word3-8-2", "frames": ["Point 建立比较", "Reasons 对照差异", "比较后的判断"], "type": "比较题"}, {"prompt": "Why is there a generation gap between the young and the old?", "hooks": ["有几个原因", "成长环境和技术不同", "人生阶段关注点不同"], "answer": ["There are several reasons.", "One reason is that different generations grow up with different technology, economic conditions and social values. For example, a digital native may think of a phone as the obvious way to stay in touch.", "Apart from that, people may have different priorities at different ages. A younger person might be thinking about how to land a decent job, while an older relative may value stability from experience."], "vocab": ["different social values", "economic conditions", "understand the context"], "audioId": "word3-8-3", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题", "courseVocab": [{"kind": "课件", "en": "land a decent job", "zh": "找到一份体面的工作"}]}, {"prompt": "What do old people usually do in their daily life?", "hooks": ["community activities", "pursue hobbies", "remain socially active"], "answer": ["It varies greatly depending on health and retirement.", "Some look after grandchildren, exercise, meet friends or take part in community activities. Others continue working or pursue hobbies they didn't have time for earlier.", "We shouldn't assume retirement means being inactive."], "vocab": ["community activities", "pursue hobbies", "remain socially active"], "audioId": "word3-8-4", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What sports are popular among older people?", "hooks": ["low-impact exercise", "put strain on the joints"], "answer": ["Low-impact activities such as walking, swimming, tai chi and badminton are common because they can improve fitness without putting excessive strain on the joints.", "The best activity depends on a person's health, but social forms of exercise can also reduce isolation."], "vocab": ["low-impact exercise", "put strain on the joints", "social interaction"], "audioId": "word3-8-5", "frames": ["Point 给出判断", "Reasons 给理由或例子"], "type": "观点题"}, {"prompt": "What kinds of things do the elderly remember for a long time?", "hooks": ["emotionally significant events", "long-term memories"], "answer": ["People often remember emotionally significant events, such as weddings, the birth of children, major achievements or difficult periods.", "They may also remember music, places and routines from their youth particularly clearly because these are connected with strong personal experiences."], "vocab": ["emotionally significant events", "long-term memories", "be associated with youth"], "audioId": "word3-8-6", "frames": ["Point 给出判断", "Reasons 给理由或例子"], "type": "观点题"}], "lesson": "代际交流"}, {"kind": "人物", "status": "当季", "zh": "擅长做手工的人", "en": "Someone who makes things by hand", "id": "p3-6", "related": "p2-6", "questions": [{"prompt": "Why do some people pay more for handmade goods?", "hooks": ["有几个原因", "可按需要定制", "支持熟悉的制作者"], "answer": ["There are several reasons.", "One reason is that a handmade item can be made to fit a particular need. A bag with the pockets exactly where you want them may be worth paying more for.", "In addition, people may value knowing who made it. Being able to talk to the maker and find out how to look after the item can make the purchase feel more personal."], "phrase": ["mass-produced goods", "批量生产的商品"], "audioId": "p3-6-0", "frames": ["Point 开场", "Reason 1", "Reason 2"], "type": "Why 原因题"}, {"prompt": "How do handmade goods and factory-made goods meet different needs?", "hooks": ["取决于 · what the person needs from the product", "换标准件量产更容易", "需要定制手作更合适"], "answer": ["It depends on what the person needs from the product.", "If you just need a replacement quickly, something factory-made is often cheaper and easier to find in a standard size.", "However, if you need a particular fit or expect to have the item repaired later, a handmade product may be worth it. You can often speak to the maker about what you actually need."], "phrase": ["a standard size", "标准尺寸"], "audioId": "p3-bank-craft", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Do homemade gifts and bought gifts show care in different ways?", "hooks": ["取决于 · what the recipient would value", "爱有纪念意义适合手工", "实际需要可以买"], "answer": ["It depends on what the recipient would value.", "If somebody values the time and effort behind a gift, making it yourself can mean a lot, especially if you include a detail only they would recognise.", "However, if the person has a practical need, a bought gift can be just as thoughtful. It shows you've paid attention to what they've been saying."], "phrase": ["with someone in mind", "把某人放在心上"], "audioId": "p3-bank-gifts", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}]}, {"kind": "人物", "status": "当季", "zh": "喜爱历史的人", "en": "Someone who is fascinated by the past", "id": "p3-7", "related": "p2-7", "questions": [{"prompt": "How could schools make history more appealing to teenagers?", "hooks": ["让学生查本地问题", "对比今昔照片·找建筑为何消失", "熟地方让年代有意义"], "answer": ["They could give students a question that can be investigated locally.", "For example, students could compare old photographs with the streets they know and ask why certain buildings disappeared.", "It's easier to care about a date once you can connect it to a place you recognise."], "phrase": ["investigate locally", "在本地调查"], "audioId": "p3-7-0", "frames": ["Point 给出做法", "Reasons 解释或举例", "限制或下一步"], "type": "做法题"}, {"prompt": "Do you think children should begin learning history from an early age?", "hooks": ["age-appropriate content", "build curiosity", "memorise dates"], "answer": ["Yes, but the content should be age-appropriate.", "Young children don't need to memorise complicated dates.", "Stories about local places, historical figures and family history can introduce the idea that life was different in the past and gradually build curiosity."], "vocab": ["age-appropriate content", "build curiosity", "memorise dates"], "audioId": "word3-4-1", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "At what age do you think people should begin to learn history?", "hooks": ["simple timelines", "historical interpretation", "introduce complexity gradually"], "answer": ["Probably in primary school, although informal learning can start earlier.", "At around six or seven, children can understand simple timelines and stories about the past.", "More complex issues, such as political causes and competing interpretations, can be introduced later."], "vocab": ["simple timelines", "historical interpretation", "introduce complexity gradually"], "audioId": "word3-4-2", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "How do children learn history before they attend school?", "hooks": ["family stories", "informal learning", "connect history with experience"], "answer": ["Mostly through family stories, books, television and visits to museums or historic places.", "Even traditional festivals can teach children something about the past.", "This learning is usually informal, but it can create strong memories because it is connected to real people and experiences."], "vocab": ["family stories", "informal learning", "connect history with experience"], "audioId": "word3-4-3", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Is it important to learn how people in the past lived their lives?", "hooks": ["everyday life", "living standards", "take something for granted"], "answer": ["Yes, because history isn't only about wars and famous leaders.", "Everyday life tells us how societies were organised, what people valued and how technology changed living standards.", "It can also make us appreciate things we now take for granted."], "vocab": ["everyday life", "living standards", "take something for granted"], "audioId": "word3-4-4", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题", "courseVocab": [{"kind": "课件", "en": "take for granted", "zh": "视为理所当然"}]}, {"prompt": "Do you think people should learn ancient history before learning modern history?", "hooks": ["chronological framework", "provide background", "feel relevant"], "answer": ["Not necessarily in a strict order.", "Some basic ancient history provides useful background, but modern events may feel more relevant and easier for students to connect with.", "I think a broad chronological framework is useful, while teachers can still move between periods when there is a meaningful connection."], "vocab": ["chronological framework", "provide background", "feel relevant"], "audioId": "word3-4-5", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "Besides big historical events, what else is important when learning history?", "hooks": ["social and cultural history", "ordinary people's lives", "the wider social impact"], "answer": ["Social and cultural history are extremely important.", "We should learn about ordinary people's lives, education, work, migration, art and changes in technology.", "These topics help us understand how major events affected society rather than viewing history only from the perspective of rulers and wars."], "vocab": ["social and cultural history", "ordinary people's lives", "the wider social impact"], "audioId": "word3-4-6", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}], "lesson": "历史课与生活"}, {"kind": "人物", "status": "当季", "zh": "教你技能的人", "en": "Someone who helped you pick up a skill", "id": "p3-8", "related": "p2-8", "questions": [{"prompt": "When is learning from a person more useful than learning from a video?", "hooks": ["真人能辨问题", "老师看锅过热", "视频适合按自己节奏复习"], "answer": ["A person can see exactly what's going wrong and adjust the explanation.", "In a cooking lesson, they might notice that your pan is too hot even if you've followed the recipe.", "A video is handy for reviewing the steps later at your own pace."], "phrase": ["at your own pace", "按自己的节奏"], "audioId": "p3-8-0", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}, {"prompt": "What can a group course offer that studying on your own cannot?", "hooks": ["取决于 · what the learner is struggling with", "复习熟知识适合独立", "卡在错误上适合小组"], "answer": ["It depends on what the learner is struggling with.", "If you're reviewing material you've seen before, studying alone lets you work at your own pace and spend more time on anything you're unsure about.", "However, if you keep getting stuck on the same thing, a group can give you feedback. Somebody may spot an error you've stopped noticing or show you another way to approach it."], "phrase": ["spot an error", "发现错误"], "audioId": "p3-bank-lessons", "frames": ["Point 取决于什么", "Situation 1", "Situation 2"], "type": "Idea 情形题"}, {"prompt": "Should schools let students make more mistakes when learning a skill?", "hooks": ["允许可逆错误", "发现原因", "高风险场景要指导"], "answer": ["Yes, where the consequences are small. Finding out why something went wrong often makes the lesson easier to remember.", "A student who tests a few versions of a presentation can see which one is easier to follow.", "For something where a mistake could hurt somebody, of course, the teacher needs to demonstrate a safe way to practise first."], "phrase": ["a safe way to practise", "安全的练习方式"], "audioId": "p3-bank-mistakes", "frames": ["Point 给出判断", "Reasons 给理由或例子", "条件或收束"], "type": "观点题"}]}, {"kind": "人物", "status": "当季", "zh": "受欢迎的人", "en": "Someone people enjoy being around", "id": "p3-9", "related": "p2-9", "questions": [{"prompt": "What makes someone popular in a school or workplace?", "hooks": ["自信能先被看见",
